<!-- ============================================================
     STX EU / DESIGN SHEET v1 (sectiebestand voor de section loader)
     Laadt de STX Design Sheet (sections/design-sheet/app-v10.html)
     schermvullend op de pagina /design-sheet (alle talen).

     TOEGANG (sinds 27/10/2026, uit beta): iedereen ziet een kaart
     "Coming soon". Alleen een ingelogd account waarvan het contact (of
     het bedrijf) in Odoo het label 'AI Beta' heeft, krijgt de tool.
     Een portaalaccount mag zijn eigen labels niet lezen, dus de vraag
     gaat via de AI-server (ACCESS_ENDPOINT): de pagina maakt als dit
     account een x_stx_ai_request, de server leest met zijn eigen sleutel
     wie dat was en kijkt naar het label (zelfde controle als de AI-knop).
     Een "ja" wordt 12 uur onthouden in deze browser (per account).
     Label weggehaald = na hoogstens 12 uur weer "Coming soon"; de AI
     zelf controleert het label toch bij elk beeld. De oude schakelaar
     #stxdesign bestaat niet meer.

     Hoe het werkt:
     - De app is een volledige HTML-pagina (canvas, eigen balk en
       panelen). Ze draait in een iframe met srcdoc. Zo botst haar CSS
       niet met Odoo, en toch is het iframe 'same origin' met de shop:
       winkelmand (/shop/cart/add), zoeken (/website/snippet/autocomplete),
       prijzen en de Odoo-login werken zoals op de shop zelf.
     - Bovenaan de app komt window.STX_ENV met: shop = true, het adres
       van de AI-server, de taal en een terugknop naar de shop.
     - Het app-bestand komt van jsDelivr op dezelfde commit als deze
       sectie (de loader zet window.STX_SECTIONS_BASE, vanaf loader v28).
       Oudere loader: valt terug op APP_FALLBACK hieronder.

     CONFIG hieronder:
     - AI_ENDPOINT: adres van de STX AI-server (Vercel, map
       stx-ai-proxy in de hoofdrepo). Leeg = alleen de handmatige
       werkwijze (prompt kopieren, zelf genereren).
     ============================================================ -->
<div id="stx-ds-root"></div>
<script>
(function () {
  'use strict';

  /* ---- CONFIG ---- */
  var ACCESS_ENDPOINT = 'https://stx-ai-proxy.vercel.app/api/access';  // label 'AI Beta' in Odoo = toegang
  var ACCESS_KEY = 'stx_design_access';  // { uid, until }: een "ja" van de server, 12 uur geldig
  var ACCESS_HOURS = 12;
  var APP_FILE = 'design-sheet/app-v10.html';
  var APP_FALLBACK = '';                 // volledige jsDelivr-URL, enkel nodig met een loader zonder STX_SECTIONS_BASE
  var AI_ENDPOINT = 'https://stx-ai-proxy.vercel.app/api/impression';   // stx-ai-proxy in de hoofdrepo (Vercel)

  function wallDone() { if (window.stxLoadwallHide) { window.stxLoadwallHide(); } }
  function rpc(path, params) {
    return fetch(path, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method: 'call', params: params || {} }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.error) { throw new Error((d.error.data && d.error.data.message) || 'Odoo error'); } return d.result; });
  }
  function remembered(uid) {
    try { var a = JSON.parse(localStorage.getItem(ACCESS_KEY) || 'null'); return !!(a && a.uid === uid && a.until > Date.now()); } catch (e) { return false; }
  }
  function remember(uid, yes) {
    try { if (yes) { localStorage.setItem(ACCESS_KEY, JSON.stringify({ uid: uid, until: Date.now() + ACCESS_HOURS * 3600000 })); } else { localStorage.removeItem(ACCESS_KEY); } } catch (e) {}
  }
  // Does this logged-in account carry the label? Resolves true or false, never throws.
  function hasAccess(uid) {
    if (remembered(uid)) { return Promise.resolve(true); }
    return rpc('/web/dataset/call_kw/x_stx_ai_request/create', { model: 'x_stx_ai_request', method: 'create', args: [[{ x_prompt: 'Design Sheet: access check', x_state: 'new' }]], kwargs: {} })
      .then(function (ids) {
        var id = Array.isArray(ids) ? ids[0] : ids;
        return fetch(ACCESS_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ request_id: id }) });
      })
      .then(function (r) { return r.json(); })
      .then(function (d) { var yes = !!(d && d.access); remember(uid, yes); return yes; })
      .catch(function (e) { if (window.console && console.warn) { console.warn('[STX design sheet] access check', e); } return false; });
  }

  var root = document.getElementById('stx-ds-root');
  if (!root) { wallDone(); return; }
  // The loader adds sections at the end of <body>, under the footer. The full-screen tool did not mind,
  // the "Coming soon" card does: move it into the page content (#wrap), at the top.
  var wrapEl = document.getElementById('wrap');
  if (wrapEl && root.parentNode !== wrapEl) { wrapEl.insertBefore(root, wrapEl.firstChild); }
  if (document.body.classList.contains('editor_enable') || document.querySelector('.odoo-editor-editable') || document.querySelector('#wrap.o_editable')) { wallDone(); return; }

  var m = /^\/(fr|de|en_gb)(\/|$)/i.exec(location.pathname);
  var lang = m ? m[1].toLowerCase().replace('en_gb', 'en') : 'nl';
  var prefix = m ? '/' + (m[1].toLowerCase() === 'en_gb' ? 'en_GB' : m[1].toLowerCase()) : '';

  var css = document.createElement('style');
  css.textContent =
    '#stx-ds-soon{max-width:560px;margin:80px auto;padding:32px 24px;font-family:"Rethink Sans",sans-serif;color:#1b073d;text-align:center}' +
    '#stx-ds-soon .k{display:inline-block;background:#ffdb5a;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:3px;margin-bottom:14px}' +
    '#stx-ds-soon h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}' +
    '#stx-ds-soon p{font-size:17px;opacity:.8;margin:0}' +
    '#stx-ds-soon p.in{font-size:15px;margin-top:18px}' +
    '#stx-ds-soon p.in a{color:#6b3fb9;font-weight:700}' +
    'html.stx-ds-on,html.stx-ds-on body{overflow:hidden!important;height:100%}' +
    '#stx-ds-frame{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;border:0;z-index:2147482000;background:#fefcfa}' +
    '#stx-ds-wait{position:fixed;inset:0;z-index:2147482001;background:#fefcfa;display:flex;align-items:center;justify-content:center}' +
    '#stx-ds-wait i{width:46px;height:46px;border-radius:50%;border:4px solid #f1d9ff;border-top-color:#6b3fb9;animation:stxdsspin .8s linear infinite}' +
    '@keyframes stxdsspin{to{transform:rotate(360deg)}}';
  document.head.appendChild(css);

  var T = {
    nl: ['Binnenkort', 'Design Sheet', 'Teken je ballonopstelling, tel elke ballon en bestel in een klik. We testen hem nog even.', 'Heb je al vroege toegang? <a href="{u}">Log in</a>'],
    fr: ['Bientôt', 'Design Sheet', 'Dessinez votre installation, comptez chaque ballon et commandez en un clic. Encore quelques tests.', 'Vous avez déjà un accès anticipé ? <a href="{u}">Connectez-vous</a>'],
    de: ['Demnächst', 'Design Sheet', 'Zeichne deinen Ballonaufbau, zähle jeden Ballon und bestelle mit einem Klick. Wir testen noch.', 'Du hast schon frühen Zugang? <a href="{u}">Anmelden</a>'],
    en: ['Coming soon', 'Design Sheet', 'Draw your balloon setup, count every balloon and order in one click. We are still testing it.', 'Already have early access? <a href="{u}">Log in</a>']
  }[lang];
  function soon(loggedIn) {
    var login = prefix + '/web/login?redirect=' + encodeURIComponent(location.pathname);
    root.innerHTML = '<div id="stx-ds-soon"><span class="k">' + T[0] + '</span><h1>' + T[1] + '</h1><p>' + T[2] + '</p>' +
      (loggedIn ? '' : '<p class="in">' + T[3].replace('{u}', login) + '</p>') + '</div>';
  }

  rpc('/web/session/get_session_info').catch(function () { return null; }).then(function (info) {
    var uid = info && info.uid;
    if (!uid) { soon(false); wallDone(); return; }
    var wait = document.createElement('div'); wait.id = 'stx-ds-wait'; wait.innerHTML = '<i></i>';
    document.body.appendChild(wait);
    wallDone();
    hasAccess(uid).then(function (yes) {
      if (yes) { openTool(wait); return; }
      if (wait.parentNode) { wait.parentNode.removeChild(wait); }
      soon(true);
    });
  });

  function openTool(wait) {
    var url = window.STX_SECTIONS_BASE ? window.STX_SECTIONS_BASE + APP_FILE : APP_FALLBACK;
    if (!url) { if (wait.parentNode) { wait.parentNode.removeChild(wait); } root.innerHTML = '<div id="stx-ds-soon"><h1>Design Sheet</h1><p>Could not find the tool file.</p></div>'; return; }

    document.documentElement.classList.add('stx-ds-on');

    var env = { shop: true, ai: AI_ENDPOINT, lang: lang, back: prefix + '/shop' };
    fetch(url).then(function (r) {
      if (!r.ok) { throw new Error('HTTP ' + r.status); }
      return r.text();
    }).then(function (html) {
      var inject = '<script>window.STX_ENV=' + JSON.stringify(env).replace(/</g, '\\u003c') + ';<\/script>';
      html = html.replace(/<head>/i, '<head>' + inject);
      var fr = document.createElement('iframe');
      fr.id = 'stx-ds-frame';
      fr.title = 'STX Design Sheet';
      fr.setAttribute('allow', 'clipboard-write');
      fr.addEventListener('load', function () { if (wait.parentNode) { wait.parentNode.removeChild(wait); } try { fr.contentWindow.focus(); } catch (e) {} });
      fr.srcdoc = html;
      document.body.appendChild(fr);
      try { if (window.posthog && window.posthog.capture) { window.posthog.capture('stx_tool_design_sheet_open', { lang: lang }); } } catch (e) {}
    }).catch(function (e) {
      if (wait.parentNode) { wait.parentNode.removeChild(wait); }
      document.documentElement.classList.remove('stx-ds-on');
      root.innerHTML = '<div id="stx-ds-soon"><h1>Design Sheet</h1><p>The tool did not load. Refresh the page to try again.</p></div>';
      if (window.console && console.warn) { console.warn('[STX design sheet]', e); }
    });
  }
})();
</script>
