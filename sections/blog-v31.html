<!-- ============================================================
     STX EU / BLOG SECTIE (sectiebestand voor de section loader)
     Stand: v31 (16/09/2026, avond): overzicht toont meteen
     skeleton-kaarten (grijze placeholders) en vult per artikel
     zodra het binnen is (progressief), ook ingelogde editors
     krijgen eerst de cache en dan verse data op de achtergrond;
     filterknoppen gecentreerd.
     v30 (16/09/2026): artikellijst voor bezoekers via de
     publieke site-zoekroute (/website/snippet/autocomplete,
     pages) i.p.v. sitemap.xml (de sitemap bevat geen blogpagina's
     meer, sitemap blijft als vangnet); overzicht rendert meteen
     uit een localStorage-cache (24u) en ververst op de
     achtergrond (na 30 min); laadscherm gaat weg zodra hero en
     filters staan; hero gecentreerd over de volle breedte; het
     gepinde artikel wordt gedeeld met de Blog-menuknop via
     localStorage stx_blog_pin_v1. v29 = v28 + laadscherm-koppeling,
     auteur enkel Sempertex Europe, editor-cachebypass,
     brede artikelen, editor-guard, backend-artikeldetectie.

     Dit bestand hoort in de repo onder /sections/ en wordt door
     stx-loader geladen op /blog en alle /blog/... artikelen.
     NIET los in Odoo plakken.

     WERKING:
     - Overzicht: pagina /blog LEEG laten in Odoo; deze code bouwt
       hero, filters, featured, grid en newsletter, en vult zich
       automatisch: ingelogd via de interne Odoo API (ook
       unpublished, met badge), bezoekers via de site-zoekroute
       (vangnet: sitemap.xml).
     - Artikel: elke /blog/slug pagina wordt automatisch gestyled:
       quick answer (eerste alinea), ghost nummers per H2,
       auteursblok, leestijd, tabellen, quotes, keep reading,
       FAQPage en BlogPosting JSON-LD.
     - Per artikel 1 meta-regel via Embed Code:
       <div class="stx-blog-meta" data-tag="business"
            data-date="2026-08" style="display:none"></div>
       (data-featured="yes" op het featured artikel,
        data-related="/blog/a,/blog/b" optioneel)
     - Snippets voor tip, FAQ en download: stx-blog-snippets.html
     CONFIG bovenin het script is jouw deel.
     ============================================================ -->

<style>

<script>
(function(){
  /* ==========================================================
     CONFIG BLOG: DIT IS JOUW DEEL.
     ========================================================== */
  var BLOG_CONFIG = {
    blogRoot: '/blog',
    layout: 'grid',            // 'grid' of 'list'
    maxArticles: 30,           // max artikelen op het overzicht
    newsletterUrl: '/newsletter',
    cacheMinutes: 30,          // cache van de artikellijst; ouder = meteen tonen en op de achtergrond verversen
    // Preview: slugs die het overzicht moet tonen ook al staan ze
    // (nog) niet in de sitemap, bv. unpublished testartikelen.
    // Enkel zichtbaar voor wie de pagina kan openen (ingelogd).
    // Voorbeeld: extraArticles: ['/blog/mijn-testartikel'],
    extraArticles: [],

    authors: {
      // Enige auteur. img mag later een URL naar het logo of een foto zijn.
      'team':   { name: 'Sempertex Europe', role: { nl:'', en:'', fr:'', de:'' }, img: '' }
    },

    tags: {
      'news':        { nl:'Nieuws & updates', en:'News & updates', fr:'Actus & mises a jour', de:'News & Updates' },
      'techniques':  { nl:'Technieken', en:'Techniques', fr:'Techniques', de:'Techniken' },
      'business':    { nl:'Business', en:'Business', fr:'Business', de:'Business' },
      'helium':      { nl:'Helium en tools', en:'Helium and tools', fr:'Helium et outils', de:'Helium und Tools' },
      'inspiration': { nl:'Kleuren en inspiratie', en:'Colours and inspiration', fr:'Couleurs et inspiration', de:'Farben und Inspiration' },
      'products':    { nl:'Producten', en:'Products', fr:'Produits', de:'Produkte' },
      'industry':    { nl:'Industrie & milieu', en:'Industry & environment', fr:'Industrie & environnement', de:'Industrie & Umwelt' }
    },

    ui: {
      eyebrow:    { nl:'De Sempertex Europe Blog', en:'The Sempertex Europe Blog', fr:'Le blog Sempertex Europe', de:'Der Sempertex Europe Blog' },
      heroTitle:  { nl:'Sempertex Europe |News|', en:'Sempertex Europe |News|', fr:'Sempertex Europe |News|', de:'Sempertex Europe |News|' },
      heroLede:   { nl:'Nieuws over de ballonindustrie, tools, business, technieken en meer updates voor professionele ballonartiesten en decorateurs.', en:'News about the balloon industry, tools, business, techniques and more updates for professional balloon artists and decorators.', fr:'L\u2019actualite de l\u2019industrie du ballon, outils, business, techniques et plus de mises a jour pour les artistes ballon et decorateurs professionnels.', de:'News aus der Ballonindustrie, Tools, Business, Techniken und mehr Updates fuer professionelle Ballonkuenstler und Dekorateure.' },
      all:        { nl:'Alle artikelen', en:'All articles', fr:'Tous les articles', de:'Alle Artikel' },
      featured:   { nl:'Uitgelicht', en:'Featured', fr:'A la une', de:'Empfohlen' },
      back:       { nl:'Alle artikelen', en:'All articles', fr:'Tous les articles', de:'Alle Artikel' },
      draft:      { nl:'Niet gepubliceerd', en:'Unpublished', fr:'Non publie', de:'Unveroeffentlicht' },
      quick:      { nl:'Kort antwoord', en:'Quick answer', fr:'Reponse rapide', de:'Kurze Antwort' },
      minRead:    { nl:'min leestijd', en:'min read', fr:'min de lecture', de:'Min. Lesezeit' },
      keepReading:{ nl:'Verder |lezen|', en:'Keep |reading|', fr:'Continuez a |lire|', de:'Weiter|lesen|' },
      nlTitle:    { nl:'Schrijf je in voor meer updates en |exclusieve inzichten|', en:'Sign up for more updates and |exclusive insights|', fr:'Inscrivez-vous pour plus de mises a jour et |d\u2019insights exclusifs|', de:'Melde dich an fuer mehr Updates und |exklusive Einblicke|' },
      nlText:     { nl:'Sluit je aan bij tienduizenden ballonartiesten in onze community newsletter voor tutorials, updates, guides en meer.', en:'Join tens of thousands of balloon artists in our community newsletter for tutorials, updates, guides and more.', fr:'Rejoignez des dizaines de milliers d\u2019artistes ballon dans notre newsletter pour des tutoriels, mises a jour, guides et plus.', de:'Schliesse dich zehntausenden Ballonkuenstlern in unserem Community Newsletter an: Tutorials, Updates, Guides und mehr.' },
      nlBtn:      { nl:'Inschrijven', en:'Join the newsletter', fr:'S\u2019inscrire', de:'Anmelden' },
      months:     { nl:['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'],
                    en:['January','February','March','April','May','June','July','August','September','October','November','December'],
                    fr:['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'],
                    de:['Januar','Februar','Maerz','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'] }
    }
  };
  /* ================= EINDE CONFIG BLOG ================= */

  var path = location.pathname.replace(/\/+$/,'') || '/';
  var m = path.match(/^\/(fr|de|en_GB)(\/|$)/);
  var langPrefix = m ? '/' + m[1] : '';
  var LANG = m ? (m[1] === 'en_GB' ? 'en' : m[1]) : 'nl';
  var rest = langPrefix ? path.slice(langPrefix.length) : path;
  var isIndex = (rest === BLOG_CONFIG.blogRoot);
  var isArticle = rest.indexOf(BLOG_CONFIG.blogRoot + '/') === 0;
  if (!isIndex && !isArticle) return;

  /* ---- editor-beveiliging: nooit draaien of sporen achterlaten in Odoo bewerkmodus ---- */
  function inEdit(){
    return document.body.classList.contains('editor_enable')
      || !!document.querySelector('.odoo-editor-editable')
      || !!document.querySelector('#wrap.o_editable');
  }
  /* Meldt aan het laadscherm (bovenaan het custom-code veld) dat de blog klaar is */
  function wallDone(){ if (window.stxLoadwallHide) window.stxLoadwallHide(); }
  function cleanupInjected(wrap){
    if (!wrap) return;
    [].slice.call(wrap.querySelectorAll('.sb-quick[data-stx-injected]')).forEach(function(q){
      var p = q.querySelector('p');
      if (p) q.parentNode.insertBefore(p, q);
      q.parentNode.removeChild(q);
    });
    [].slice.call(wrap.querySelectorAll('[data-stx-injected]')).forEach(function(el){
      if (!el.parentNode) return;
      if (el.classList.contains('sb-content')) {
        while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
      }
      el.parentNode.removeChild(el);
    });
    wrap.classList.remove('stx-blog','stx-blog-article');
  }

  function T(o){ return (o && (o[LANG] || o.en || o.nl)) || ''; }
  function hl(s){ return String(s).replace(/\|([^|]+)\|/g, '<span class="sb-hl">$1</span>'); }
  function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function fmtDate(ym){
    if(!ym) return '';
    var p = ym.split('-');
    var mo = BLOG_CONFIG.ui.months[LANG] || BLOG_CONFIG.ui.months.en;
    return (mo[(parseInt(p[1],10)||1)-1] || '') + ' ' + p[0];
  }
  function readTime(words){ return Math.max(3, Math.round(words/200)); }
  function authorOf(key){
    return BLOG_CONFIG.authors[key] || BLOG_CONFIG.authors['team'] || { name:'Sempertex Europe', role:{}, img:'' };
  }
  function avatarHtml(a){
    if (a.img) return '<span class="sb-avatar"><img src="'+esc(a.img)+'" alt="'+esc(a.name)+'"></span>';
    return '<span class="sb-avatar">'+esc((a.name||'S').charAt(0))+'</span>';
  }
  function coverHtml(item){
    var badge = item.published === false ? '<span class="sb-draft">'+esc(T(BLOG_CONFIG.ui.draft))+'</span>' : '';
    if (item.cover) return '<div class="sb-cover">'+badge+'<img src="'+esc(item.cover)+'" alt="'+esc(item.title)+'" loading="lazy"></div>';
    return '<div class="sb-cover">'+badge+'<span class="sb-glyph">'+esc((item.title||'S').charAt(0).toUpperCase())+'</span></div>';
  }
  function articleUrl(slugPath){ return langPrefix + slugPath; }

  /* ---------- artikellijst opbouwen via sitemap ---------- */
  var CACHE_KEY = 'stxBlogIndex_v5_' + LANG;
  var PIN_KEY = 'stx_blog_pin_v1';        /* gedeeld met de Blog-menuknop in de custom code */
  var CACHE_STALE_HOURS = 24;             /* zo lang mag een oude lijst meteen getoond worden, daarna wachten op verse data */
  /* Ingelogde editors krijgen altijd verse data (geen sessie-cache,
     geen browsercache), bezoekers houden de snelle cache. */
  function isEditor(){
    try { return sessionStorage.getItem('stxBlogEditor') === '1'; } catch(e){ return false; }
  }
  /* Bron 1: interne Odoo API (werkt voor ingelogde gebruikers, toont
     ook unpublished artikelen). Bron 2 (fallback voor bezoekers):
     sitemap.xml, enkel gepubliceerde artikelen. */
  function slugsFromBackend(){
    return fetch('/web/dataset/call_kw', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method: 'call', params: {
        model: 'website.page', method: 'search_read',
        args: [ [['url','=like', BLOG_CONFIG.blogRoot + '/%']], ['url','is_published'] ],
        kwargs: {}
      }})
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d || !d.result || !d.result.length) throw 0;
      try { sessionStorage.setItem('stxBlogEditor','1'); } catch(e){}
      return d.result.map(function(rec){ return { slug: rec.url, published: rec.is_published !== false }; });
    });
  }
  /* Bron 2: de publieke zoekroute van de site (zelfde als het
     zoekvak), search_type 'pages' met term 'blog' geeft alle
     gepubliceerde /blog/... pagina's, ook voor bezoekers. */
  function slugsFromSearch(){
    return fetch('/website/snippet/autocomplete', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method: 'call', params: {
        search_type: 'pages', term: BLOG_CONFIG.blogRoot.replace(/^\//,''), order: 'name asc', limit: 100, max_nb_chars: 40,
        options: { displayDescription: false, displayDetail: false, displayExtraLink: false, displayImage: false, allowFuzzy: false }
      }})
    }).then(function(r){ return r.json(); }).then(function(d){
      var res = d && d.result && d.result.results;
      if (!res || !res.length) throw 0;
      var out = [];
      res.forEach(function(x){
        var p = String(x.website_url || '').split('?')[0].replace(/^\/(fr|de|en_GB)(?=\/)/,'').replace(/\/+$/,'');
        if (p.indexOf(BLOG_CONFIG.blogRoot + '/') === 0) out.push({ slug: p, published: true });
      });
      if (!out.length) throw 0;
      return out;
    });
  }
  function slugsFromSitemap(){
    return fetch('/sitemap.xml?stx=' + Date.now()).then(function(r){ return r.text(); }).then(function(xml){
      var doc = new DOMParser().parseFromString(xml, 'text/xml');
      var locs = [].slice.call(doc.querySelectorAll('loc')).map(function(n){ return n.textContent.trim(); });
      var isIdx = doc.querySelector('sitemapindex');
      var next = isIdx
        ? Promise.all(locs.slice(0,5).map(function(u){ return fetch(u).then(function(r){ return r.text(); }).catch(function(){ return ''; }); }))
            .then(function(parts){
              var all = [];
              parts.forEach(function(x){
                var d2 = new DOMParser().parseFromString(x, 'text/xml');
                [].slice.call(d2.querySelectorAll('url > loc')).forEach(function(n){ all.push(n.textContent.trim()); });
              });
              return all;
            })
        : Promise.resolve(locs);
      return next.then(function(urls){
        var out = [];
        urls.forEach(function(u){
          var p; try { p = new URL(u).pathname; } catch(e){ return; }
          p = p.replace(/^\/(fr|de|en_GB)(?=\/)/,'');
          if (p.indexOf(BLOG_CONFIG.blogRoot + '/') === 0 && p !== BLOG_CONFIG.blogRoot) out.push({ slug: p, published: true });
        });
        return out;
      });
    });
  }
  function readIndexCache(){
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e){ return null; }
  }
  /* Gepind artikel delen met de Blog-menuknop (custom code, elke pagina). */
  function sharePin(items){
    var feat = null;
    items.some(function(it){ if (it.featured && it.published !== false) { feat = it; return true; } return false; });
    if (!feat) items.some(function(it){ if (it.published !== false) { feat = it; return true; } return false; });
    if (!feat) return;
    try {
      var c = JSON.parse(localStorage.getItem(PIN_KEY) || 'null');
      if (!c || c.slug !== feat.slug) c = { t: Date.now(), slug: feat.slug, titles: {} };
      c.t = Date.now();
      c.titles[LANG] = feat.title;
      localStorage.setItem(PIN_KEY, JSON.stringify(c));
    } catch(e){}
  }
  function loadIndex(cb, onPartial){
    var cached = null;
    var c = readIndexCache();
    if (c && c.items && c.items.length && (Date.now() - c.t) < CACHE_STALE_HOURS*3600000) {
      cached = c;
      cb(c.items);
      /* Bezoekers: vers genoeg = klaar. Editors: altijd op de achtergrond verversen. */
      if (!isEditor() && (Date.now() - c.t) < BLOG_CONFIG.cacheMinutes*60000) return;
    }
    slugsFromBackend()
      .catch(function(){ return slugsFromSearch(); })
      .catch(function(){ return slugsFromSitemap(); })
      .catch(function(){ return []; })
      .then(function(list){
        var seen = {}, slugObjs = [];
        (list || []).forEach(function(o){ if (o && o.slug && !seen[o.slug]) { seen[o.slug] = 1; slugObjs.push(o); } });
        (BLOG_CONFIG.extraArticles || []).forEach(function(x){
          x = String(x).trim();
          if (x && x.indexOf(BLOG_CONFIG.blogRoot + '/') === 0 && !seen[x]) { seen[x] = 1; slugObjs.unshift({ slug: x, published: true }); }
        });
        slugObjs = slugObjs.slice(0, BLOG_CONFIG.maxArticles);
        var FOPTS = isEditor() ? { cache: 'no-store' } : undefined;
        var partial = [], pending = slugObjs.length;
        function arrived(item){
          pending--;
          if (item) partial.push(item);
          if (!cached && onPartial && pending > 0) onPartial(partial.slice(), pending);
        }
        Promise.all(slugObjs.map(function(o){
          var slug = o.slug;
          var pDoc = fetch(articleUrl(slug), FOPTS).then(function(r){ return r.ok ? r.text() : ''; });
          /* Meta-blok altijd uit de standaardtaal lezen, zodat featured,
             tag, datum en related maar op 1 plek beheerd worden. */
          var pMeta = langPrefix ? fetch(slug, { credentials: 'omit', cache: isEditor() ? 'no-store' : 'default' }).then(function(r){ return r.ok ? r.text() : ''; }).catch(function(){ return ''; }) : Promise.resolve('');
          return Promise.all([pDoc, pMeta]).then(function(res){
            var html = res[0];
            if (!html) return null;
            var d = new DOMParser().parseFromString(html, 'text/html');
            var wrapEl = d.querySelector('#wrap') || d.body;
            [].slice.call(wrapEl.querySelectorAll('[data-stx-lang]')).forEach(function(el){
              if ((el.getAttribute('data-stx-lang')||'').toLowerCase() !== LANG && el.parentNode) el.parentNode.removeChild(el);
            });
            var meta = wrapEl.querySelector('.stx-blog-meta');
            if (res[1]) {
              var dmDoc = new DOMParser().parseFromString(res[1], 'text/html');
              var mEl = dmDoc.querySelector('.stx-blog-meta');
              if (mEl) meta = mEl;
            }
            meta = meta || d.createElement('div');
            var h1 = wrapEl.querySelector('h1');
            var img = wrapEl.querySelector('#wrap img, img');
            var firstP = null;
            [].slice.call(wrapEl.querySelectorAll('p')).some(function(p2){
              if ((p2.textContent||'').trim().length > 40) { firstP = p2; return true; } return false;
            });
            var words = (wrapEl.textContent||'').trim().split(/\s+/).length;
            return {
              slug: slug,
              published: o.published,
              title: h1 ? h1.textContent.trim() : slug.split('/').pop().replace(/-/g,' '),
              cover: img ? img.getAttribute('src') : '',
              excerpt: firstP ? firstP.textContent.trim().slice(0,150) + (firstP.textContent.trim().length>150 ? '\u2026' : '') : '',
              author: meta.getAttribute('data-author') || 'team',
              tag: meta.getAttribute('data-tag') || '',
              date: meta.getAttribute('data-date') || '',
              featured: meta.getAttribute('data-featured') === 'yes',
              minutes: readTime(words)
            };
          }).catch(function(){ return null; }).then(function(item){ arrived(item); return item; });
        })).then(function(items){
          items = items.filter(Boolean);
          items.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
          if (!items.length && cached) return;   /* verversen mislukt: oude lijst blijft staan */
          if (items.length) {
            sharePin(items);
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), items:items})); } catch(e){}
          }
          if (cached && JSON.stringify(cached.items) === JSON.stringify(items)) return;
          cb(items);
        });
      });
  }

  function cardHtml(item){
    var a = authorOf(item.author);
    var tagName = item.tag && BLOG_CONFIG.tags[item.tag] ? T(BLOG_CONFIG.tags[item.tag]) : '';
    return '<a class="sb-card" data-cat="'+esc(item.tag)+'" href="'+esc(articleUrl(item.slug))+'">'
      + coverHtml(item)
      + '<div class="sb-cx">'
      + (tagName ? '<span class="sb-tag">'+esc(tagName)+'</span>' : '')
      + '<h3>'+esc(item.title)+'</h3>'
      + (item.excerpt ? '<p>'+esc(item.excerpt)+'</p>' : '')
      + '<div class="sb-meta-row">'+avatarHtml(a)+'<span>'+esc(a.name)+'</span><span style="opacity:.4">&middot;</span><span>'+item.minutes+' '+esc(T(BLOG_CONFIG.ui.minRead))+'</span></div>'
      + '</div></a>';
  }

  /* ---------- OVERZICHTSPAGINA ---------- */
  function buildIndex(){
    var wrap = document.getElementById('wrap');
    if (!wrap) { wallDone(); return; }
    cleanupInjected(wrap);
    if (inEdit()) { wallDone(); return; }
    wrap.classList.add('stx-blog');
    var pills = '<button class="sb-pill active" data-f="all">'+esc(T(BLOG_CONFIG.ui.all))+'</button>';
    Object.keys(BLOG_CONFIG.tags).forEach(function(k){
      pills += '<button class="sb-pill" data-f="'+k+'">'+esc(T(BLOG_CONFIG.tags[k]))+'</button>';
    });
    var host = document.createElement('div');
    host.setAttribute('data-stx-injected','1');
    host.innerHTML = '<div class="sb-wrap">'
      + '<header class="sb-hero">'
      + '<h1>'+hl(esc(T(BLOG_CONFIG.ui.heroTitle)))+'</h1>'
      + '<p class="sb-lede">'+esc(T(BLOG_CONFIG.ui.heroLede))+'</p></header>'
      + '<div class="sb-filters">'+pills+'</div>'
      + '<div id="sb-featured-slot">'+skelFeatured()+'</div>'
      + '<div class="sb-grid" id="sb-grid">'+skelCards(3)+'</div>'
      + '<div class="sb-newsletter"><div><h2>'+hl(esc(T(BLOG_CONFIG.ui.nlTitle)))+'</h2>'
      + '<p>'+esc(T(BLOG_CONFIG.ui.nlText))+'</p></div>'
      + '<a class="sb-btn" href="'+esc(langPrefix + BLOG_CONFIG.newsletterUrl)+'">'+esc(T(BLOG_CONFIG.ui.nlBtn))+'</a></div>'
      + '</div>';
    wrap.appendChild(host);
    wallDone();   /* hero en filters staan, de kaarten vullen zich hierna */

    wrap.querySelectorAll('.sb-pill').forEach(function(p){
      p.addEventListener('click', function(){
        wrap.querySelectorAll('.sb-pill').forEach(function(x){ x.classList.remove('active'); });
        p.classList.add('active');
        var f = p.getAttribute('data-f');
        wrap.querySelectorAll('#sb-grid .sb-card').forEach(function(c){
          c.style.display = (f==='all' || c.getAttribute('data-cat')===f) ? '' : 'none';
        });
        var fe = wrap.querySelector('.sb-featured');
        if (fe) fe.style.display = (f==='all' || fe.getAttribute('data-cat')===f) ? '' : 'none';
      });
    });

    /* Progressief: elk artikel dat binnen is komt meteen op zijn plaats,
       de rest blijft skeleton. Featured wacht op het gepinde artikel of,
       als er geen gepind is, op het einde (dan het nieuwste). */
    function render(items, pendingCount){
      var grid = document.getElementById('sb-grid');
      var featSlot = document.getElementById('sb-featured-slot');
      if (!grid || !featSlot) return;
      var loading = pendingCount > 0;
      if (!items.length) {
        if (!loading) { featSlot.innerHTML = ''; grid.innerHTML = '<div class="sb-empty">No articles yet.</div>'; }
        return;
      }
      items = items.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      var feat = null;
      items.some(function(it){ if (it.featured) { feat = it; return true; } return false; });
      if (!feat && !loading) feat = items[0];
      var restItems = items.filter(function(it){ return it !== feat; });
      if (!feat) {
        if (!featSlot.querySelector('.sb-skel')) featSlot.innerHTML = skelFeatured();
        grid.innerHTML = restItems.map(cardHtml).join('') + skelCards(Math.max(pendingCount - 1, 0));
        return;
      }
      var a = authorOf(feat.author);
      var tagName = feat.tag && BLOG_CONFIG.tags[feat.tag] ? T(BLOG_CONFIG.tags[feat.tag]) : '';
      featSlot.innerHTML = '<a class="sb-featured" data-cat="'+esc(feat.tag)+'" href="'+esc(articleUrl(feat.slug))+'">'
        + coverHtml(feat)
        + '<div class="sb-fx"><div class="sb-eyebrow">'+esc(T(BLOG_CONFIG.ui.featured))+(tagName?' &middot; '+esc(tagName):'')+'</div>'
        + '<h2>'+esc(feat.title)+'</h2>'
        + (feat.excerpt?'<p>'+esc(feat.excerpt)+'</p>':'')
        + '<div class="sb-meta-row" style="margin-top:20px">'+avatarHtml(a)+'<span>'+esc(a.name)+'</span><span style="opacity:.4">&middot;</span><span>'+feat.minutes+' '+esc(T(BLOG_CONFIG.ui.minRead))+'</span></div>'
        + '</div></a>';
      grid.innerHTML = restItems.map(cardHtml).join('') + (loading ? skelCards(pendingCount) : '') || '<div class="sb-empty"></div>';
    }
    loadIndex(function(items){ render(items, 0); wallDone(); }, function(items, pending){ render(items, pending); });
  }
  function skelFeatured(){
    return '<div class="sb-featured sb-skel" aria-hidden="true"><div class="sb-cover"></div><div class="sb-fx">'
      + '<div class="sb-line w60" style="margin-bottom:14px"></div><div class="sb-line h34" style="margin-bottom:14px"></div>'
      + '<div class="sb-line w85" style="margin-bottom:8px"></div><div class="sb-line w60"></div></div></div>';
  }
  function skelCards(n){
    var out = '';
    for (var i = 0; i < n; i++) {
      out += '<div class="sb-card sb-skel" aria-hidden="true"><div class="sb-cover"></div><div class="sb-cx">'
        + '<div class="sb-line w60"></div><div class="sb-line h24"></div><div class="sb-line w85"></div></div></div>';
    }
    return out;
  }

  /* ---------- ARTIKELPAGINA ---------- */
  function buildArticle(){
    var wrap = document.getElementById('wrap');
    if (!wrap) { wallDone(); return; }
    cleanupInjected(wrap);
    if (inEdit()) { wallDone(); return; }
    wrap.classList.add('stx-blog','stx-blog-article');
    var inner = document.createElement('div');
    inner.className = 'sb-wrap-narrow sb-content';
    inner.setAttribute('data-stx-injected','1');
    while (wrap.firstChild) inner.appendChild(wrap.firstChild);
    wrap.appendChild(inner);

    /* Meertalige embed-blokken: elementen met data-stx-lang worden
       enkel getoond in hun eigen taal. Blokken zonder het attribuut
       gedragen zich zoals altijd (alle talen). */
    [].slice.call(inner.querySelectorAll('[data-stx-lang]')).forEach(function(el){
      if ((el.getAttribute('data-stx-lang')||'').toLowerCase() !== LANG && el.parentNode) el.parentNode.removeChild(el);
    });

    var metaLocal = inner.querySelector('.stx-blog-meta');
    function proceed(meta){

    var authorKey = meta ? meta.getAttribute('data-author') : 'team';
    var tagKey = meta ? meta.getAttribute('data-tag') : '';
    var dateStr = meta ? fmtDate(meta.getAttribute('data-date')) : '';
    var relatedAttr = meta ? (meta.getAttribute('data-related')||'') : '';
    var a = authorOf(authorKey);
    var h1 = inner.querySelector('h1');
    var words = (inner.textContent||'').trim().split(/\s+/).length;
    var mins = readTime(words);

    var back = document.createElement('a');
    back.className = 'sb-back';
    back.setAttribute('data-stx-injected','1');
    back.href = langPrefix + BLOG_CONFIG.blogRoot;
    back.innerHTML = '&#8592; ' + esc(T(BLOG_CONFIG.ui.back));
    inner.insertBefore(back, inner.firstChild);

    if (h1) {
      if (tagKey && BLOG_CONFIG.tags[tagKey]) {
        var eb = document.createElement('div');
        eb.className = 'sb-eyebrow';
        eb.setAttribute('data-stx-injected','1');
        eb.textContent = T(BLOG_CONFIG.tags[tagKey]);
        h1.parentNode.insertBefore(eb, h1);
      }
      var ab = document.createElement('div');
      ab.className = 'sb-author';
      ab.setAttribute('data-stx-injected','1');
      ab.innerHTML = avatarHtml(a)
        + '<div><div class="sb-who">'+esc(a.name)+'</div><div class="sb-role">'+esc(T(a.role))+'</div></div>'
        + '<div class="sb-when">'+esc(dateStr)+(dateStr?'<br>':'')+mins+' '+esc(T(BLOG_CONFIG.ui.minRead))+'</div>';
      h1.parentNode.insertBefore(ab, h1.nextSibling);

      var firstP = null;
      var seq = [].slice.call(inner.querySelectorAll('h1, h2, p'));
      var afterH1 = false;
      for (var i2 = 0; i2 < seq.length; i2++) {
        var el2 = seq[i2];
        if (el2.tagName === 'H1') { afterH1 = true; continue; }
        if (!afterH1) continue;
        if (el2.tagName === 'H2') break;
        if (el2.closest('.stx-tip,.stx-faq,.stx-download,blockquote,.sb-author,.sb-quick,.stx-blog-meta')) continue;
        if ((el2.textContent||'').trim().length > 40) { firstP = el2; break; }
      }
      if (firstP) {
        var q = document.createElement('div');
        q.className = 'sb-quick';
        q.setAttribute('data-stx-injected','1');
        q.innerHTML = '<div class="sb-qlabel">'+esc(T(BLOG_CONFIG.ui.quick))+'</div>';
        firstP.parentNode.insertBefore(q, firstP);
        q.appendChild(firstP);
      }
    }

    var n = 0;
    [].slice.call(inner.querySelectorAll('h2')).forEach(function(h2){
      if (h2.closest('.stx-download') || h2.closest('.sb-related')) return;
      n++;
      var num = document.createElement('div');
      num.className = 'sb-secnum';
      num.setAttribute('data-stx-injected','1');
      num.textContent = (n<10?'0':'') + n;
      h2.parentNode.insertBefore(num, h2);
    });

    /* keep reading */
    loadIndex(function(items){
      var picks = [];
      if (relatedAttr) {
        relatedAttr.split(',').forEach(function(s){
          s = s.trim();
          items.some(function(it){ if (it.slug === s) { picks.push(it); return true; } return false; });
        });
      }
      if (!picks.length) {
        var current = rest;
        picks = items.filter(function(it){ return it.slug !== current && (!tagKey || it.tag === tagKey); }).slice(0,3);
        if (picks.length < 3) {
          items.forEach(function(it){ if (picks.length<3 && it.slug!==current && picks.indexOf(it)<0) picks.push(it); });
        }
      }
      if (!picks.length) return;
      var rel = document.createElement('section');
      rel.className = 'sb-related';
      rel.setAttribute('data-stx-injected','1');
      rel.innerHTML = '<h2>'+hl(esc(T(BLOG_CONFIG.ui.keepReading)))+'</h2><div class="sb-grid">'+picks.slice(0,3).map(cardHtml).join('')+'</div>';
      inner.appendChild(rel);
    });

    /* FAQ JSON-LD */
    var faqs = [].slice.call(inner.querySelectorAll('.stx-faq details'));
    if (faqs.length) {
      var entities = faqs.map(function(d){
        var qEl = d.querySelector('summary');
        var ans = '';
        [].slice.call(d.querySelectorAll('p')).forEach(function(p){ ans += p.textContent.trim() + ' '; });
        return { '@type':'Question', 'name': qEl ? qEl.textContent.trim() : '', 'acceptedAnswer': { '@type':'Answer', 'text': ans.trim() } };
      }).filter(function(e){ return e.name && e.acceptedAnswer.text; });
      if (entities.length) {
        var s1 = document.createElement('script');
        s1.type = 'application/ld+json';
        s1.textContent = JSON.stringify({ '@context':'https://schema.org', '@type':'FAQPage', 'mainEntity': entities });
        document.head.appendChild(s1);
      }
    }

    /* BlogPosting JSON-LD */
    if (h1) {
      var img = inner.querySelector('.sb-content img');
      var ld = { '@context':'https://schema.org', '@type':'BlogPosting',
        'headline': h1.textContent.trim(),
        'author': { '@type':'Person', 'name': a.name },
        'publisher': { '@type':'Organization', 'name':'Sempertex Europe' },
        'mainEntityOfPage': location.href };
      var dm = meta ? meta.getAttribute('data-date') : '';
      if (dm) ld.datePublished = dm + '-01';
      if (img && img.src) ld.image = img.src;
      var s2 = document.createElement('script');
      s2.type = 'application/ld+json';
      s2.textContent = JSON.stringify(ld);
      document.head.appendChild(s2);
    }
      wallDone();
      }
    /* Meta altijd uit de standaardtaal-versie halen; lokale kopie is fallback. */
    if (langPrefix) {
      fetch(rest, { credentials: 'omit', cache: isEditor() ? 'no-store' : 'default' })
        .then(function(r){ return r.ok ? r.text() : ''; })
        .then(function(t){
          var mEl = null;
          if (t) {
            var dmDoc = new DOMParser().parseFromString(t, 'text/html');
            mEl = dmDoc.querySelector('.stx-blog-meta');
          }
          proceed(mEl || metaLocal);
        })
        .catch(function(){ proceed(metaLocal); });
    } else {
      proceed(metaLocal);
    }
  }

  function init(){
    if (inEdit()) { cleanupInjected(document.getElementById('wrap')); wallDone(); return; }
    if (isIndex) buildIndex(); else buildArticle();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
  try {
    new MutationObserver(function(){
      if (inEdit()) cleanupInjected(document.getElementById('wrap'));
    }).observe(document.body, { attributes:true, attributeFilter:['class'], subtree:false });
  } catch(e){}
})();
</script>
