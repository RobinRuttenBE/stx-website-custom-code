<!-- ============================================================
     STX EU / FOOTER v1 (sectiebestand voor de section loader)
     Vervangt de Odoo-footer op elke pagina (loader-regel all: true,
     brand: true, dus nooit op een partnerpagina). Ontwerp = Robins
     stx-footer.html van 22/10/2026, in vier talen: NL (Robins tekst),
     EN, FR en DE. De shoplinks gaan naar de categorie in de taal van
     de pagina (zelfde categorienummers, slug per taal).

     Werking:
     - De Odoo-footer (footer#bottom) blijft bestaan, maar wat erin
       staat (#footer en de copyrightbalk) wordt verborgen, en deze
       footer komt erin, in een shadow root. Zo raakt de CSS van Odoo
       (o_cc kleuren, h3, ul, address) deze footer niet, en andersom.
     - In de Odoo editor doet dit bestand niets: daar zie en bewerk je
       de oude footer gewoon.
     - Taalknoppen gaan naar dezelfde pagina in de andere taal. NL gaat
       via /nl/..., anders stuurt de taalcookie je terug naar de vorige
       taal (Odoo zet /nl/ zelf om naar de URL zonder prefix).
     - Het einde-body plakbestand verbergt de oude footer al voor de
       eerste paint (html.stx-ft-on / stx-ft-off); lukt het laden niet,
       dan komt de oude footer na 6 seconden terug.

     Sluitingsdagen aanpassen: CLOSED in de vier talen hieronder.
     Sinds 27/10/2026.
     ============================================================ -->
<template id="stx-footer-tpl">
<style>
:host { all: initial; display: block; }

.stx-footer, .stx-footer * { box-sizing: border-box; }
.stx-footer {
  font-family: 'Rethink Sans', Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  color: #fefcfa;
  background: #1b073d;

}
.stx-footer a { color: inherit; text-decoration: none; transition: color .15s ease; }
.stx-footer a:hover, .stx-footer a:focus { color: #ffdb5a; text-decoration: none; }
.stx-footer p { margin: 0; }
.stx-footer ul { list-style: none; margin: 0; padding: 0; }
.stx-footer h2, .stx-footer h3 { margin: 0; font-family: inherit; }
.stx-inner { max-width: 1240px; margin: 0 auto; padding: 0 40px; }
.stx-label {
  font-size: 12px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: #ffdb5a;
}

/* Kolommen */
.stx-cols { display: flex; flex-wrap: wrap; gap: 48px 40px; padding-top: 64px; }
.stx-col-brand { flex: 1 1 260px; max-width: 320px; }
.stx-col-nav { flex: 1 1 160px; max-width: 200px; }
.stx-col-hours { flex: 1 1 280px; max-width: 340px; }
.stx-logo { display: block; width: 200px; max-width: 100%; height: auto; }
.stx-wordmark { font-size: 26px; font-weight: 800; letter-spacing: -.01em; line-height: 1; }
.stx-wordmark-sub { font-size: 12px; font-weight: 700; letter-spacing: .24em; color: #ffdb5a; margin-top: 6px; }
.stx-col-brand p { margin: 20px 0 24px; font-size: 15px; color: #cfc4e4; max-width: 34ch; }
.stx-footer address { font-style: normal; font-size: 15px; color: #cfc4e4; line-height: 1.7; margin: 0; }
.stx-footer address a { color: #fefcfa; font-weight: 600; }
.stx-col-nav h3, .stx-col-hours h3 { margin-bottom: 18px; }
.stx-col-nav li { padding: 6px 0; font-size: 15px; color: #cfc4e4; }

/* Openingsuren */
.stx-card { background: rgba(254,252,250,.07); border-radius: 8px; padding: 26px 28px; }
.stx-hours-row { display: flex; justify-content: space-between; gap: 16px; font-size: 16px; font-weight: 700; }
.stx-card p { font-size: 14px; color: #cfc4e4; }
.stx-rule { height: 1px; background: rgba(254,252,250,.16); margin: 20px 0; }
.stx-sub { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
.stx-chip-warn {
  display: inline-block; border: 1px solid #ffdb5a; color: #ffdb5a;
  border-radius: 6px; padding: 7px 12px; font-size: 13px; font-weight: 700; margin-top: 18px;
}

/* Trust + social */
.stx-meta {
  margin-top: 56px; padding: 26px 0; border-top: 1px solid rgba(254,252,250,.16);
  display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: center; justify-content: space-between;
}
.stx-trust { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #cfc4e4; }
.stx-trust li { border: 1px solid rgba(254,252,250,.26); border-radius: 999px; padding: 7px 14px; }
.stx-social { display: flex; align-items: center; gap: 14px; }
.stx-social span { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #cfc4e4; }
.stx-social a {
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 8px; background: rgba(254,252,250,.1);
}
.stx-social a:hover { background: rgba(255,219,90,.2); }

/* Onderbalk */
.stx-bottom { border-top: 1px solid rgba(254,252,250,.16); }
.stx-bottom .stx-inner {
  padding-top: 20px; padding-bottom: 20px; display: flex; flex-wrap: wrap;
  gap: 14px 28px; align-items: center; justify-content: space-between;
  font-size: 13px; color: #cfc4e4;
}
.stx-legal { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.stx-vat { opacity: .6; }
.stx-lang { display: flex; gap: 6px; align-items: center; }
.stx-lang a { padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 12px; letter-spacing: .06em; }
.stx-lang a.is-active { background: #ffdb5a; color: #1b073d; font-weight: 800; }
.stx-lang a.is-active:hover { color: #1b073d; }

@media (max-width: 768px) {
  .stx-inner { padding: 0 20px; }
  .stx-cols { gap: 32px; padding-top: 36px; }
  .stx-col-brand, .stx-col-nav, .stx-col-hours { flex: 1 1 100%; max-width: 100%; }
  .stx-meta { margin-top: 32px; }
}
</style>
<footer class="stx-footer"></footer>

      country: 'Belgien', shop: 'Shop', useful: 'Nützliche Links',
      links: ['Workshops', 'Warum Sempertex?', 'Großhändler werden', 'Partner', 'Zertifikate', 'Digitaler Katalog', 'Unser Team', 'FAQ', 'Kontakt'],
      hours: 'Öffnungszeiten', days: 'Montag bis Donnerstag',
      lunch: 'Mittagspause von 12:00 bis 13:00. Freitags, am Wochenende und an Feiertagen geschlossen.',
      pickup: 'Abholung', pickupTxt: 'Montag bis Donnerstag, 10:00 bis 12:00 und 13:00 bis 16:00. Wir melden uns, sobald deine Bestellung bereitliegt.',

      follow: 'Folge uns', vat: 'USt-IdNr. BE 0833747266', terms: 'AGB', cookies: 'Cookie-Richtlinie' }

</script>
