<!-- ============================================================
     STX EU / PARTNER CALCULATOR (white-label skin) v1
     Bestand hoort in de repo onder /sections/ en wordt door de
     stx-loader geladen op elk pad dat eindigt op /tools EN begint
     met /partner/<slug>/ (zie PATH_RE onderaan de CONFIG).
     NIET los in Odoo plakken.

     WAT DIT DOET
     Dit bestand maakt GEEN tweede calculator. Het is een SKIN.
     De Odoo pagina /partner/liragram/tools eindigt op "/tools",
     dus inspiration-v18.html laadt daar vanzelf (endsWith-guard,
     isTools = true). Dit bestand doet er drie dingen bovenop:
       1. Verbergt alle Sempertex chrome (header, menu, footer,
          zijmenu) en de tools die de partner niet heeft. Standaard
          alleen de double stuffing calculator; met tools: [...] in
          de config krijgt de partner er meer, met tabbladen (sinds
          20/10/2026, eerst voor Mooideco). Op een partnerpagina toont
          inspiration-v18 nooit onze shopprijzen of winkelmand
          (partnerTools daar), en volgen de winkellinks van de
          kleurmatch-tool root.stxPartnerShopUrl van dit bestand.
       2. Zet de huisstijl van de distributeur erover heen
          (logo, kleuren, font) + eigen header en footer.
       3. Vervangt de Sempertex winkelmandknop door een
          bestelblok dat terugverwijst naar de webshop van de
          distributeur, met de twee gekozen kleurcodes erbij.
     Alle links naar de distributeur openen in een nieuw tabblad,
     zodat de calculator openblijft terwijl er besteld wordt.

     MAINTENANCE = 1 BESTAND
     De calculator zelf blijft inspiration-v18.html. Een fix of
     nieuwe kleur daar geldt meteen voor elke partnerpagina.
     Een partner toevoegen = 1 blok in PARTNERS hieronder, geen
     nieuwe code.

     TAAL
     De calculator kent nl/en/de/fr, geen Spaans. Dit bestand legt
     er per partner een vertaling overheen: strings hieronder
     overschrijft elke zichtbare tekst in de calculator-view, dus
     de basistaal van de pagina maakt niet uit. Kleurnamen,
     finishnamen en de naam van elke reeks blijven Engels: dat zijn
     de officiele Sempertex benamingen die ook op de doos en in de
     shop staan.

     PUBLICEREN: zolang Robin zelf test vanuit de backend mag de
     pagina onuitgegeven blijven. Voor de demo naar Liragram moet
     hij gepubliceerd zijn, anders krijgt Mayte een 404. Uit het
     menu houden + de noindex hieronder doet hetzelfde werk zonder
     de link te breken.
     ============================================================ -->

    if (built) { return; }
    COLROOT = root;
    built = true;
    document.body.classList.add('stx-partner-page');

    /* -- Teksten van de calculator vervangen -- */
    var S = P.strings || {};
    /* Taal van de partner over de tools leggen (Engels voor een Britse partner op /partner/...,
       Italiaans uit LANG_PACKS), en de beginwaarden van de prijscalculator (valuta, km of mijl, btw). */
    if (typeof root.stxUseLang === 'function' && (P.langs || []).length === 1) { root.stxUseLang(LANG, LANG_PACKS[LANG]); }
    if (typeof root.stxCcDefaults === 'function' && P.costDefaults) { root.stxCcDefaults(P.costDefaults); }
    /* In de tekstenlijst van de tools zelf, ook voor teksten die pas later verschijnen
       (Match a colour na een foto, de rijen van de kostprijscalculator, de palettes). */
    if (root.stxStr) { Object.keys(S).forEach(function (key) { root.stxStr[key] = S[key]; }); }
    if (typeof root.stxRelang === 'function') {
      /* inspiration-v18 zet dan alle teksten opnieuw en tekent elke tool opnieuw. */
      root.stxRelang();
    } else {
      Object.keys(S).forEach(function (key) {
        var els = root.querySelectorAll('[data-i18n="' + key + '"]');
        for (var n = 0; n < els.length; n++) { els[n].innerHTML = S[key]; }
      });
    }

    /* -- Sempertex winkelmandknop weg: die hoort hier niet -- */
    var cart = root.querySelector('#calc-cart');
    if (cart && cart.parentNode) { cart.parentNode.removeChild(cart); }
    root.classList.remove('stx-shop-on');

    /* -- Opgeslagen kopieën weg --
       Wordt de pagina in de Odoo-editor bewaard terwijl de tool al getekend is, dan staan header,
       tabbladen, bestelblok en footer als vaste HTML in de pagina en tekenen wij ze er een tweede
       keer bij (Euro Party B2B, 27/10/2026: header dubbel). Eerst alles van een vorige keer weg. */
    var old = document.querySelectorAll('.stx-pt-bar, .stx-pt-tabs, .stx-pt-order, .stx-pt-foot');
    for (var o = 0; o < old.length; o++) { if (old[o].parentNode) { old[o].parentNode.removeChild(old[o]); } }

    /* -- Header boven de tool -- */
    var bar = document.createElement('div');
    bar.className = 'stx-pt-bar';
    bar.innerHTML = '<div class="stx-pt-in">'
      + '<a href="' + esc(P.homeUrl) + '" target="_blank" rel="noopener"><img src="' + esc(P.logo) + '" alt="' + esc(P.name) + '"></a>'
      + '<a class="stx-pt-back" href="' + esc(P.shopUrl) + '" target="_blank" rel="noopener">' + esc(P.backLabel) + '</a>'
      + (LANGS.length > 1
          ? '<nav class="stx-pt-lang" aria-label="' + esc(P.langLabel || 'Taal / Language') + '">'
            + LANGS.map(function (l) {
                return '<a href="' + esc(langUrl(l)) + '" data-lang="' + l + '" hreflang="' + l + '" lang="' + l + '"'
                  + (l === LANG ? ' class="on" aria-current="true"' : '') + '>' + l.toUpperCase() + '</a>';
              }).join('')
            + '</nav>'
          : '')
      + '</div>';
    if (LANGS.length > 1) { bar.classList.add('stx-pt-has-lang'); }
    root.parentNode.insertBefore(bar, root);
    bar.addEventListener('click', function (e) {
      var a = e.target.closest('.stx-pt-lang a');
      if (a) { track('partner_lang_switch', { to: a.getAttribute('data-lang') }); }
    });

    /* -- Tabbladen, alleen als de partner meer dan 1 tool heeft -- */
    if (TOOLS.length > 1) {
      var STR = root.stxStr || {};
      var NAV = { calculator: 'nav_calc', cost: 'nav_cost', colour: 'nav_colour' };
      var tabs = document.createElement('nav');
      tabs.className = 'stx-pt-tabs';
      tabs.setAttribute('aria-label', P.tabsLabel || 'Tools');
      tabs.innerHTML = '<div class="stx-pt-in">' + TOOLS.map(function (v) {
        var label = S[NAV[v]] || STR[NAV[v]] || v;
        return '<a class="stx-pt-tab" href="#' + v + '" data-tool="' + v + '">' + esc(label) + '</a>';
      }).join('') + '</div>';
      root.parentNode.insertBefore(tabs, root);
      tabs.addEventListener('click', function (e) {
        var a = e.target.closest('.stx-pt-tab');
        if (a) { track('partner_tool_view', { tool: a.getAttribute('data-tool') }); }
      });
      syncTabs();
    }

    /* -- Winkellinks van de kleurmatch-tool naar de partner -- */
    fixShopLinks(root);
    syncTabs();

    /* Odoo zet bovenaan een verborgen link "Skip to Content" (zichtbaar bij navigeren met
       het toetsenbord), ook op een Nederlandse pagina in het Engels. Komt soms pas later. */
    function skipLink() {
      if (!P.skipLabel) { return; }
      var as = document.querySelectorAll('a.o_skip_to_content, a[href="#wrap"]');
      for (var k = 0; k < as.length; k++) {
        if (/skip to content/i.test(as[k].textContent || '')) { as[k].textContent = P.skipLabel; }
      }
    }
    skipLink();
    setTimeout(skipLink, 1500);

    /* -- Bestelblok onder de calculator -- */
    var view = root.querySelector('#view-calculator .calc');
    if (view) {
      var O = P.order;
      var box = document.createElement('div');
      box.className = 'stx-pt-order';
      box.innerHTML = '<h3>' + esc(O.title) + '</h3>'
        + '<p class="stx-pt-lead">' + esc(O.lead) + '</p>'
        + '<div class="stx-pt-picks" id="stx-pt-picks"></div>'
        + '<div class="stx-pt-actions">'
        + '<a class="stx-pt-btn" id="stx-pt-main" href="' + esc(P.shopUrl) + '" target="_blank" rel="noopener">' + esc(O.mainBtn) + '</a>'
        + '</div>'
        + (O.sizes && O.sizes.length
            ? '<div class="stx-pt-sizes"><span>' + esc(O.sizesLabel) + '</span>'
              + O.sizes.map(function (s) {
                  return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" data-size="' + esc(s.label) + '">' + esc(s.label) + '</a>';
                }).join('')
              + '</div>'
            : '');
      view.appendChild(box);

      box.addEventListener('click', function (e) {
        var a = e.target.closest('a[data-size]');
        if (a) { track('partner_order_click', { target: 'size', size: a.getAttribute('data-size') }); return; }
        var c = e.target.closest('a.stx-pt-pick');
        if (c) { track('partner_order_click', { target: 'colour', code: c.getAttribute('data-code') }); return; }
        if (e.target.closest('#stx-pt-main')) {
          track('partner_order_click', { target: 'shop', codes: document.getElementById('stx-pt-main').getAttribute('data-codes') || '' });
          return;
        }
      });
    }

    /* -- Footer onder de tool -- */
    if (P.footerText) {
      var foot = document.createElement('div');
      foot.className = 'stx-pt-foot';
      foot.innerHTML = '<div class="stx-pt-in">' + esc(P.footerText) + '</div>';
      if (root.nextSibling) { root.parentNode.insertBefore(foot, root.nextSibling); }
      else { root.parentNode.appendChild(foot); }
    }

    refreshPicks();

    /* De picker herschrijft zijn blokken bij elke klik: meelezen. */
    ['inner', 'outer'].forEach(function (which) {
      var el = document.getElementById('picked-' + which);
      if (!el || !window.MutationObserver) { return; }
      var t = null;
      new MutationObserver(function () {
        clearTimeout(t);
        t = setTimeout(refreshPicks, 40);
      }).observe(el, { childList: true, subtree: true, characterData: true });
    });

    track('partner_calc_open', {});
  }

  /* De loader haalt inspiration-v18.html los op, dus wachten we
     tot de root er staat en zichtbaar is gemaakt. */
  (function waitForRoot() {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      var root = document.getElementById('stx-insp-root');
      /* Zo vroeg mogelijk: de kleurmatch-tool vraagt hier zijn winkellinks op. */
      if (root && !root.stxPartnerShopUrl) { root.stxPartnerShopUrl = partnerShopUrl; }
      /* Ook wachten op het blok Match a colour (#dsm), anders blijft dat Engels. Komt het niet
         binnen 2 seconden (bv. ooit uitgezet), dan gaat de skin zonder. */
      /* En wachten tot inspiration-v18 echt gedraaid heeft (root.stxStr). Een opgeslagen kopie
         van de tools in de Odoo-pagina staat er al voor die code draait, en wordt dan nog
         vervangen; op die kopie bouwen gaf half Engelse teksten (Mooideco 20/10/2026).
         Na 10 seconden zonder gaat de skin toch verder. */
      if (root && root.querySelector('#view-calculator .calc-grid') && (root.stxStr || tries > 100)
          && (root.querySelector('#dsm') || tries > 20)) {
        clearInterval(timer);
        build(root);
      } else if (tries > 200) {           /* 20 seconden, dan opgeven */
        clearInterval(timer);
        if (window.console && console.warn) { console.warn('[STX partner] calculator niet gevonden'); }
      }
    }, 100);
  })();
})();
</script>
