<!-- ============================================================
     STX EU / PARTNER CALCULATOR (white-label skin) v1
     Bestand hoort in de repo onder /sections/ en wordt door de
     stx-loader geladen op elk pad dat eindigt op /tools EN begint
     met /partner/<slug>/ (zie PATH_RE onderaan de CONFIG).
     NIET los in Odoo plakken.

     WAT DIT DOET
     Dit bestand maakt GEEN tweede calculator. Het is een SKIN.
     De Odoo pagina /partner/liragram/tools eindigt op "/tools",
     dus inspiration-v18.html laadt daar vanzelf (endsWith-guard,
     isTools = true). Dit bestand doet er drie dingen bovenop:
       1. Verbergt alle Sempertex chrome (header, menu, footer,
          zijmenu, Cost Calculator en Colour Matching Tool).
       2. Zet de huisstijl van de distributeur erover heen
          (logo, kleuren, font) + eigen header en footer.
       3. Vervangt de Sempertex winkelmandknop door een
          bestelblok dat terugverwijst naar de webshop van de
          distributeur, met de twee gekozen kleurcodes erbij.

     MAINTENANCE = 1 BESTAND
     De calculator zelf blijft inspiration-v18.html. Een fix of
     nieuwe kleur daar geldt meteen voor elke partnerpagina.
     Een partner toevoegen = 1 blok in PARTNERS hieronder, geen
     nieuwe code.

     TAAL
     De calculator kent nl/en/de/fr, geen Spaans. Dit bestand legt
     er per partner een vertaling overheen: strings hieronder
     overschrijft elke zichtbare tekst in de calculator-view, dus
     de basistaal van de pagina maakt niet uit. Kleurnamen,
     finishnamen en de naam van elke reeks blijven Engels: dat zijn
     de officiele Sempertex benamingen die ook op de doos en in de
     shop staan.

     PUBLICEREN: zolang Robin zelf test vanuit de backend mag de
     pagina onuitgegeven blijven. Voor de demo naar Liragram moet
     hij gepubliceerd zijn, anders krijgt Mayte een 404. Uit het
     menu houden + de noindex hieronder doet hetzelfde werk zonder
     de link te breken.
     ============================================================ -->

  /* Pad: /partner/<slug>/tools, met of zonder taalprefix. */
  var PATH_RE = /^(?:\/(?:fr|de|en_gb))?\/partner\/([a-z0-9-]+)\/tools$/;

  var P = PARTNERS[m[1]];
  if (!P) { return; }

  /* Nooit draaien in de Odoo editor. */
  function inEdit() {
    return document.body.classList.contains('editor_enable')
      || !!document.querySelector('.odoo-editor-editable')
      || !!document.querySelector('#wrap.o_editable');
  }
  if (inEdit()) { return; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* Eigen tracking: GA4, GTM en PostHog als ze er zijn. */

    try {
      params = params || {};
      params.partner = P.name;
      params.page_section = 'partner_calculator';
      if (typeof window.gtag === 'function') { window.gtag('event', ev, params); }
      else if (window.dataLayer && window.dataLayer.push) { window.dataLayer.push(Object.assign({ event: ev }, params)); }
      if (window.posthog && window.posthog.capture) { window.posthog.capture(ev, params); }
    } catch (e) { /* tracking mag de pagina nooit breken */ }
  }

  /* ---------- 1. CHROME WEG + HUISSTIJL EROVER ---------- */
  document.documentElement.classList.add('stx-partner');
  document.body.classList.add('stx-partner');

  /* Deze pagina hoort niet in Google: het is de tool van de partner. */
  (function noindex() {
    if (document.querySelector('meta[name="robots"][data-stx-partner]')) { return; }
    var mt = document.createElement('meta');
    mt.setAttribute('name', 'robots');
    mt.setAttribute('content', 'noindex,nofollow');
    mt.setAttribute('data-stx-partner', '1');
    document.head.appendChild(mt);
  })();

  /* Tabblad: titel en pictogram van de partner. Odoo zet zelf
     "<paginanaam> | Sempertex Europe" in de titel, dus die moet weg. */
  if (P.pageTitle) {
    document.title = P.pageTitle;
    /* Odoo's website-code herschrijft de titel soms na het laden. */
    setTimeout(function () { document.title = P.pageTitle; }, 400);
  }
  (function favicon() {
    var href = P.favicon || P.logo;
    if (!href) { return; }
    var olds = document.querySelectorAll('link[rel~="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]');
    for (var i = 0; i < olds.length; i++) {
      if (olds[i].parentNode) { olds[i].parentNode.removeChild(olds[i]); }
    }
    var ic = document.createElement('link');
    ic.rel = 'icon';
    ic.href = href;
    ic.setAttribute('data-stx-partner', '1');
    document.head.appendChild(ic);
  })();

  if (P.fontUrl) {
    var fl = document.createElement('link');
    fl.rel = 'stylesheet';
    fl.href = P.fontUrl;
    document.head.appendChild(fl);
  }

  var css = document.createElement('style');
  css.setAttribute('data-stx-partner', '1');
  css.textContent = [
    /* -- Sempertex chrome onzichtbaar -- */
    'html.stx-partner header#top,',
    'html.stx-partner #wrapwrap > header,',
    'html.stx-partner .o_header_standard,',
    'html.stx-partner .o_navbar_mobile,',
    'html.stx-partner #top_menu_container,',
    'html.stx-partner #wrapwrap > footer,',
    'html.stx-partner footer#bottom,',
    'html.stx-partner .o_footer,',
    'html.stx-partner .o_livechat_button,',
    'html.stx-partner .o_newsletter_popup,',
    'html.stx-partner .o_scroll_button { display: none !important; }',
    'html.stx-partner #wrap { padding: 0 !important; margin: 0 !important; min-height: 0 !important; }',
    'html.stx-partner body { background: #fff; }',

    /* -- Laadscherm in de kleur van de partner -- */
    '#stx-loadwall .stx-spin { border-color: ' + P.brandLight + ' !important; border-top-color: ' + P.brand + ' !important; }',

    /* -- Alleen de double stuffing calculator, geen zijmenu -- */
    '.stx-partner-page .stx-insp .side { display: none !important; }',
    '.stx-partner-page .stx-insp .layout { display: block !important; }',
    '.stx-partner-page .stx-insp #view-cost,',
    '.stx-partner-page .stx-insp #view-colour { display: none !important; }',
    '.stx-partner-page .stx-insp .wrap { max-width: 1280px; padding-top: 8px; padding-bottom: 32px; }',

    /* -- Huisstijl van de partner over de calculator heen -- */
    '.stx-partner-page .stx-insp {',
    '  --purple: ' + P.brand + ';',
    '  --purple-light: ' + P.brandLight + ';',
    '  --purple-bg: ' + P.brandLight + ';',
    '  --dark: ' + P.brandDark + ';',
    '  --yellow: ' + P.accent + ';',
    '  --rule: rgba(0,0,0,.12);',
    '  --glow: 0 10px 28px rgba(0,0,0,.18);',
    '  --glow-y: 0 8px 22px rgba(0,0,0,.18);',
    '  font-family: ' + P.font + ';',
    '}',

    /* -- Partner header -- */
    '.stx-pt-bar { font-family: ' + P.font + '; background: #fff; border-bottom: 1px solid rgba(0,0,0,.1); }',
    '.stx-pt-bar .stx-pt-in { max-width: 1280px; margin: 0 auto; padding: 14px clamp(14px,3vw,40px); display: flex; align-items: center; gap: 20px; }',
    '.stx-pt-bar img { height: ' + P.logoHeight + 'px; width: auto; display: block; }',
    '.stx-pt-back { margin-left: auto; font-size: 14px; font-weight: 700; text-decoration: none; color: ' + P.brandDark + '; border: 2px solid ' + P.brand + '; border-radius: 999px; padding: 8px 18px; transition: background .15s ease, color .15s ease; }',
    '.stx-pt-back:hover { background: ' + P.brand + '; color: #fff; }',

    /* -- Partner footer -- */
    '.stx-pt-foot { font-family: ' + P.font + '; border-top: 1px solid rgba(0,0,0,.1); margin-top: 8px; }',
    '.stx-pt-foot .stx-pt-in { max-width: 1280px; margin: 0 auto; padding: 22px clamp(14px,3vw,40px); font-size: 13px; opacity: .7; }',

    /* -- Bestelblok -- */
    '.stx-pt-order { font-family: ' + P.font + '; background: ' + P.brandLight + '; border: 2px solid ' + P.brand + '; border-radius: 12px; padding: clamp(20px,2.4vw,30px); margin-top: clamp(22px,2.6vw,34px); }',
    '.stx-pt-order h3 { font-size: clamp(20px,2.2vw,28px); font-weight: 800; letter-spacing: -.01em; margin: 0 0 8px; color: ' + P.brandDark + '; }',
    '.stx-pt-order p.stx-pt-lead { font-size: 15px; margin: 0 0 18px; color: ' + P.brandDark + '; opacity: .85; }',
    '.stx-pt-picks { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 18px; }',
    '.stx-pt-pick { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 10px; padding: 10px 16px; }',
    '.stx-pt-dot { width: 26px; height: 26px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,.18); }',
    '.stx-pt-pick .stx-pt-lbl { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .6; }',
    '.stx-pt-pick .stx-pt-val { font-size: 15px; font-weight: 800; color: ' + P.brandDark + '; }',
    '.stx-pt-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }',
    '.stx-pt-btn { display: inline-block; font-family: inherit; font-size: 15px; font-weight: 800; padding: 13px 24px; border-radius: 8px; border: 2px solid ' + P.brand + '; background: ' + P.brand + '; color: #fff; text-decoration: none; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }',
    '.stx-pt-btn:hover { transform: scale(1.03); box-shadow: 0 10px 26px rgba(0,0,0,.18); }',
    '.stx-pt-btn.ghost { background: #fff; color: ' + P.brandDark + '; }',
    '.stx-pt-sizes { margin-top: 16px; font-size: 13px; }',
    '.stx-pt-sizes span { font-weight: 700; opacity: .7; margin-right: 8px; }',
    '.stx-pt-sizes a { display: inline-block; margin: 6px 8px 0 0; font-size: 13px; font-weight: 700; text-decoration: none; color: ' + P.brandDark + '; background: #fff; border-radius: 999px; padding: 7px 14px; }',
    '.stx-pt-sizes a:hover { background: ' + P.brand + '; color: #fff; }',
    '@media (max-width: 600px) { .stx-pt-bar .stx-pt-in { flex-wrap: wrap; } .stx-pt-back { margin-left: 0; } }'
  ].join('\n');
  document.head.appendChild(css);

  /* ---------- 2. Meteen naar de calculator-view ---------- */
  /* Werkt of dit bestand nu voor of na inspiration-v18 binnenkomt:
     komt het eerder, dan leest de router straks #calculator;
     komt het later, dan vuurt hashchange en schakelt de router om. */
  if ((window.location.hash || '').toLowerCase() !== '#calculator') {
    try { window.location.hash = 'calculator'; } catch (e) {}
  }

  /* ---------- 3. Wachten op de calculator, dan opmaken ---------- */
  var built = false;

  function pick(which) {
    var box = document.querySelector('#picked-' + which + ' .picked-name');
    var sw = document.querySelector('#rs-' + which);
    var txt = box ? (box.textContent || '').trim() : '';
    var code = (txt.match(/(\d{3})\s*$/) || [])[1] || '';
    return {
      text: txt,
      code: code,
      hex: sw ? window.getComputedStyle(sw).backgroundColor : 'transparent'
    };
  }

  function refreshPicks() {
    var host = document.getElementById('stx-pt-picks');
    if (!host) { return; }
    var i = pick('inner'), o = pick('outer');
    host.innerHTML =
      '<div class="stx-pt-pick"><span class="stx-pt-dot" style="background:' + esc(i.hex) + '"></span>'
      + '<span><span class="stx-pt-lbl">' + esc(P.order.innerLabel) + '</span><br>'
      + '<span class="stx-pt-val">' + esc(i.text) + '</span></span></div>'
      + '<div class="stx-pt-pick"><span class="stx-pt-dot" style="background:' + esc(o.hex) + '"></span>'
      + '<span><span class="stx-pt-lbl">' + esc(P.order.outerLabel) + '</span><br>'
      + '<span class="stx-pt-val">' + esc(o.text) + '</span></span></div>';

    /* Hoofdknop: op kleurcode zoeken als de partner een zoek-URL heeft,
       anders gewoon naar de Sempertex categorie van de partner. */
    var main = document.getElementById('stx-pt-main');
    if (main) {
      var url = P.shopUrl;
      if (P.order.searchUrl && i.code) {
        url = P.order.searchUrl.replace('{q}', encodeURIComponent(i.code));
      }
      main.href = url;
      main.setAttribute('data-codes', [i.code, o.code].filter(Boolean).join(', '));
    }
  }

  function build(root) {
    if (built) { return; }
    built = true;
    document.body.classList.add('stx-partner-page');

    /* -- Teksten van de calculator vervangen -- */
    var S = P.strings || {};
    Object.keys(S).forEach(function (key) {
      var el = root.querySelector('[data-i18n="' + key + '"]');
      if (el) { el.innerHTML = S[key]; }
    });

    /* -- Sempertex winkelmandknop weg: die hoort hier niet -- */
    var cart = root.querySelector('#calc-cart');
    if (cart && cart.parentNode) { cart.parentNode.removeChild(cart); }
    root.classList.remove('stx-shop-on');

    /* -- Header boven de tool -- */
    var bar = document.createElement('div');
    bar.className = 'stx-pt-bar';
    bar.innerHTML = '<div class="stx-pt-in">'
      + '<a href="' + esc(P.homeUrl) + '"><img src="' + esc(P.logo) + '" alt="' + esc(P.name) + '"></a>'
      + '<a class="stx-pt-back" href="' + esc(P.shopUrl) + '">' + esc(P.backLabel) + '</a>'
      + '</div>';
    root.parentNode.insertBefore(bar, root);

    /* -- Bestelblok onder de calculator -- */
    var view = root.querySelector('#view-calculator .calc');
    if (view) {
      var O = P.order;
      var box = document.createElement('div');
      box.className = 'stx-pt-order';
      box.innerHTML = '<h3>' + esc(O.title) + '</h3>'
        + '<p class="stx-pt-lead">' + esc(O.lead) + '</p>'
        + '<div class="stx-pt-picks" id="stx-pt-picks"></div>'
        + '<div class="stx-pt-actions">'
        + '<a class="stx-pt-btn" id="stx-pt-main" href="' + esc(P.shopUrl) + '" target="_blank" rel="noopener">' + esc(O.mainBtn) + '</a>'
        + '<button type="button" class="stx-pt-btn ghost" id="stx-pt-copy">' + esc(O.copyBtn) + '</button>'
        + '</div>'
        + (O.sizes && O.sizes.length
            ? '<div class="stx-pt-sizes"><span>' + esc(O.sizesLabel) + '</span>'
              + O.sizes.map(function (s) {
                  return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" data-size="' + esc(s.label) + '">' + esc(s.label) + '</a>';
                }).join('')
              + '</div>'
            : '');
      view.appendChild(box);

      box.addEventListener('click', function (e) {
        var a = e.target.closest('a[data-size]');
        if (a) { track('partner_order_click', { target: 'size', size: a.getAttribute('data-size') }); return; }
        if (e.target.closest('#stx-pt-main')) {
          track('partner_order_click', { target: 'shop', codes: document.getElementById('stx-pt-main').getAttribute('data-codes') || '' });
          return;
        }
        var cp = e.target.closest('#stx-pt-copy');
        if (cp) {
          var codes = (document.getElementById('stx-pt-main').getAttribute('data-codes') || '');
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(codes); }
          } catch (err) {}
          cp.textContent = O.copiedBtn;
          setTimeout(function () { cp.textContent = O.copyBtn; }, 1600);
          track('partner_order_click', { target: 'copy', codes: codes });
        }
      });
    }

    /* -- Footer onder de tool -- */
    if (P.footerText) {
      var foot = document.createElement('div');
      foot.className = 'stx-pt-foot';
      foot.innerHTML = '<div class="stx-pt-in">' + esc(P.footerText) + '</div>';
      if (root.nextSibling) { root.parentNode.insertBefore(foot, root.nextSibling); }
      else { root.parentNode.appendChild(foot); }
    }

    refreshPicks();

    /* De picker herschrijft zijn blokken bij elke klik: meelezen. */
    ['inner', 'outer'].forEach(function (which) {
      var el = document.getElementById('picked-' + which);
      if (!el || !window.MutationObserver) { return; }
      var t = null;
      new MutationObserver(function () {
        clearTimeout(t);
        t = setTimeout(refreshPicks, 40);
      }).observe(el, { childList: true, subtree: true, characterData: true });
    });

    track('partner_calc_open', {});
  }

  /* De loader haalt inspiration-v18.html los op, dus wachten we
     tot de root er staat en zichtbaar is gemaakt. */
  (function waitForRoot() {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      var root = document.getElementById('stx-insp-root');
      if (root && root.querySelector('#view-calculator .calc-grid')) {
        clearInterval(timer);
        build(root);
      } else if (tries > 200) {           /* 20 seconden, dan opgeven */
        clearInterval(timer);
        if (window.console && console.warn) { console.warn('[STX partner] calculator niet gevonden'); }
      }
    }, 100);
  })();
})();
</script>
