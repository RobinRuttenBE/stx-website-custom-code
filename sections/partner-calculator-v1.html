<!-- ============================================================
     STX EU / PARTNER CALCULATOR (white-label skin) v1
     Bestand hoort in de repo onder /sections/ en wordt door de
     stx-loader geladen op elk pad dat eindigt op /tools EN begint
     met /partner/<slug>/ (zie PATH_RE onderaan de CONFIG).
     NIET los in Odoo plakken.

     WAT DIT DOET
     Dit bestand maakt GEEN tweede calculator. Het is een SKIN.
     De Odoo pagina /partner/liragram/tools eindigt op "/tools",
     dus inspiration-v18.html laadt daar vanzelf (endsWith-guard,
     isTools = true). Dit bestand doet er drie dingen bovenop:
       1. Verbergt alle Sempertex chrome (header, menu, footer,
          zijmenu) en de tools die de partner niet heeft. Standaard
          alleen de double stuffing calculator; met tools: [...] in
          de config krijgt de partner er meer, met tabbladen (sinds
          20/10/2026, eerst voor Mooideco). Op een partnerpagina toont
          inspiration-v18 nooit onze shopprijzen of winkelmand
          (partnerTools daar), en volgen de winkellinks van de
          kleurmatch-tool root.stxPartnerShopUrl van dit bestand.
       2. Zet de huisstijl van de distributeur erover heen
          (logo, kleuren, font) + eigen header en footer.
       3. Vervangt de Sempertex winkelmandknop door een
          bestelblok dat terugverwijst naar de webshop van de
          distributeur, met de twee gekozen kleurcodes erbij.
     Alle links naar de distributeur openen in een nieuw tabblad,
     zodat de calculator openblijft terwijl er besteld wordt.

     MAINTENANCE = 1 BESTAND
     De calculator zelf blijft inspiration-v18.html. Een fix of
     nieuwe kleur daar geldt meteen voor elke partnerpagina.
     Een partner toevoegen = 1 blok in PARTNERS hieronder, geen
     nieuwe code.

     TAAL
     De calculator kent nl/en/de/fr, geen Spaans. Dit bestand legt
     er per partner een vertaling overheen: strings hieronder
     overschrijft elke zichtbare tekst in de calculator-view, dus
     de basistaal van de pagina maakt niet uit. Kleurnamen,
     finishnamen en de naam van elke reeks blijven Engels: dat zijn
     de officiele Sempertex benamingen die ook op de doos en in de
     shop staan.

     PUBLICEREN: zolang Robin zelf test vanuit de backend mag de
     pagina onuitgegeven blijven. Voor de demo naar Liragram moet
     hij gepubliceerd zijn, anders krijgt Mayte een 404. Uit het
     menu houden + de noindex hieronder doet hetzelfde werk zonder
     de link te breken.
     ============================================================ -->

  var PATH_RE = /^(?:\/(?:fr|de|en_gb))?\/partner\/([a-z0-9-]+)\/tools$/;

     (Odoo zet geen prefix voor Nederlands). */
  var LANG = (/^\/(en_gb|fr|de)\//.exec(path) || [])[1] || 'nl';
  if (LANG === 'en_gb') { LANG = 'en'; }
  var SLUG = m[1];

  /* Teksten per taal (text: { nl: {...}, en: {...} }). Wat daarin staat overschrijft de
     velden van de partner; order gaat veld per veld, zodat links en reeksen gedeeld blijven.
     Partners zonder text (Liragram) blijven zoals ze zijn. */
  if (P.text) {
    var T = P.text[LANG] || P.text[(P.langs || ['nl'])[0]] || {};
    var merged = {};
    Object.keys(P).forEach(function (k) { merged[k] = P[k]; });
    Object.keys(T).forEach(function (k) { merged[k] = T[k]; });
    merged.order = {};
    [P.order || {}, T.order || {}].forEach(function (o) { Object.keys(o).forEach(function (k) { merged.order[k] = o[k]; }); });
    P = merged;
  }

  /* Taalschakelaar rechtsboven (langs: ['nl', 'en']). Odoo kent elke pagina in elke taal:
     /partner/<slug>/tools is Nederlands, /en_GB/partner/<slug>/tools Engels.
     Nederlands MOET via /nl/...: na een bezoek in het Engels staat de taalcookie van Odoo op
     Engels en stuurt Odoo /partner/... in de browser terug naar /en_GB/ (Robin 20/10/2026).
     /nl/... zet de cookie op Nederlands en stuurt door naar /partner/..., net als Odoo's eigen

  var LANGS = (P.langs || []).filter(function (l) { return /^(nl|en|fr|de)$/.test(l); });

    '.stx-pt-foot { font-family: ' + P.font + '; border-top: 1px solid rgba(0,0,0,.1); margin-top: 8px; }',
    '.stx-pt-foot .stx-pt-in { max-width: 1280px; margin: 0 auto; padding: 22px clamp(14px,3vw,40px); font-size: 13px; opacity: .7; }',

    /* -- Bestelblok -- */
    '.stx-pt-order { font-family: ' + P.font + '; background: ' + P.brandLight + '; border: 2px solid ' + P.brand + '; border-radius: 12px; padding: clamp(20px,2.4vw,30px); margin-top: clamp(22px,2.6vw,34px); }',
    '.stx-pt-order h3 { font-size: clamp(20px,2.2vw,28px); font-weight: 800; letter-spacing: -.01em; margin: 0 0 8px; color: ' + P.brandDark + '; }',
    '.stx-pt-order p.stx-pt-lead { font-size: 15px; margin: 0 0 18px; color: ' + P.brandDark + '; opacity: .85; }',
    '.stx-pt-picks { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 18px; }',
    '.stx-pt-pick { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 10px; padding: 10px 16px; border: 2px solid transparent; }',
    'a.stx-pt-pick { text-decoration: none; color: inherit; transition: border-color .15s ease, transform .15s ease; }',
    'a.stx-pt-pick:hover { border-color: ' + P.brand + '; transform: translateY(-1px); }',
    'a.stx-pt-pick .stx-pt-go { font-size: 13px; font-weight: 700; color: ' + P.brand + '; margin-left: 4px; }',
    '.stx-pt-dot { width: 26px; height: 26px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,.18); }',
    '.stx-pt-pick .stx-pt-lbl { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .6; }',
    '.stx-pt-pick .stx-pt-val { font-size: 15px; font-weight: 800; color: ' + P.brandDark + '; }',
    '.stx-pt-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }',
    '.stx-pt-btn { display: inline-block; font-family: inherit; font-size: 15px; font-weight: 800; padding: 13px 24px; border-radius: 8px; border: 2px solid ' + P.brand + '; background: ' + P.brand + '; color: #fff; text-decoration: none; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }',
    '.stx-pt-btn:hover { transform: scale(1.03); box-shadow: 0 10px 26px rgba(0,0,0,.18); }',
    '.stx-pt-sizes { margin-top: 16px; font-size: 13px; }',
    '.stx-pt-sizes span { font-weight: 700; opacity: .7; margin-right: 8px; }',
    '.stx-pt-sizes a { display: inline-block; margin: 6px 8px 0 0; font-size: 13px; font-weight: 700; text-decoration: none; color: ' + P.brandDark + '; background: #fff; border-radius: 999px; padding: 7px 14px; }',
    '.stx-pt-sizes a:hover { background: ' + P.brand + '; color: #fff; }',
    '@media (max-width: 600px) { .stx-pt-bar .stx-pt-in { flex-wrap: wrap; } .stx-pt-back { margin-left: 0; } }',

    /* -- Taalschakelaar -- */
    '.stx-pt-lang { display: flex; flex: none; border: 2px solid ' + P.brand + '; border-radius: 999px; overflow: hidden; }',
    '.stx-pt-lang a { font-size: 13px; font-weight: 800; letter-spacing: .04em; padding: 7px 12px; text-decoration: none; color: ' + P.brandDark + '; line-height: 1.2; }',
    '.stx-pt-lang a:hover { background: ' + P.brandLight + '; }',
    '.stx-pt-lang a.on { background: ' + P.brand + '; color: #fff; }',
    '.stx-pt-bar.stx-pt-has-lang .stx-pt-in { gap: 12px; }',
    /* Telefoon: logo, terugknop en taal op 1 regel. */
    '@media (max-width: 600px) { .stx-pt-bar.stx-pt-has-lang .stx-pt-in { flex-wrap: nowrap; padding: 10px 12px; gap: 8px; } .stx-pt-bar.stx-pt-has-lang img { height: ' + Math.round(P.logoHeight * 0.72) + 'px; } .stx-pt-bar.stx-pt-has-lang .stx-pt-back { margin-left: auto; font-size: 12.5px; padding: 6px 11px; white-space: nowrap; } .stx-pt-has-lang .stx-pt-lang a { padding: 6px 9px; font-size: 12px; } }'
  ].join('\n');
  document.head.appendChild(css);

  /* ---------- 2. Meteen naar de eerste tool van de partner ---------- */
  /* Werkt of dit bestand nu voor of na inspiration-v18 binnenkomt:
     komt het eerder, dan leest de router straks de hash;
     komt het later, dan vuurt hashchange en schakelt de router om.
     Een hash van een tool die deze partner niet heeft gaat terug naar
     de eerste (bv. #cost op de pagina van Liragram). */
  function currentTool() { return (window.location.hash || '').replace('#', '').toLowerCase(); }
  if (TOOLS.indexOf(currentTool()) === -1) {
    try { window.location.hash = TOOLS[0]; } catch (e) {}
  }
  window.addEventListener('hashchange', function () {
    if (TOOLS.indexOf(currentTool()) === -1) {
      try { window.location.replace('#' + TOOLS[0]); } catch (e) {}
      return;
    }
    syncTabs();
  });

  function syncTabs() {
    var cur = currentTool();
    var tabs = document.querySelectorAll('.stx-pt-tab');
    for (var i = 0; i < tabs.length; i++) {
      var on = tabs[i].getAttribute('data-tool') === cur;
      tabs[i].classList.toggle('on', on);
      if (on) { tabs[i].setAttribute('aria-current', 'page'); } else { tabs[i].removeAttribute('aria-current'); }
    }
    /* Taalschakelaar blijft op dezelfde tool. */
    var langs = document.querySelectorAll('.stx-pt-lang a[data-lang]');
    for (var j = 0; j < langs.length; j++) { langs[j].href = langUrl(langs[j].getAttribute('data-lang')); }
  }

  /* Winkellinks van de kleurmatch-tool die er al stonden voor de skin binnen was
     (die kregen toen nog geen adres), alsnog naar de webshop van de partner. */
  function fixShopLinks(root) {
    var links = root.querySelectorAll('#ct-root a.js-shop[data-code], #ct-shop-btn[data-code]');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      a.href = partnerShopUrl(a.getAttribute('data-code'));
      a.target = '_blank';
      a.rel = 'noopener';
      if (a.id === 'ct-shop-btn') { a.style.display = ''; }
    }
  }

  /* ---------- 3. Wachten op de calculator, dan opmaken ---------- */
  var built = false;

  function pick(which) {
    var box = document.querySelector('#picked-' + which + ' .picked-name');
    var sw = document.querySelector('#rs-' + which);
    var txt = box ? (box.textContent || '').trim() : '';
    var code = (txt.match(/(\d{3})\s*$/) || [])[1] || '';
    return {
      text: txt,
      code: code,
      hex: sw ? window.getComputedStyle(sw).backgroundColor : 'transparent'
    };
  }

  function refreshPicks() {
    var host = document.getElementById('stx-pt-picks');
    if (!host) { return; }
    var i = pick('inner'), o = pick('outer');
    /* Met een zoek-URL is elke kleur een link die die kleurcode in de webshop
       van de partner opzoekt. Zonder zoek-URL blijft het een kaartje. */
    function card(p, label) {
      var inner = '<span class="stx-pt-dot" style="background:' + esc(p.hex) + '"></span>'
        + '<span><span class="stx-pt-lbl">' + esc(label) + '</span><br>'
        + '<span class="stx-pt-val">' + esc(p.text) + '</span>'
        + (SEARCH && p.code ? '<span class="stx-pt-go" aria-hidden="true">&#8599;</span>' : '')
        + '</span>';
      if (SEARCH && p.code) {
        return '<a class="stx-pt-pick" href="' + esc(partnerShopUrl(p.code)) + '" target="_blank" rel="noopener" data-code="' + esc(p.code) + '">' + inner + '</a>';
      }
      return '<div class="stx-pt-pick">' + inner + '</div>';
    }
    host.innerHTML = card(i, P.order.innerLabel) + card(o, P.order.outerLabel);

    /* Hoofdknop: naar alle Sempertex ballonnen van de partner. */
    var main = document.getElementById('stx-pt-main');
    if (main) {
      main.href = P.shopUrl;
      main.setAttribute('data-codes', [i.code, o.code].filter(Boolean).join(', '));
    }
  }

  function build(root) {
    if (built) { return; }
    built = true;
    document.body.classList.add('stx-partner-page');

    /* -- Teksten van de calculator vervangen -- */
    var S = P.strings || {};
    /* In de tekstenlijst van de tools zelf, ook voor teksten die pas later verschijnen
       (Match a colour na een foto, de rijen van de kostprijscalculator, de palettes). */
    if (root.stxStr) { Object.keys(S).forEach(function (key) { root.stxStr[key] = S[key]; }); }
    if (typeof root.stxRelang === 'function') {
      /* inspiration-v18 zet dan alle teksten opnieuw en tekent elke tool opnieuw. */
      root.stxRelang();
    } else {
      Object.keys(S).forEach(function (key) {
        var els = root.querySelectorAll('[data-i18n="' + key + '"]');
        for (var n = 0; n < els.length; n++) { els[n].innerHTML = S[key]; }
      });
    }

    /* -- Sempertex winkelmandknop weg: die hoort hier niet -- */
    var cart = root.querySelector('#calc-cart');
    if (cart && cart.parentNode) { cart.parentNode.removeChild(cart); }
    root.classList.remove('stx-shop-on');

    /* -- Header boven de tool -- */
    var bar = document.createElement('div');
    bar.className = 'stx-pt-bar';
    bar.innerHTML = '<div class="stx-pt-in">'
      + '<a href="' + esc(P.homeUrl) + '" target="_blank" rel="noopener"><img src="' + esc(P.logo) + '" alt="' + esc(P.name) + '"></a>'
      + '<a class="stx-pt-back" href="' + esc(P.shopUrl) + '" target="_blank" rel="noopener">' + esc(P.backLabel) + '</a>'
      + (LANGS.length > 1
          ? '<nav class="stx-pt-lang" aria-label="' + esc(P.langLabel || 'Taal / Language') + '">'
            + LANGS.map(function (l) {
                return '<a href="' + esc(langUrl(l)) + '" data-lang="' + l + '" hreflang="' + l + '" lang="' + l + '"'
                  + (l === LANG ? ' class="on" aria-current="true"' : '') + '>' + l.toUpperCase() + '</a>';
              }).join('')
            + '</nav>'
          : '')
      + '</div>';
    if (LANGS.length > 1) { bar.classList.add('stx-pt-has-lang'); }
    root.parentNode.insertBefore(bar, root);
    bar.addEventListener('click', function (e) {
      var a = e.target.closest('.stx-pt-lang a');
      if (a) { track('partner_lang_switch', { to: a.getAttribute('data-lang') }); }
    });

    /* -- Tabbladen, alleen als de partner meer dan 1 tool heeft -- */
    if (TOOLS.length > 1) {
      var STR = root.stxStr || {};
      var NAV = { calculator: 'nav_calc', cost: 'nav_cost', colour: 'nav_colour' };
      var tabs = document.createElement('nav');
      tabs.className = 'stx-pt-tabs';
      tabs.setAttribute('aria-label', P.tabsLabel || 'Tools');
      tabs.innerHTML = '<div class="stx-pt-in">' + TOOLS.map(function (v) {
        var label = S[NAV[v]] || STR[NAV[v]] || v;
        return '<a class="stx-pt-tab" href="#' + v + '" data-tool="' + v + '">' + esc(label) + '</a>';
      }).join('') + '</div>';
      root.parentNode.insertBefore(tabs, root);
      tabs.addEventListener('click', function (e) {
        var a = e.target.closest('.stx-pt-tab');
        if (a) { track('partner_tool_view', { tool: a.getAttribute('data-tool') }); }
      });
      syncTabs();
    }

    /* -- Winkellinks van de kleurmatch-tool naar de partner -- */
    fixShopLinks(root);
    syncTabs();

    /* Odoo zet bovenaan een verborgen link "Skip to Content" (zichtbaar bij navigeren met
       het toetsenbord), ook op een Nederlandse pagina in het Engels. Komt soms pas later. */
    function skipLink() {
      if (!P.skipLabel) { return; }
      var as = document.querySelectorAll('a.o_skip_to_content, a[href="#wrap"]');
      for (var k = 0; k < as.length; k++) {
        if (/skip to content/i.test(as[k].textContent || '')) { as[k].textContent = P.skipLabel; }
      }
    }
    skipLink();
    setTimeout(skipLink, 1500);

    /* -- Bestelblok onder de calculator -- */
    var view = root.querySelector('#view-calculator .calc');
    if (view) {
      var O = P.order;
      var box = document.createElement('div');
      box.className = 'stx-pt-order';
      box.innerHTML = '<h3>' + esc(O.title) + '</h3>'
        + '<p class="stx-pt-lead">' + esc(O.lead) + '</p>'
        + '<div class="stx-pt-picks" id="stx-pt-picks"></div>'
        + '<div class="stx-pt-actions">'
        + '<a class="stx-pt-btn" id="stx-pt-main" href="' + esc(P.shopUrl) + '" target="_blank" rel="noopener">' + esc(O.mainBtn) + '</a>'
        + '</div>'
        + (O.sizes && O.sizes.length
            ? '<div class="stx-pt-sizes"><span>' + esc(O.sizesLabel) + '</span>'
              + O.sizes.map(function (s) {
                  return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" data-size="' + esc(s.label) + '">' + esc(s.label) + '</a>';
                }).join('')
              + '</div>'
            : '');
      view.appendChild(box);

      box.addEventListener('click', function (e) {
        var a = e.target.closest('a[data-size]');
        if (a) { track('partner_order_click', { target: 'size', size: a.getAttribute('data-size') }); return; }
        var c = e.target.closest('a.stx-pt-pick');
        if (c) { track('partner_order_click', { target: 'colour', code: c.getAttribute('data-code') }); return; }
        if (e.target.closest('#stx-pt-main')) {
          track('partner_order_click', { target: 'shop', codes: document.getElementById('stx-pt-main').getAttribute('data-codes') || '' });
          return;
        }
      });
    }

    /* -- Footer onder de tool -- */
    if (P.footerText) {
      var foot = document.createElement('div');
      foot.className = 'stx-pt-foot';
      foot.innerHTML = '<div class="stx-pt-in">' + esc(P.footerText) + '</div>';
      if (root.nextSibling) { root.parentNode.insertBefore(foot, root.nextSibling); }
      else { root.parentNode.appendChild(foot); }
    }

    refreshPicks();

    /* De picker herschrijft zijn blokken bij elke klik: meelezen. */
    ['inner', 'outer'].forEach(function (which) {
      var el = document.getElementById('picked-' + which);
      if (!el || !window.MutationObserver) { return; }
      var t = null;
      new MutationObserver(function () {
        clearTimeout(t);
        t = setTimeout(refreshPicks, 40);
      }).observe(el, { childList: true, subtree: true, characterData: true });
    });

    track('partner_calc_open', {});
  }

  /* De loader haalt inspiration-v18.html los op, dus wachten we
     tot de root er staat en zichtbaar is gemaakt. */
  (function waitForRoot() {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      var root = document.getElementById('stx-insp-root');
      /* Zo vroeg mogelijk: de kleurmatch-tool vraagt hier zijn winkellinks op. */
      if (root && !root.stxPartnerShopUrl) { root.stxPartnerShopUrl = partnerShopUrl; }
      /* Ook wachten op het blok Match a colour (#dsm), anders blijft dat Engels. Komt het niet
         binnen 2 seconden (bv. ooit uitgezet), dan gaat de skin zonder. */
      /* En wachten tot inspiration-v18 echt gedraaid heeft (root.stxStr). Een opgeslagen kopie
         van de tools in de Odoo-pagina staat er al voor die code draait, en wordt dan nog
         vervangen; op die kopie bouwen gaf half Engelse teksten (Mooideco 20/10/2026).
         Na 10 seconden zonder gaat de skin toch verder. */
      if (root && root.querySelector('#view-calculator .calc-grid') && (root.stxStr || tries > 100)
          && (root.querySelector('#dsm') || tries > 20)) {
        clearInterval(timer);
        build(root);
      } else if (tries > 200) {           /* 20 seconden, dan opgeven */
        clearInterval(timer);
        if (window.console && console.warn) { console.warn('[STX partner] calculator niet gevonden'); }
      }
    }, 100);
  })();
})();
</script>
