<!-- ============================================================
     STX EU / VERJAARDAG v1 (sectiebestand voor de section loader)
     Laadt op ELKE pagina (loader-regel all: true), doet alleen iets
     voor ingelogde accounts.

     Wat het doet:
     Heeft het ingelogde account een geldige verjaardagscode (Odoo
     maakt die op de verjaardag aan, zie SETUP hieronder), dan krijgt
     het de eerste keer confetti en een popup 'Happy Birthday' met de
     persoonlijke code, een kopieerknop en een knop naar de winkelmand.
     Daarna blijft er tot de code verloopt een klein cadeau-knopje
     linksonder staan dat de popup terug opent.

     De code en de vervaldatum komen uit twee EIGENSCHAPPEN (properties)
     op het contact (res.partner, veld 'properties'): 'Verjaardagscode'
     (tekst, intern 1e1256d45f5933c8) en 'Verjaardagscode tot' (datum,
     intern 20079094e521a875), aangemaakt 06/10/2026. Gelezen via de
     gewone Odoo-route die elk ingelogd account voor zijn eigen gegevens
     mag gebruiken. Gezocht op interne naam, met het label als vangnet
     (P_CODE / P_UNTIL hieronder). Het geboortedatumveld zelf bestaat al
     (x_studio_geboortedatum, 118 contacten op 06/10/2026), maar dat
     heeft dit bestand niet nodig: Odoo beslist wie een code krijgt.
     Zolang de twee eigenschappen leeg zijn, doet dit bestand niets
     (stil, enkel een regel in de console).

     Kaartje 'Je verjaardag' op Mijn account (/my/home): klanten zonder
     verjaardag vullen hem zelf in (wijzigen kan niet, dat loopt via
     mail). Opslaan maakt een lead 'Verjaardag: <e-mail>' via het
     websiteformulier; de dagelijkse geplande actie zet de datum op het
     contact en archiveert de lead. Die actie haalt ook verjaardagen
     uit registratieleads en haalt een code van de site zodra hij
     gebruikt of verlopen is (dan verdwijnt het cadeau-knopje).

     Gebruikt = weg, meteen (sinds 07/10/2026): de geplande actie draait
     maar 1 keer per dag, dus de pagina kijkt zelf ook in de eigen
     bestellingen van het account. Staat er sinds de start van de code
     een bestelling die geen winkelmand meer is (bevestigd, verzonden
     of geannuleerd) met de cadeauregel erin (beloningsregel, of het
     cadeauproduct REWARD_SKU aan 0 euro), dan geen popup en geen
     cadeau-knopje meer. Een winkelmand met de code telt nog niet.

     BETA (nu UIT, live sinds 06/10/2026): met BETA = true werkt het alleen in een browser
     waar je ooit een pagina opende met #stxbday achter de URL.
     #stxbday-uit zet het weer uit. #stxbday-demo toont de popup
     eenmalig met voorbeelddata (code DEMO-1234), ook zonder velden,
     zodat je de look kan beoordelen.
     ============================================================ -->

<script>
(function () {
  'use strict';
  var BETA = false; // true = alleen na #stxbday (testmodus), false = live voor iedereen (live sinds 06/10/2026)
  var BETA_KEY = 'stx_bday_beta';
  /* Eigenschappen op Contact: interne naam + label (label = vangnet als de eigenschap ooit opnieuw gemaakt wordt) */
  var P_CODE = { name: '1e1256d45f5933c8', label: 'verjaardagscode' };      // tekst: de code
  var P_UNTIL = { name: '20079094e521a875', label: 'verjaardagscode tot' }; // datum: laatste geldige dag
  var DAYS = 30;                                // looptijd van de code
  var F_BDAY = 'x_studio_geboortedatum';        // Studio-veld op Contact: geboortedatum
  var REWARD_SKU = 'R24850';                    // cadeauproduct in sjabloonprogramma 310 (Silk Light Amethyst 3 st.); pas aan als het cadeau wijzigt

  if (window.__stxBirthday) { return; }
  window.__stxBirthday = true;
  if (document.body.classList.contains('editor_enable') || document.querySelector('.odoo-editor-editable') || document.querySelector('#wrap.o_editable')) { return; }

  var h = (window.location.hash || '').toLowerCase();
  var demo = h === '#stxbday-demo';
  function betaOn() {
    var want = null;
    if (h === '#stxbday' || h === '#stxbday=1' || demo) { want = true; }
    else if (h === '#stxbday=0' || h === '#stxbday-uit' || h === '#stxbday-off') { want = false; }
    try {
      if (want === true) { localStorage.setItem(BETA_KEY, '1'); }
      else if (want === false) { localStorage.removeItem(BETA_KEY); }
      return localStorage.getItem(BETA_KEY) === '1';
    } catch (e) { return want === true; }
  }
  if (BETA && !betaOn()) { return; }

  var loggedIn = !!document.querySelector('a[href*="/web/session/logout"], a[href*="/my/home"], a[href*="/my/account"]');
  if (!loggedIn && !demo) { return; }

  var rawPath = window.location.pathname || '/';
  var m = /^\/(en_gb|fr|de)(\/|$)/i.exec(rawPath);
  var lang = m ? (m[1].toLowerCase() === 'en_gb' ? 'en' : m[1].toLowerCase()) : 'nl';
  var prefix = m ? '/' + rawPath.split('/')[1] : '';

  var T = {
    nl: { hi: 'Gelukkige verjaardag', p: 'Van iedereen bij Sempertex Europe: een zakje ballonnen cadeau. Vul deze code in bij je winkelmand en het zakje komt er gratis bij.',
      copy: 'Kopieer', copied: 'Gekopieerd', valid: 'Eenmalig te gebruiken, geldig tot en met {d}.', go: 'Naar mijn winkelmand', gift: 'Je verjaardagscadeau', close: 'Sluiten',
      c_t: 'Je verjaardag', c_p: 'Vul je verjaardag in en krijg elk jaar een cadeautje van ons.', c_save: 'Opslaan',
      c_saved: 'Bedankt! We slaan je verjaardag op, dat kan tot een dag duren.', c_have: 'Je verjaardag: {d}',
      c_fix: 'Klopt dit niet? Laat het ons weten via info@sempertexeurope.com.', c_err: 'Opslaan lukte niet. Probeer het later opnieuw.', c_bad: 'Vul een geldige datum in.' },
    en: { hi: 'Happy Birthday', p: 'From all of us at Sempertex Europe: a bag of balloons on us. Enter this code in your cart and the bag is added for free.',
      copy: 'Copy', copied: 'Copied', valid: 'Use it once, valid until {d}.', go: 'Go to my cart', gift: 'Your birthday gift', close: 'Close',
      c_t: 'Your birthday', c_p: 'Add your birthday and get a little gift from us every year.', c_save: 'Save',
      c_saved: 'Thank you! We are saving your birthday, this can take up to a day.', c_have: 'Your birthday: {d}',
      c_fix: 'Not right? Let us know at info@sempertexeurope.com.', c_err: 'Saving did not work. Please try again later.', c_bad: 'Please enter a valid date.' },
    fr: { hi: 'Joyeux anniversaire', p: 'De la part de toute l\'équipe Sempertex Europe : un sachet de ballons offert. Entrez ce code dans votre panier et le sachet est ajouté gratuitement.',
      copy: 'Copier', copied: 'Copié', valid: 'Utilisable une fois, valable jusqu\'au {d}.', go: 'Vers mon panier', gift: 'Votre cadeau d\'anniversaire', close: 'Fermer',
      c_t: 'Votre anniversaire', c_p: 'Indiquez votre date d\'anniversaire et recevez chaque année un petit cadeau de notre part.', c_save: 'Enregistrer',
      c_saved: 'Merci ! Nous enregistrons votre anniversaire, cela peut prendre jusqu\'à un jour.', c_have: 'Votre anniversaire : {d}',
      c_fix: 'Ce n\'est pas correct ? Écrivez-nous à info@sempertexeurope.com.', c_err: 'L\'enregistrement a échoué. Réessayez plus tard.', c_bad: 'Veuillez entrer une date valide.' },
    de: { hi: 'Alles Gute zum Geburtstag', p: 'Von uns allen bei Sempertex Europe: ein Beutel Ballons als Geschenk. Gib diesen Code im Warenkorb ein und der Beutel kommt gratis dazu.',
      copy: 'Kopieren', copied: 'Kopiert', valid: 'Einmal einlösbar, gültig bis {d}.', go: 'Zum Warenkorb', gift: 'Dein Geburtstagsgeschenk', close: 'Schließen',
      c_t: 'Dein Geburtstag', c_p: 'Trag deinen Geburtstag ein und erhalte jedes Jahr ein kleines Geschenk von uns.', c_save: 'Speichern',
      c_saved: 'Danke! Wir speichern deinen Geburtstag, das kann bis zu einem Tag dauern.', c_have: 'Dein Geburtstag: {d}',
      c_fix: 'Stimmt das nicht? Schreib uns an info@sempertexeurope.com.', c_err: 'Speichern hat nicht geklappt. Bitte versuch es später noch einmal.', c_bad: 'Bitte gib ein gültiges Datum ein.' }
  };
  var t = T[lang] || T.en;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function track(ev, params) {
    try {
      params = params || {}; params.page_lang = lang;
      if (typeof window.gtag === 'function') { window.gtag('event', ev, params); }
      else if (window.dataLayer && window.dataLayer.push) { window.dataLayer.push(Object.assign({ event: ev }, params)); }
      if (window.posthog && window.posthog.capture) { window.posthog.capture(ev, params); }
    } catch (e) {}
  }
  function today() {
    try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Brussels', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
    catch (e) { return new Date().toISOString().slice(0, 10); }
  }
  function addDays(iso, n) { var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function niceDate(iso) {
    try { return new Intl.DateTimeFormat(lang === 'en' ? 'en-GB' : lang + '-BE', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(iso + 'T12:00:00Z')); }
    catch (e) { return iso; }
  }

  function prop(list, want) {
    if (!list || !list.length) { return ''; }
    var hit = null;
    for (var i = 0; i < list.length; i++) { if (list[i].name === want.name) { hit = list[i]; } }
    if (!hit) {
      for (var j = 0; j < list.length; j++) { if (String(list[j].string || '').trim().toLowerCase() === want.label) { hit = list[j]; } }
    }
    var v = hit ? hit.value : '';
    return v ? String(v).trim() : '';
  }

  function rpc(url, params) {
    return fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method: 'call', params: params || {}, id: Date.now() }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.error) { throw new Error((j.error.data && j.error.data.message) || j.error.message); } return j.result; });
  }

  /* ---- CONFETTI (eigen, geen externe bibliotheek) ---- */
  function confetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { return; }
    var c = document.createElement('canvas');
    c.id = 'stx-bd-confetti';
    document.body.appendChild(c);
    var ctx = c.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, hgt = window.innerHeight;
    c.width = w * dpr; c.height = hgt * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var COLS = ['#6b3fb9', '#ffdb5a', '#f1d9ff', '#ff7eb6', '#7fd1c7', '#ffffff', '#1b073d'];
    var parts = [];
    function burst(x, dir) {
      for (var i = 0; i < 90; i++) {
        var ang = (dir * (35 + Math.random() * 40)) * Math.PI / 180 - Math.PI / 2;
        var sp = 9 + Math.random() * 11;
        parts.push({ x: x, y: hgt + 10, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
          w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, col: COLS[i % COLS.length], life: 0 });
      }
    }
    burst(w * 0.08, 1); burst(w * 0.92, -1);
    setTimeout(function () { burst(w * 0.25, 1); burst(w * 0.75, -1); }, 350);
    var start = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, w, hgt);
      for (var i = 0; i < parts.length; i++) {
        var q = parts[i];
        q.vy += 0.28; q.vx *= 0.99; q.vy *= 0.99; q.x += q.vx; q.y += q.vy; q.rot += q.vr;
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
        ctx.fillStyle = q.col; ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h * Math.abs(Math.cos(q.rot * 2)));
        ctx.restore();
      }
      if (now - start < 4200) { requestAnimationFrame(frame); }
      else if (c.parentNode) { c.parentNode.removeChild(c); }
    })(start);
  }

  /* ---- POPUP ---- */
  function popup(d, isDemo) {
    if (document.querySelector('.stx-bd-back')) { return; }
    var back = document.createElement('div');
    back.className = 'stx-bd-back';
    back.setAttribute('role', 'dialog');
    back.setAttribute('aria-modal', 'true');
    back.innerHTML = '<div class="stx-bd-pop">' + (isDemo ? '<span class="bd-demo">DEMO</span>' : '') +
      '<button type="button" class="bd-x" aria-label="' + esc(t.close) + '">&times;</button>' +
      '<div class="bd-emoji" aria-hidden="true">&#127880;&#127874;&#127880;</div>' +
      '<h2>' + esc(t.hi) + (d.name ? ', <b>' + esc(d.name) + '</b>' : '') + '!</h2>' +
      '<p>' + esc(t.p) + '</p>' +
      '<div class="bd-code"><span>' + esc(d.code) + '</span><button type="button">' + esc(t.copy) + '</button></div>' +
      '<p class="bd-small">' + esc(t.valid.replace('{d}', niceDate(d.until))) + '</p>' +
      '<a class="bd-go" href="' + prefix + '/shop/cart">' + esc(t.go) + ' &rarr;</a></div>';
    document.body.appendChild(back);
    requestAnimationFrame(function () { back.classList.add('on'); });
    function close() { back.classList.remove('on'); setTimeout(function () { if (back.parentNode) { back.parentNode.removeChild(back); } }, 260); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') { close(); } }
    document.addEventListener('keydown', onKey);
    back.addEventListener('click', function (e) { if (e.target === back) { close(); } });
    back.querySelector('.bd-x').addEventListener('click', close);
    var cb = back.querySelector('.bd-code button');
    cb.addEventListener('click', function () {
      var done = function () { cb.textContent = t.copied; track('birthday_code_copy', {}); };
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(d.code).then(done, done); }
      else { done(); }
    });
    back.querySelector('.bd-go').addEventListener('click', function () { track('birthday_go_cart', {}); });
  }

  function giftButton(d) {
    if (document.querySelector('.stx-bd-gift')) { return; }
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'stx-bd-gift';
    b.innerHTML = '&#127873; ' + esc(t.gift);
    b.addEventListener('click', function () { popup(d, false); track('birthday_gift_reopen', {}); });
    document.body.appendChild(b);
  }

  function show(d, isDemo) {
    var seenKey = 'stx_bday_seen_' + d.code;
    var seen = false;
    try { seen = localStorage.getItem(seenKey) === '1'; } catch (e) {}
    if (!seen || isDemo) {
      confetti();
      setTimeout(function () { popup(d, isDemo); }, 250);
      if (!isDemo) { try { localStorage.setItem(seenKey, '1'); } catch (e) {} }
      track('birthday_popup_view', { demo: !!isDemo });
    }
    if (!isDemo) { giftButton(d); }
  }

  function valid(d) {
    var now = today();
    return !!(d && d.code && d.until && now <= d.until && now >= addDays(d.until, -DAYS));
  }

  if (demo) {
    var nameEl = document.querySelector('#top .o_header_user_name, #top .dropdown-toggle b, #top .o_user_menu span');
    show({ code: 'DEMO-1234', until: addDays(today(), DAYS), name: nameEl ? nameEl.textContent.trim().split(/\s+/)[0] : '' }, true);
    return;
  }

  /* ---- KAARTJE 'JE VERJAARDAG' OP MIJN ACCOUNT (/my/home) ----
     Klanten kunnen hun verjaardag zelf invullen als die nog leeg is. Wijzigen kan niet
     (anders zet iemand hem elke maand op vandaag); een fout melden ze via mail.
     Opslaan stuurt een lead 'Verjaardag: <e-mail>' via het gewone websiteformulier;
     de dagelijkse geplande actie zet de datum op het contact en archiveert de lead. */
  var onMyHome = /^(\/(en_gb|fr|de))?\/my(\/home)?\/?$/i.test(rawPath);
  function niceBday(iso) {
    try { return new Intl.DateTimeFormat(lang === 'en' ? 'en-GB' : lang + '-BE', { day: 'numeric', month: 'long', timeZone: 'UTC' }).format(new Date(iso + 'T12:00:00Z')); }
    catch (e) { return iso; }
  }
  function card(r, pid) {
    var anchor = document.querySelector('.o_portal_my_home');
    if (!anchor || document.querySelector('.stx-bd-card')) { return; }
    var pendKey = 'stx_bday_pending_' + pid;
    var pending = null;
    try { pending = localStorage.getItem(pendKey); } catch (e) {}
    var bday = r.x_studio_geboortedatum || '';
    if (bday && pending) { try { localStorage.removeItem(pendKey); } catch (e) {} pending = null; }
    var el = document.createElement('div');
    el.className = 'stx-bd-card';
    var head = '<div class="bdc-ico" aria-hidden="true">&#127874;</div><div class="bdc-txt"><h3>' + esc(t.c_t) + '</h3>';
    if (bday) {
      el.innerHTML = head + '<p>' + esc(t.c_have.replace('{d}', niceBday(bday))) + '</p><p>' + esc(t.c_fix) + '</p></div>';
    } else if (pending) {
      el.innerHTML = head + '<p>' + esc(t.c_saved) + '</p></div>';
    } else {
      el.innerHTML = head + '<p>' + esc(t.c_p) + '</p></div>' +
        '<form novalidate><input type="date" required min="1920-01-01" max="' + today() + '" aria-label="' + esc(t.c_t) + '"><button type="submit">' + esc(t.c_save) + '</button><div class="bdc-msg" aria-live="polite"></div></form>';
      var form = el.querySelector('form');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var inp = form.querySelector('input'), btn = form.querySelector('button'), msg = form.querySelector('.bdc-msg');
        var v = inp.value;
        msg.className = 'bdc-msg';
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || v > today() || v < '1920-01-01') { msg.className = 'bdc-msg err'; msg.textContent = t.c_bad; return; }
        btn.disabled = true;
        var fd = new FormData();
        var csrf = (window.odoo && window.odoo.csrf_token) || ((document.querySelector('input[name=csrf_token]') || {}).value) || '';
        fd.append('csrf_token', csrf);
        fd.append('name', 'Verjaardag: ' + (r.email || ''));
        fd.append('email_from', r.email || '');
        fd.append('contact_name', r.name || '');
        fd.append('description', 'Geboortedatum: ' + v);
        fetch('/website/form/crm.lead', { method: 'POST', credentials: 'same-origin', body: fd })
          .then(function (res) { return res.json(); })
          .then(function (j) {
            if (!j || j.error || !j.id) { throw new Error((j && j.error) || 'no id'); }
            try { localStorage.setItem(pendKey, v); } catch (x) {}
            form.outerHTML = '';
            el.querySelector('.bdc-txt').innerHTML = '<h3>' + esc(t.c_t) + '</h3><p>' + esc(t.c_saved) + '</p>';
            track('birthday_card_saved', {});
          })
          .catch(function (err) {
            btn.disabled = false;
            msg.className = 'bdc-msg err';
            msg.textContent = t.c_err;
            if (window.console && console.warn) { console.warn('[STX verjaardag] opslaan mislukt:', err && err.message); }
          });
      });
    }
    anchor.parentNode.insertBefore(el, anchor);
  }

  /* Is de code al gebruikt? Kijkt in de eigen bestellingen (geen winkelmand meer) sinds de start van de code. */
  function usedCheck(d, partnerId) {
    var start = addDays(d.until, -DAYS);
    return rpc('/web/dataset/call_kw/sale.order.line/search_read', { model: 'sale.order.line', method: 'search_read',
      args: [[['order_id.partner_id', '=', partnerId], ['order_id.state', '!=', 'draft'], ['order_id.date_order', '>=', start + ' 00:00:00'], ['price_total', '=', 0]]],
      kwargs: { fields: ['name', 'is_reward_line'], limit: 50 } })
      .then(function (lines) {
        return (lines || []).some(function (l) { return l.is_reward_line || String(l.name || '').indexOf('[' + REWARD_SKU + ']') !== -1; });
      })
      .catch(function (e) {
        if (window.console && console.info) { console.info('[STX verjaardag] bestellingen niet leesbaar:', e && e.message); }
        return false;
      });
  }

  /* ---- ECHTE DATA: 1 keer per sessie ophalen, daarna uit sessionStorage (op Mijn account en na een bestelling altijd vers) ---- */
  var CACHE = 'stx_bday_v3';
  var afterOrder = /\/shop\/(confirmation|payment\/validate)/i.test(rawPath);
  if (!onMyHome && !afterOrder) {
    try {
      var cached = JSON.parse(sessionStorage.getItem(CACHE) || 'null');
      if (cached && cached.day === today()) { if (valid(cached.d) && !cached.d.used) { show(cached.d, false); } return; }
    } catch (e) {}
  }

  var pid = null;
  rpc('/web/session/get_session_info').then(function (info) {
    if (!info || !info.uid || !info.partner_id) { return null; }
    pid = info.partner_id;
    return rpc('/web/dataset/call_kw/res.partner/read', { model: 'res.partner', method: 'read',
      args: [[info.partner_id], ['properties', 'name', 'is_company', 'email', F_BDAY]], kwargs: {} });
  }).then(function (rows) {
    if (!rows || !rows[0]) { return; }
    var r = rows[0];
    var d = { code: prop(r.properties, P_CODE), until: prop(r.properties, P_UNTIL), name: (!r.is_company && r.name) ? String(r.name).trim().split(/\s+/)[0] : '' };
    if (onMyHome) { card(r, pid); }
    if (!valid(d)) {
      try { sessionStorage.setItem(CACHE, JSON.stringify({ day: today(), d: d })); } catch (e) {}
      return;
    }
    return usedCheck(d, pid).then(function (used) {
      d.used = used;
      try { sessionStorage.setItem(CACHE, JSON.stringify({ day: today(), d: d })); } catch (e) {}
      if (used) {
        var g = document.querySelector('.stx-bd-gift');
        if (g && g.parentNode) { g.parentNode.removeChild(g); }
        return;
      }
      show(d, false);
    });
  }).catch(function (e) {
    try { sessionStorage.setItem(CACHE, JSON.stringify({ day: today(), d: null })); } catch (x) {}
    if (window.console && console.info) { console.info('[STX verjaardag] geen verjaardagsdata:', e && e.message); }
  });
})();
</script>
