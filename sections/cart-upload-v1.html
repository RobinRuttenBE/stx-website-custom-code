<!-- ============================================================
     STX EU / CART UPLOAD v1 (sectiebestand voor de section loader)
     Op de winkelmandpagina (/shop/cart, alle talen) komt bovenaan een
     kaart "Upload your order": de klant kiest een CSV- of Excelbestand
     (of plakt regels) met per regel een productcode en een aantal,
     ziet een preview met het gevonden product per regel, en klikt
     "Add to cart". De regels gaan een voor een in het Odoo-mandje
     van het ingelogde account (dus ook zichtbaar op een ander toestel).

     Bestandsformaat: kolom 1 = productcode (SAP-code, interne
     referentie van de shop, bv. R12005, N260080, LOL6015, 20012458),
     kolom 2 = aantal (in verkoopeenheden van de shop, dus zakken /
     verpakkingen). Koprij mag ("Supplier Code,Quantity") maar hoeft
     niet. Komma, puntkomma of tab als scheiding. Excel: eerste blad.
     Dubbele codes worden opgeteld.

     Productherkenning: per code een call naar de shop-zoekroute
     (/en_GB/website/snippet/autocomplete, dezelfde als de zoekbalk).
     1. Exact: product-URL = /shop/<code>-<naam>-<id>  (groen)
     2. Alleen prefix <code>- maar meerdere hits (bv. R12826 en
        R12826-punten): klant kiest uit een lijstje (oranje)
     3. Geen prefix-hit maar precies 1 zoekresultaat (bv. barcode
        20021027 -> N260013): geaccepteerd, gemarkeerd "check" (oranje)
     4. Niets gevonden: rood, regel wordt overgeslagen.

     Winkelmand: /website_sale/get_combination_info (variant-id) en
     daarna /shop/cart/add per product (JSON-RPC, same origin, sessie-
     cookie), zelfde routes als de Cost Calculator in inspiration-v18.
     Aantal = verkoopeenheden (packs). /shop/cart/add telt op bij wat er
     al ligt, dus wordt de regel teruggelezen en met /shop/cart/update op
     het exacte aantal uit het bestand gezet; het bestand is de waarheid.
     Codes die op hetzelfde product uitkomen worden eerst samengeteld. Na afloop herlaadt de pagina en
     toont de kaart eenmalig het resultaat (sessionStorage).

     Alleen voor ingelogde accounts (Odoo weigert cart-calls van
     bezoekers). Niet in de Odoo editor.

     BETA: met BETA = true toont de kaart alleen in een browser waar je
     de winkelmandpagina ooit opende met #stxupload achter de URL
     (onthouden in localStorage). #stxupload-uit zet het weer uit.
     ?stxupload=1 / ?stxupload=0 werkt ook. Live zetten = BETA = false.

     Excel wordt gelezen met SheetJS (cdnjs), pas geladen als er een
     .xlsx/.xls gekozen wordt. CSV heeft geen bibliotheek nodig.
     ============================================================ -->

  function betaOn() {
    try {
      var h = (location.hash || '').toLowerCase();
      var q = /[?&]stxupload=(\d)/.exec(location.search || '');
      var want = null;
      if (h === '#stxupload') { want = true; }
      else if (h === '#stxupload-uit' || h === '#stxupload-off') { want = false; }
      else if (q) { want = q[1] === '1'; }
      if (want === true) { localStorage.setItem(BETA_KEY, '1'); }
      else if (want === false) { localStorage.removeItem(BETA_KEY); }
      return localStorage.getItem(BETA_KEY) === '1';
    } catch (e) { return false; }
  }
  function loggedIn() {
    try {
      var si = window.odoo && window.odoo.__session_info__;
      if (si && typeof si.is_public === 'boolean') { return !si.is_public; }
      if (si && typeof si.is_website_user === 'boolean') { return !si.is_website_user; }

      open: 'Datei hochladen', drop: 'Datei wählen oder hier ablegen', drop_sub: '.csv oder .xlsx, Spalte 1 = Produktcode, Spalte 2 = Menge (Beutel). Eine Kopfzeile ist erlaubt.',
      template: 'Beispieldatei herunterladen', paste: 'Oder Zeilen einfügen', paste_go: 'Eingefügte Zeilen prüfen', reset: 'Neu beginnen',
      th_code: 'Code', th_product: 'Produkt im Shop', th_qty: 'Beutel', th_status: 'Status',
      reading: 'Datei wird gelesen...', xlsx_load: 'Excel-Leser wird geladen...', xlsx_fail: 'Der Excel-Leser konnte nicht geladen werden. Speichern Sie das Blatt als CSV und versuchen Sie es erneut.', empty: 'Keine Zeilen mit Code und Menge gefunden. Spalte 1 = Code, Spalte 2 = Menge.',
      matching: 'Code {i} von {n} im Shop suchen...', found: '{n} Produkte gefunden', check: '{n} zu prüfen', missing: '{n} nicht gefunden', dup: '{n} doppelte Codes zusammengefasst',
      st_ok: 'gefunden', st_chk: 'prüfen', st_multi: 'wählen', st_no: 'nicht gefunden', st_done: 'hinzugefügt', st_fail: 'fehlgeschlagen', st_skip: 'übersprungen', st_qty: 'im Warenkorb: {n}',
      add: '{n} Zeilen in den Warenkorb', adding: 'Zeile {i} von {n} wird hinzugefügt...', none: 'Nichts hinzuzufügen: keine Zeile passt zu einem Shop-Produkt.',
      done: '{l} Zeilen ({p} Beutel) in Ihren Warenkorb gelegt.', fail: 'Nicht hinzugefügt: {names}.', skipped: '{n} Zeilen übersprungen (nicht gefunden).', qty_warn: '{n} Produkte liegen mit einer anderen Menge im Warenkorb: bitte prüfen.', reload: 'Warenkorb aktualisieren',
      note: 'Mengen sind Beutel (Verkaufseinheiten des Shops), keine einzelnen Ballons. Ein Produkt, das bereits im Warenkorb liegt, erhält die Menge aus Ihrer Datei.'
        + '  Zeilen mit „prüfen“ wurden über die Suche gefunden: prüfen Sie den Produktnamen vor dem Hinzufügen. Nicht gefundene Zeilen werden übersprungen.'
    }
  };
  var S = T[lang] || T.en;
  function t(k, v) { var s = S[k] || T.en[k] || k; Object.keys(v || {}).forEach(function (x) { s = s.split('{' + x + '}').join(v[x]); }); return s; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function track(ev, params) { try { if (window.posthog && window.posthog.capture) { window.posthog.capture(ev, params || {}); } } catch (e) {} }

  Array.prototype.forEach.call(root.querySelectorAll('[data-k]'), function (el) { el.textContent = t(el.getAttribute('data-k')); });

  /* ---- plaats: bovenaan de winkelmandpagina, voor de rij met regels + samenvatting ---- */
  var cart = document.querySelector('.oe_website_sale .oe_cart') || document.querySelector('#shop_cart') || document.querySelector('.oe_website_sale');
  if (!cart) { wallDone(); return; }
  if (cart.classList.contains('oe_cart') || cart.id === 'shop_cart') { cart.parentNode.insertBefore(root, cart); }
  else { cart.insertBefore(root, cart.firstChild); }
  root.hidden = false;
  wallDone();

  /* ---- resultaat van de vorige upload (na herladen) ---- */
  try {
    var last = sessionStorage.getItem(RESULT_KEY);
    if (last) {
      sessionStorage.removeItem(RESULT_KEY);
      var lr = JSON.parse(last);
      var box = $('su-lastresult');
      var msg = esc(t('done', { l: lr.done, p: lr.packs }));
      if (lr.skipped) { msg += ' ' + esc(t('skipped', { n: lr.skipped })); }
      if (lr.failed && lr.failed.length) { msg += ' ' + esc(t('fail', { names: lr.failed.join(', ') })); box.classList.add('warn'); }
      box.innerHTML = msg; box.hidden = false; root.classList.add('su-open');
    }
  } catch (e) {}

  /* ---- UI ---- */
  var state = { lines: [], busy: false };
  $('su-toggle').addEventListener('click', function () { root.classList.toggle('su-open'); });
  $('su-pastebtn').addEventListener('click', function () { root.classList.toggle('su-pasting'); if (root.classList.contains('su-pasting')) { $('su-paste').focus(); } });
  $('su-paste-go').addEventListener('click', function () { handleText($('su-paste').value, 'paste'); });
  $('su-template').addEventListener('click', function (e) {
    e.preventDefault();
    var csv = 'Supplier Code,Quantity\r\nR12005,10\r\nN260080,20\r\nLOL6015,5\r\n';
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sempertex-order-example.csv';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    track('cart_upload_template', {});
  });
  var drop = $('su-drop');
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('su-over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('su-over'); }); });
  drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) { handleFile(f); } });
  $('su-file').addEventListener('change', function () { if (this.files && this.files[0]) { handleFile(this.files[0]); this.value = ''; } });
  $('su-reset').addEventListener('click', function () { if (state.busy) { return; } state.lines = []; $('su-preview').hidden = true; $('su-rows').innerHTML = ''; $('su-sum').innerHTML = ''; setStatus(''); });
  $('su-add').addEventListener('click', addAll);

  function setStatus(msg) { $('su-status').textContent = msg || ''; }
  function setBar(frac) { $('su-barfill').style.width = Math.round(Math.max(0, Math.min(1, frac)) * 100) + '%'; }
  function busy(on) { state.busy = on; root.classList.toggle('su-busy', on); $('su-add').disabled = on; $('su-reset').disabled = on; if (!on) { setBar(0); } }

  /* ---- bestand lezen ---- */
  function handleFile(file) {
    if (state.busy) { return; }
    var name = (file.name || '').toLowerCase();
    setStatus(t('reading'));
    if (/\.xlsx?$/.test(name)) {
      setStatus(t('xlsx_load'));
      loadXlsx(function (ok) {
        if (!ok) { setStatus(t('xlsx_fail')); return; }
        var fr = new FileReader();
        fr.onload = function () {
          try {
            var wb = window.XLSX.read(new Uint8Array(fr.result), { type: 'array' });
            var ws = wb.Sheets[wb.SheetNames[0]];
            var rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
            handleRows(rows, 'xlsx');
          } catch (e) { setStatus(t('xlsx_fail')); }
        };
        fr.readAsArrayBuffer(file);
      });
      return;
    }
    var fr = new FileReader();
    fr.onload = function () { handleText(String(fr.result || ''), 'csv'); };
    fr.readAsText(file);
  }
  function loadXlsx(cb) {
    if (window.XLSX) { cb(true); return; }
    var s = document.createElement('script'); s.src = XLSX_URL;
    s.onload = function () { cb(!!window.XLSX); }; s.onerror = function () { cb(false); };
    document.head.appendChild(s);
  }
  function handleText(text, source) {
    text = String(text || '').replace(/^﻿/, '');
    var lines = text.split(/\r\n|\r|\n/).filter(function (l) { return l.trim() !== ''; });
    var sample = lines.slice(0, 20).join('\n');
    var delim = ','; var best = -1;
    [',', ';', '\t', '|'].forEach(function (d) { var n = sample.split(d).length; if (n > best) { best = n; delim = d; } });
    var rows = lines.map(function (l) { return splitLine(l, delim); });
    handleRows(rows, source);
  }
  function splitLine(line, d) {
    var out = [], cur = '', q = false;
    for (var i = 0; i < line.length; i++) {
      var c = line.charAt(i);
      if (q) { if (c === '"') { if (line.charAt(i + 1) === '"') { cur += '"'; i++; } else { q = false; } } else { cur += c; } }
      else if (c === '"') { q = true; }
      else if (c === d) { out.push(cur); cur = ''; }
      else { cur += c; }
    }
    out.push(cur);
    return out;
  }
  /* rijen -> regels {code, qty}; kolom 1 = code, kolom 2 = aantal; koprij en lege rijen overslaan; dubbele codes optellen */
  function handleRows(rows, source) {
    var map = {}, order = [], dup = 0;
    rows.forEach(function (r) {
      if (!r || !r.length) { return; }
      var cells = r.map(function (c) { return String(c == null ? '' : c).trim(); });
      var ci = -1;
      for (var i = 0; i < cells.length; i++) { if (cells[i] !== '') { ci = i; break; } }
      if (ci < 0) { return; }
      var code = cells[ci].toUpperCase().replace(/\s+/g, '');
      var qs = ''; for (var j = ci + 1; j < cells.length; j++) { if (cells[j] !== '') { qs = cells[j]; break; } }
      var qty = parseFloat(qs.replace(/\s/g, '').replace(',', '.'));
      if (!code || !isFinite(qty) || qty <= 0) { return; }
      if (!/^[A-Z0-9][A-Z0-9._\/-]*$/.test(code)) { return; }
      qty = Math.ceil(qty);
      if (map[code]) { map[code].qty += qty; dup++; } else { map[code] = { code: code, qty: qty }; order.push(code); }
    });
    var lines = order.map(function (c) { return map[c]; });
    if (!lines.length) { setStatus(t('empty')); return; }
    root.classList.remove('su-pasting');
    track('cart_upload_parsed', { lines: lines.length, source: source });
    matchAll(lines, dup);
  }

  /* ---- productherkenning via de shop-zoekroute ---- */
  function shopSearch(term, limit, cb) {
    fetch(SEARCH_URL, {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method: 'call', id: Date.now(), params: {
        search_type: 'products', term: term, order: 'name asc', limit: limit, max_nb_chars: 120,
        options: { displayDescription: false, displayDetail: true, displayExtraLink: false, displayImage: false, allowFuzzy: false }
      } })
    }).then(function (r) { return r.json(); }).then(function (d) { cb(((d && d.result) || {}).results || []); }).catch(function () { cb(null); });
  }
  function strip(v) { return String(v == null ? '' : v).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim(); }
  function slug(s) {
    s = String(s || '');
    try { s = s.normalize('NFKD').replace(/[̀-ͯ]/g, ''); } catch (e) {}
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  function hitsFor(code, results) {
    var cs = slug(code);
    var out = [];
    (results || []).forEach(function (r) {
      var url = r.website_url || '';
      var m = /^\/shop\/([^/?#]*)-(\d+)(?:[?#].*)?$/.exec(url);
      if (!m) { return; }
      var name = strip(r.name);
      var body = m[1];
      var h = { tid: parseInt(m[2], 10), name: name, url: url, exact: false, prefix: false };
      if (body === cs + '-' + slug(name)) { h.exact = true; h.prefix = true; }
      else if (body.indexOf(cs + '-') === 0) { h.prefix = true; }
      out.push(h);
    });
    return out;
  }
  function matchOne(line, cb) {
    shopSearch(line.code, 10, function (results) {
      line.options = [];
      if (results === null) { line.status = 'no'; cb(); return; }
      var hits = hitsFor(line.code, results);
      var exact = hits.filter(function (h) { return h.exact; });
      var pre = hits.filter(function (h) { return h.prefix; });
      if (exact.length === 1) { line.pick(exact[0]); line.status = 'ok'; }
      else if (pre.length === 1) { line.pick(pre[0]); line.status = 'ok'; }
      else if (pre.length > 1) { line.options = pre; line.pick(pre[0]); line.status = 'multi'; }
      else if (hits.length === 1) { line.pick(hits[0]); line.status = 'chk'; }
      else { line.status = 'no'; }
      cb();
    });
  }
  function matchAll(lines, dup) {
    lines.forEach(function (l) { l.status = 'no'; l.tid = null; l.name = ''; l.pick = function (h) { this.tid = h.tid; this.name = h.name; this.url = h.url; }; });
    state.lines = lines;
    busy(true);
    var next = 0, done = 0, n = lines.length;
    function step() {
      if (next >= n) { return; }
      var l = lines[next++];
      matchOne(l, function () {
        done++; setStatus(t('matching', { i: Math.min(done + 1, n), n: n })); setBar(done / n);
        if (done >= n) { busy(false); setStatus(''); render(dup); } else { step(); }
      });
    }
    for (var k = 0; k < Math.min(PARALLEL, n); k++) { step(); }
  }

  /* ---- preview ---- */
  function counts() {
    var c = { ok: 0, chk: 0, no: 0 };
    state.lines.forEach(function (l) { if (l.status === 'ok') { c.ok++; } else if (l.status === 'chk' || l.status === 'multi') { c.chk++; } else { c.no++; } });
    return c;
  }
  function render(dup) {
    var c = counts();
    var sum = '<span class="su-pill ok">' + esc(t('found', { n: c.ok })) + '</span>';
    if (c.chk) { sum += '<span class="su-pill chk">' + esc(t('check', { n: c.chk })) + '</span>'; }
    if (c.no) { sum += '<span class="su-pill no">' + esc(t('missing', { n: c.no })) + '</span>'; }
    if (dup) { sum += '<span class="su-pill">' + esc(t('dup', { n: dup })) + '</span>'; }
    $('su-sum').innerHTML = sum;
    var tb = $('su-rows'); tb.innerHTML = '';
    state.lines.forEach(function (l, i) {
      var tr = document.createElement('tr'); tr.className = l.status; tr.setAttribute('data-i', i);
      var prod;
      if (l.status === 'multi') {
        prod = '<select class="su-pick" data-i="' + i + '">' + l.options.map(function (o, k) { return '<option value="' + k + '">' + esc(o.name) + '</option>'; }).join('') + '</select>';
      } else if (l.tid) {
        prod = '<a href="' + esc(shopPrefix + l.url) + '" target="_blank" rel="noopener">' + esc(l.name) + '</a>';
      } else { prod = '<span>&ndash;</span>'; }
      var st = { ok: 'st_ok', chk: 'st_chk', multi: 'st_multi', no: 'st_no' }[l.status] || 'st_no';
      tr.innerHTML = '<td class="su-code">' + esc(l.code) + '</td><td>' + prod + '</td><td class="su-qty" data-unit="' + esc(t('th_qty')) + '">' + l.qty + '</td><td><span class="su-st">' + esc(t(st)) + '</span></td>';
      tb.appendChild(tr);
    });
    Array.prototype.forEach.call(tb.querySelectorAll('select.su-pick'), function (sel) {
      sel.addEventListener('change', function () { var l = state.lines[parseInt(sel.getAttribute('data-i'), 10)]; l.pick(l.options[parseInt(sel.value, 10)]); });
    });
    $('su-add').textContent = t('add', { n: c.ok + c.chk });
    $('su-add').disabled = (c.ok + c.chk) === 0;
    $('su-preview').hidden = false;
    root.classList.add('su-open');
    track('cart_upload_matched', { lines: state.lines.length, found: c.ok, check: c.chk, missing: c.no });
  }

  /* ---- in het winkelmandje ----
     /shop/cart/add telt OP bij wat er al in het mandje ligt (getest op de live shop op
     21/09/2026: quantity 1 op een regel van 1 gaf 2, daarna quantity 5 gaf 7). Het aantal
     uit het bestand is bedoeld als het aantal dat in het mandje moet staan, dus lezen we
     de regel terug en corrigeren we die met /shop/cart/update, die wel een exact aantal
     zet (antwoord: added_qty, line_id, quantity). Regels die op hetzelfde shopproduct
     uitkomen (bv. een barcode en de interne referentie) worden eerst samengeteld, anders
     zou de tweede het aantal van de eerste overschrijven. */
  function rpc(url, params, cb) {
    fetch(url, {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method: 'call', id: Date.now(), params: params })
    }).then(function (r) { return r.json(); })
      .then(function (d) { cb(d && !d.error && d.result ? d.result : null); })
      .catch(function () { cb(null); });
  }
  function combinationInfo(tid, cb) {
    rpc('/website_sale/get_combination_info', { product_template_id: tid, product_id: false, combination: [], add_qty: 1, parent_combination: [] },
      function (c) { cb(c ? (c.product_id || null) : null); });
  }
  /* Regel-id van de zojuist toegevoegde regel: Odoo geeft die mee in de toastgegevens. */
  function lineIdOf(res) {
    var ls = res && res.notification_info && res.notification_info.lines;
    if (ls && ls.length && ls[0] && ls[0].id) { return ls[0].id; }
    return (res && res.line_id) || null;
  }
  /* Zet het aantal van een product in het mandje op precies qty. cb(gelukt, aantal in het mandje). */
  function cartSet(tid, pid, qty, cb) {
    rpc('/shop/cart/add', { product_template_id: tid, product_id: pid, quantity: qty }, function (res) {
      if (!res) { cb(false, 0); return; }
      var got = parseFloat(res.quantity);
      if (!isFinite(got)) { got = qty; }
      var lid = lineIdOf(res);
      if (got === qty || !lid) { cb(true, got); return; }
      rpc('/shop/cart/update', { line_id: lid, product_id: pid, quantity: qty }, function (up) {
        var fin = up ? parseFloat(up.quantity) : NaN;
        cb(true, isFinite(fin) ? fin : got);
      });
    });
  }
  function addAll() {
    if (state.busy) { return; }
    var groups = [], byTid = {};
    state.lines.forEach(function (l) {
      if (!l.tid || l.status === 'no') { return; }
      var g = byTid[l.tid];
      if (g) { g.qty += l.qty; g.lines.push(l); } else { g = { tid: l.tid, qty: l.qty, code: l.code, lines: [l] }; byTid[l.tid] = g; groups.push(g); }
    });
    if (!groups.length) { setStatus(t('none')); return; }
    busy(true);
    var done = 0, packs = 0, failed = [], skipped = counts().no, adjusted = 0;
    var rowsEl = $('su-rows');
    function mark(l, cls, key, vars) {
      var tr = rowsEl.querySelector('tr[data-i="' + state.lines.indexOf(l) + '"]');
      if (tr) { tr.className = cls; tr.querySelector('.su-st').textContent = t(key, vars || {}); }
    }
    function markGroup(g, cls, key, vars) { g.lines.forEach(function (l) { mark(l, cls, key, vars); }); }
    function finish() {
      busy(false);
      var res = { done: done, packs: packs, failed: failed, skipped: skipped, adjusted: adjusted };
      track('cart_upload_added', { lines: done, packs: packs, failed: failed.length, skipped: skipped, adjusted: adjusted });
      var msg = esc(t('done', { l: done, p: packs }));
      if (skipped) { msg += ' ' + esc(t('skipped', { n: skipped })); }
      if (adjusted) { msg += ' ' + esc(t('qty_warn', { n: adjusted })); }
      if (failed.length) { msg += ' ' + esc(t('fail', { names: failed.join(', ') })); }
      var box = $('su-lastresult'); box.innerHTML = msg + ' <a href="' + esc(shopPrefix + '/shop/cart') + '">' + esc(t('reload')) + '</a>'; box.hidden = false; box.classList.toggle('warn', failed.length > 0 || adjusted > 0);
      setStatus('');
      if (done > 0) {
        try { sessionStorage.setItem(RESULT_KEY, JSON.stringify(res)); } catch (e) {}
        setTimeout(function () { location.href = shopPrefix + '/shop/cart'; }, (failed.length || adjusted) ? 2500 : 900);
      }
    }
    function step(k) {
      if (k >= groups.length) { finish(); return; }
      var g = groups[k];
      setStatus(t('adding', { i: k + 1, n: groups.length })); setBar(k / groups.length);
      combinationInfo(g.tid, function (pid) {
        if (!pid) { failed.push(g.code); markGroup(g, 'fail', 'st_fail'); step(k + 1); return; }
        cartSet(g.tid, pid, g.qty, function (ok, actual) {
          if (!ok) { failed.push(g.code); markGroup(g, 'fail', 'st_fail'); }
          else {
            done += g.lines.length; packs += actual;
            if (actual !== g.qty) { adjusted++; markGroup(g, 'chk', 'st_qty', { n: actual }); } else { markGroup(g, 'done', 'st_done'); }
          }
          step(k + 1);
        });
      });
    }
    step(0);
  }
})();
