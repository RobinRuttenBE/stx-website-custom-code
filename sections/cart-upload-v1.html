<!-- ============================================================
     STX EU / CART UPLOAD v1 (sectiebestand voor de section loader)
     Op de winkelmandpagina (/shop/cart, alle talen) komt bovenaan een
     kaart "Upload your order": de klant kiest een CSV- of Excelbestand
     (of plakt regels) met per regel een productcode en een aantal,
     ziet een preview met het gevonden product per regel, en klikt
     "Add to cart". De regels gaan een voor een in het Odoo-mandje
     van het ingelogde account (dus ook zichtbaar op een ander toestel).

     Bestandsformaat: kolom 1 = productcode (SAP-code, interne
     referentie van de shop, bv. R12005, N260080, LOL6015, 20012458),
     kolom 2 = aantal (in verkoopeenheden van de shop, dus zakken /
     verpakkingen). Koprij mag ("Supplier Code,Quantity") maar hoeft
     niet. Komma, puntkomma of tab als scheiding. Excel: eerste blad.
     Dubbele codes worden opgeteld.

     Productherkenning: per code een call naar de shop-zoekroute
     (/en_GB/website/snippet/autocomplete, dezelfde als de zoekbalk).
     1. Exact: product-URL = /shop/<code>-<naam>-<id>  (groen)
     2. Alleen prefix <code>- maar meerdere hits (bv. R12826 en
        R12826-punten): klant kiest uit een lijstje (oranje)
     3. Geen prefix-hit maar precies 1 zoekresultaat (bv. SAP- of
        barcode 20021027 -> N260013): gewoon geaccepteerd (groen).
        Odoo zoekt ook op interne referentie en barcode, dus een
        enkele treffer op zo'n code klopt; sinds 21/09/2026 staat
        daar geen "controleer" meer bij.
     4. Niets gevonden: rood, regel wordt overgeslagen.

     Winkelmand: /website_sale/get_combination_info (variant-id) en
     daarna /shop/cart/add per product (JSON-RPC, same origin, sessie-
     cookie), zelfde routes als de Cost Calculator in inspiration-v18.
     Aantal = verkoopeenheden (packs). /shop/cart/add telt op bij wat er
     al ligt, dus wordt de regel teruggelezen en met /shop/cart/update op
     het exacte aantal uit het bestand gezet; het bestand is de waarheid.
     Codes die op hetzelfde product uitkomen worden eerst samengeteld. Na afloop herlaadt de pagina en
     toont de kaart eenmalig het resultaat (sessionStorage).

     Winkelmandje leegmaken (sinds 28/09/2026): knop naast "Snel opnieuw
     bestellen" in de rij van "Besteloverzicht" (dus buiten de kaart),
     zichtbaar zodra er regels in het mandje staan, tweede klik bevestigt.
     Verwijdert de regels een voor een met /shop/cart/update quantity 0 en
     zet het mandje intussen op slot (ook tijdens een upload). Aanleiding:
     de storingen van 23/09 en 25/09/2026, klanten die honderd keer snel
     op Remove / Save for later klikten in een mandje van 130 regels.

     Maximaal 500 bestelregels per upload (sinds 19/10/2026). Een
     distributeur uploadde soms per ongeluk een bestand van 30.000 rijen,
     en elke regel is een zoekcall naar de shop: dat legde de site plat.
     Niemand bestelt meer dan 200-300 regels in een keer, dus boven de 500
     weigert de kaart het bestand meteen, nog voor er een call vertrekt.
     Bestanden boven 5 MB worden niet eens gelezen, en van een Excelblad
     leest SheetJS hoogstens 5000 rijen.

     Voorraad (sinds 19/10/2026): na het zoeken haalt de kaart per product
     /website_sale/get_combination_info op. Voor een ingelogd account geeft
     die free_qty, is_storable en allow_out_of_stock_order. Odoo zelf zet
     een te hoog aantal stil op de vrije voorraad (gemeten 19/10: 304
     gevraagd, 254 in het mandje, alleen een "warning") en voegt bij 0
     voorraad niets toe. Daarom toont de preview het vooraf: niet op
     voorraad = rood, wordt niet toegevoegd; minder voorraad dan gevraagd =
     oranje, met een invulveld dat op de vrije voorraad staat zodat de klant
     het aantal kan aanpassen. Die regels staan bovenaan de lijst, met een
     melding erboven. Na het toevoegen (en na het herladen) somt de
     resultaatmelding ze nog eens op, met het aantal dat in het mandje kwam.

     Alleen voor ingelogde accounts (Odoo weigert cart-calls van
     bezoekers). Niet in de Odoo editor.

     LIVE sinds 21/09/2026 (BETA = false): de kaart staat er voor elk
     ingelogd account. Terug in testmodus = BETA = true, dan is de kaart
     alleen zichtbaar in een browser waar de winkelmandpagina ooit met
     #stxupload achter de URL geopend werd (onthouden in localStorage),
     #stxupload-uit zet het weer uit, ?stxupload=1 / ?stxupload=0 ook.

     Excel wordt gelezen met SheetJS (cdnjs), pas geladen als er een
     .xlsx/.xls gekozen wordt. CSV heeft geen bibliotheek nodig.
     ============================================================ -->

  /* Mobiel: geen smalle tabelkolommen maar een kaartje per regel */

<div class="stx-upl" id="stx-upl" hidden>
  <div class="su-head">

<script>
(function () {
  'use strict';
  var BETA = false; // true = alleen zichtbaar na #stxupload (testmodus), false = live voor iedereen
  var BETA_KEY = 'stx_upload_beta';
  var RESULT_KEY = 'stx_upload_result';
  var SEARCH_URL = '/en_GB/website/snippet/autocomplete';
  var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  var PARALLEL = 4;
  var MAX_LINES = 500;              // meer bestelregels = vast een fout bestand (30.000 rijen legde de site plat)
  var MAX_BYTES = 5 * 1024 * 1024;  // 500 regels CSV is ~10 kB, xlsx ~30 kB
  var XLSX_ROWS = 5000;             // SheetJS leest nooit meer rijen dan dit (opgemaakte lege rijen tellen anders mee)

  function wallDone() { if (window.stxLoadwallHide) { window.stxLoadwallHide(); } }

  /* ---- beta-schakelaar (zelfde patroon als de andere secties) ---- */
  function betaOn() {
    try {
      var h = (location.hash || '').toLowerCase();
      var q = /[?&]stxupload=(\d)/.exec(location.search || '');
      var want = null;
      if (h === '#stxupload') { want = true; }
      else if (h === '#stxupload-uit' || h === '#stxupload-off') { want = false; }
      else if (q) { want = q[1] === '1'; }
      if (want === true) { localStorage.setItem(BETA_KEY, '1'); }
      else if (want === false) { localStorage.removeItem(BETA_KEY); }
      return localStorage.getItem(BETA_KEY) === '1';
    } catch (e) { return false; }
  }
  function loggedIn() {
    try {
      var si = window.odoo && window.odoo.__session_info__;
      if (si && typeof si.is_public === 'boolean') { return !si.is_public; }
      if (si && typeof si.is_website_user === 'boolean') { return !si.is_website_user; }
    } catch (e) {}
    return !!document.querySelector('a[href*="/web/session/logout"], a[href*="/my/home"], a[href*="/my/account"], a[href*="/my/orders"]');
  }
  var root = document.getElementById('stx-upl');
  if (!root) { wallDone(); return; }
  if (BETA && !betaOn()) { wallDone(); return; }
  if (document.body.classList.contains('editor_enable') || document.querySelector('.odoo-editor-editable') || document.querySelector('#wrap.o_editable')) { wallDone(); return; }
  if (!loggedIn()) { wallDone(); return; }

  /* ---- taal + teksten ---- */
  var pm = (location.pathname || '/').toLowerCase().match(/^\/(fr|de|en_gb)(\/|$)/);
  var lang = pm ? (pm[1] === 'en_gb' ? 'en' : pm[1]) : 'nl';
  var shopPrefix = pm ? '/' + (pm[1] === 'en_gb' ? 'en_GB' : pm[1]) : '';
  var T = {
    en: {
      kicker: 'Order in one go', title: 'Upload your order as CSV or Excel', lede: 'The first column is the product code, the second column is the number of packs you\'d like to order.',
      open: 'Upload a file', drop: 'Choose a file or drop it here', drop_sub: '.csv or .xlsx, column 1 = product code, column 2 = quantity (packs). A header row is fine. Up to 500 lines.',
      template: 'Download the example file', paste: 'Or paste your lines', paste_go: 'Check pasted lines', reset: 'Start over',

      qty = Math.ceil(qty);
      if (++valid > MAX_LINES) { return; }
      if (map[code]) { map[code].qty += qty; dup++; } else { map[code] = { code: code, qty: qty }; order.push(code); }
    });
    if (valid > MAX_LINES) {
      clearPreview();
      setStatus(t('too_many', { n: valid.toLocaleString(lang === 'en' ? 'en-GB' : lang) + (cut ? '+' : ''), max: MAX_LINES }), true);
      track('cart_upload_rejected', { reason: 'lines', lines: valid, source: source });
      return;
    }
    var lines = order.map(function (c) { return map[c]; });
    if (!lines.length) { setStatus(t('no_lines'), true); return; }
    root.classList.remove('su-pasting');
    track('cart_upload_parsed', { lines: lines.length, source: source });
    matchAll(lines, dup);
  }

  /* ---- productherkenning via de shop-zoekroute ---- */
  function shopSearch(term, limit, cb) {
    fetch(SEARCH_URL, {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method: 'call', id: Date.now(), params: {
        search_type: 'products', term: term, order: 'name asc', limit: limit, max_nb_chars: 120,
        options: { displayDescription: false, displayDetail: true, displayExtraLink: false, displayImage: false, allowFuzzy: false }
      } })
    }).then(function (r) { return r.json(); }).then(function (d) { cb(((d && d.result) || {}).results || []); }).catch(function () { cb(null); });
  }
  function strip(v) { return String(v == null ? '' : v).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim(); }
  function slug(s) {
    s = String(s || '');
    try { s = s.normalize('NFKD').replace(/[̀-ͯ]/g, ''); } catch (e) {}
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  function hitsFor(code, results) {
    var cs = slug(code);
    var out = [];
    (results || []).forEach(function (r) {
      var url = r.website_url || '';
      var m = /^\/shop\/([^/?#]*)-(\d+)(?:[?#].*)?$/.exec(url);
      if (!m) { return; }
      var name = strip(r.name);
      var body = m[1];
      var h = { tid: parseInt(m[2], 10), name: name, url: url, exact: false, prefix: false };
      if (body === cs + '-' + slug(name)) { h.exact = true; h.prefix = true; }
      else if (body.indexOf(cs + '-') === 0) { h.prefix = true; }
      out.push(h);
    });
    return out;
  }
  function matchOne(line, cb) {
    shopSearch(line.code, 10, function (results) {
      line.options = [];
      if (results === null) { line.status = 'no'; cb(); return; }
      var hits = hitsFor(line.code, results);
      var exact = hits.filter(function (h) { return h.exact; });
      var pre = hits.filter(function (h) { return h.prefix; });
      if (exact.length === 1) { line.pick(exact[0]); line.status = 'ok'; }
      else if (pre.length === 1) { line.pick(pre[0]); line.status = 'ok'; }
      else if (pre.length > 1) { line.options = pre; line.pick(pre[0]); line.status = 'multi'; }
      /* Precies 1 product in de zoekresultaten en de code staat niet in de slug: dat is de SAP- of
         barcode van dat product (Odoo zoekt ook op interne referentie en barcode). In de praktijk
         klopt dat altijd, dus dit telt als gevonden en niet meer als "controleer" (21/09/2026). */
      else if (hits.length === 1) { line.pick(hits[0]); line.status = 'ok'; }
      else { line.status = 'no'; }
      if (!line.tid) { cb(); return; }
      stockFor(line.tid, function (s) { applyStock(line, s); cb(); });
    });
  }
  /* ---- voorraad ----
     get_combination_info geeft voor een ingelogd account free_qty (vrije voorraad in verkoopeenheden),
     is_storable en allow_out_of_stock_order. Alleen een voorraadproduct dat niet zonder voorraad besteld
     mag worden heeft een grens; al de rest (of een call die mislukt) = geen grens, Odoo beslist dan zelf
     bij het toevoegen. Het variant-id uit hetzelfde antwoord bewaren we voor /shop/cart/add. */
  var stockCache = {};
  function stockFor(tid, cb) {
    if (stockCache[tid]) { cb(stockCache[tid]); return; }
    rpc('/website_sale/get_combination_info', { product_template_id: tid, product_id: false, combination: [], add_qty: 1, parent_combination: [] }, function (c) {
      if (!c) { cb({ pid: null, avail: Infinity }); return; }
      var limited = c.is_storable === true && c.allow_out_of_stock_order === false && typeof c.free_qty === 'number';
      var s = { pid: c.product_id || null, avail: limited ? Math.max(0, Math.floor(c.free_qty)) : Infinity };
      stockCache[tid] = s;
      cb(s);
    });
  }
  /* want = gevraagd in het bestand, qty = wat we toevoegen. Bij te weinig voorraad staat qty op de vrije voorraad. */
  function applyStock(l, s) { l.pid = s.pid; l.avail = s.avail; l.qty = Math.min(l.want, l.avail); }
  function kind(l) {
    if (!l.tid || l.status === 'no') { return 'no'; }
    if (l.avail <= 0) { return 'oos'; }
    if (l.want > l.avail) { return 'short'; }
    return l.status === 'multi' ? 'multi' : 'ok';
  }
  function addable(l) { var k = kind(l); return k !== 'no' && k !== 'oos' && l.qty > 0; }
  function matchAll(lines, dup) {
    lines.forEach(function (l) { l.status = 'no'; l.tid = null; l.name = ''; l.want = l.qty; l.avail = Infinity; l.pid = null; l.opt = 0; l.pick = function (h) { this.tid = h.tid; this.name = h.name; this.url = h.url; }; });
    state.lines = lines;
    busy(true);
    var next = 0, done = 0, n = lines.length;
    function step() {
      if (next >= n) { return; }
      var l = lines[next++];
      matchOne(l, function () {
        done++; setStatus(t('matching', { i: Math.min(done + 1, n), n: n })); setBar(done / n);
        if (done >= n) { busy(false); setStatus(''); render(dup); } else { step(); }
      });
    }
    for (var k = 0; k < Math.min(PARALLEL, n); k++) { step(); }
  }

  /* ---- preview ---- */
  function counts() {
    var c = { ok: 0, multi: 0, short: 0, oos: 0, no: 0, add: 0, packs: 0 };
    state.lines.forEach(function (l) { c[kind(l)]++; if (addable(l)) { c.add++; c.packs += l.qty; } });
    return c;
  }
  /* Codes + namen voor de meldingen, lange lijsten ingekort. */
  function nameList(ls, max) {
    var out = ls.slice(0, max).map(function (l) { return '<code>' + esc(l.code) + '</code> ' + esc(l.name || ''); }).join(', ');
    if (ls.length > max) { out += ', ' + esc(t('more', { n: ls.length - max })); }
    return out;
  }
  /* Teller, knop en meldingen. Apart van de tabel, zodat typen in een aantal de tabel niet opnieuw opbouwt. */
  function renderSummary() {
    var c = counts();
    var sum = '<span class="su-pill ok">' + esc(t('found', { n: c.ok + c.short })) + '</span>';
    if (c.multi) { sum += '<span class="su-pill chk">' + esc(t('check', { n: c.multi })) + '</span>'; }
    if (c.short) { sum += '<span class="su-pill short">' + esc(t('short', { n: c.short })) + '</span>'; }
    if (c.oos) { sum += '<span class="su-pill no">' + esc(t('oos', { n: c.oos })) + '</span>'; }
    if (c.no) { sum += '<span class="su-pill no">' + esc(t('missing', { n: c.no })) + '</span>'; }
    if (state.dup) { sum += '<span class="su-pill">' + esc(t('dup', { n: state.dup })) + '</span>'; }
    sum += '<span class="su-pill">' + esc(t('tot_packs', { n: c.packs })) + '</span>';
    $('su-sum').innerHTML = sum;
    var oos = state.lines.filter(function (l) { return kind(l) === 'oos'; });
    var notes = '';
    if (oos.length) { notes += '<div class="su-notice oos"><p><strong>' + esc(t('notice_oos')) + '</strong> ' + nameList(oos, 12) + '</p><p>' + esc(t('notice_top')) + '</p></div>'; }
    if (c.short) { notes += '<div class="su-notice"><p><strong>' + esc(t('notice_short')) + '</strong></p>' + (oos.length ? '' : '<p>' + esc(t('notice_top')) + '</p>') + '</div>'; }
    $('su-notices').innerHTML = notes;
    $('su-add').textContent = t('add', { n: c.add });
    $('su-add').disabled = c.add === 0;
    return c;
  }
  /* Probleemregels bovenaan (niet op voorraad, te weinig voorraad, kiezen, niet gevonden), daarna de rest in de volgorde van het bestand. */
  var RANK = { oos: 0, short: 1, multi: 2, no: 3, ok: 4 };
  function render(dup) {
    if (dup != null) { state.dup = dup; }
    var tb = $('su-rows'); tb.innerHTML = '';
    var idx = state.lines.map(function (l, i) { return i; });
    idx.sort(function (a, b) { return (RANK[kind(state.lines[a])] - RANK[kind(state.lines[b])]) || (a - b); });
    idx.forEach(function (i) {
      var l = state.lines[i], k = kind(l);
      var tr = document.createElement('tr'); tr.className = k; tr.setAttribute('data-i', i);
      var prod;
      if (l.options && l.options.length > 1) {
        prod = '<select class="su-pick" data-i="' + i + '">' + l.options.map(function (o, j) { return '<option value="' + j + '"' + (j === l.opt ? ' selected' : '') + '>' + esc(o.name) + '</option>'; }).join('') + '</select>';
      } else if (l.tid) {
        prod = '<a href="' + esc(shopPrefix + l.url) + '" target="_blank" rel="noopener">' + esc(l.name) + '</a>';
      } else { prod = '<span>&ndash;</span>'; }
      var qty = k === 'short'
        ? '<input type="number" class="su-qin" data-i="' + i + '" min="0" max="' + l.avail + '" step="1" value="' + l.qty + '" aria-label="' + esc(t('th_qty') + ' ' + l.code) + '">'
        : String(l.want);
      var st = k === 'short' ? t('st_short', { a: l.avail, w: l.want }) : t({ ok: 'st_ok', multi: 'st_multi', no: 'st_no', oos: 'st_oos' }[k]);
      tr.innerHTML = '<td class="su-code">' + esc(l.code) + '</td><td>' + prod + '</td><td class="su-qty" data-unit="' + esc(t('th_qty')) + '">' + qty + '</td><td><span class="su-st">' + esc(st) + '</span></td>';
      tb.appendChild(tr);
    });
    Array.prototype.forEach.call(tb.querySelectorAll('select.su-pick'), function (sel) {
      sel.addEventListener('change', function () {
        var l = state.lines[parseInt(sel.getAttribute('data-i'), 10)];
        l.opt = parseInt(sel.value, 10); l.pick(l.options[l.opt]); l.qty = l.want;
        sel.disabled = true; $('su-add').disabled = true;
        stockFor(l.tid, function (s) { applyStock(l, s); render(); });
      });
    });
    Array.prototype.forEach.call(tb.querySelectorAll('input.su-qin'), function (inp) {
      var l = state.lines[parseInt(inp.getAttribute('data-i'), 10)];
      inp.addEventListener('input', function () {
        var v = parseInt(inp.value, 10);
        l.qty = isFinite(v) ? Math.max(0, Math.min(v, l.avail)) : 0;
        renderSummary();
      });
      inp.addEventListener('change', function () { inp.value = l.qty; });
    });
    var c = renderSummary();
    $('su-preview').hidden = false;
    root.classList.add('su-open');
    if (dup != null) { track('cart_upload_matched', { lines: state.lines.length, found: c.ok + c.short, check: c.multi, missing: c.no, out_of_stock: c.oos, low_stock: c.short }); }
  }

  /* ---- in het winkelmandje ----
     /shop/cart/add telt OP bij wat er al in het mandje ligt (getest op de live shop op
     21/09/2026: quantity 1 op een regel van 1 gaf 2, daarna quantity 5 gaf 7). Het aantal
     uit het bestand is bedoeld als het aantal dat in het mandje moet staan, dus lezen we
     de regel terug en corrigeren we die met /shop/cart/update, die wel een exact aantal
     zet (antwoord: added_qty, line_id, quantity). Regels die op hetzelfde shopproduct
     uitkomen (bv. een barcode en de interne referentie) worden eerst samengeteld, anders
     zou de tweede het aantal van de eerste overschrijven. */
  /* cb(result, foutmelding). De foutmelding is die van Odoo zelf (bv. "The given product does not
     exist therefore it cannot be added to cart.", wat Odoo ook zegt als de prijs 0 is en de shop
     prevent_zero_price_sale aan heeft). Die tonen we, anders is een mislukte upload niet te duiden. */
  function rpc(url, params, cb) {
    fetch(url, {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method: 'call', id: Date.now(), params: params })
    }).then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && !d.error && d.result) { cb(d.result, ''); return; }
        var e = d && d.error, m = '';
        if (e) { m = (e.data && e.data.message) || e.message || ''; }
        cb(null, String(m).split('\n')[0].slice(0, 200));
      })
      .catch(function () { cb(null, ''); });
  }
  function combinationInfo(tid, cb) {
    rpc('/website_sale/get_combination_info', { product_template_id: tid, product_id: false, combination: [], add_qty: 1, parent_combination: [] },
      function (c, err) { cb(c ? (c.product_id || null) : null, err); });
  }
  /* Regel-id van de zojuist toegevoegde regel: Odoo geeft die mee in de toastgegevens. */
  function lineIdOf(res) {
    var ls = res && res.notification_info && res.notification_info.lines;
    if (ls && ls.length && ls[0] && ls[0].id) { return ls[0].id; }
    return (res && res.line_id) || null;
  }
  /* Zet het aantal van een product in het mandje op precies qty. cb(gelukt, aantal in het mandje, foutmelding). */
  function cartSet(tid, pid, qty, cb) {
    rpc('/shop/cart/add', { product_template_id: tid, product_id: pid, quantity: qty }, function (res, err) {
      if (!res) { cb(false, 0, err); return; }
      var got = parseFloat(res.quantity);
      if (!isFinite(got)) { got = qty; }
      var lid = lineIdOf(res);
      if (got === qty || !lid) { cb(true, got, ''); return; }
      rpc('/shop/cart/update', { line_id: lid, product_id: pid, quantity: qty }, function (up) {
        var fin = up ? parseFloat(up.quantity) : NaN;
        cb(true, isFinite(fin) ? fin : got, '');
      });
    });
  }
  function addAll() {
    if (state.busy) { return; }
    var groups = [], byTid = {};
    /* Voor de resultaatmelding: wat niet op voorraad was en wat met minder dan gevraagd in het mandje kwam. */
    var oosList = [], shortList = [];
    state.lines.forEach(function (l) {
      var k = kind(l);
      if (k === 'oos') { oosList.push({ code: l.code, name: l.name, want: l.want }); return; }
      if (k === 'short' && l.qty <= 0) { shortList.push({ code: l.code, name: l.name, want: l.want, got: 0 }); return; }
      if (!addable(l)) { return; }
      var g = byTid[l.tid];
      if (g) { g.qty += l.qty; g.want += l.want; g.lines.push(l); } else { g = { tid: l.tid, pid: l.pid, qty: l.qty, want: l.want, code: l.code, name: l.name, lines: [l] }; byTid[l.tid] = g; groups.push(g); }
    });
    if (!groups.length) { setStatus(t('none')); return; }
    busy(true);
    var done = 0, packs = 0, failed = [], skipped = counts().no, adjusted = 0, srvErr = '';
    var rowsEl = $('su-rows');
    function mark(l, cls, key, vars) {
      var tr = rowsEl.querySelector('tr[data-i="' + state.lines.indexOf(l) + '"]');
      if (tr) { tr.className = cls; tr.querySelector('.su-st').textContent = t(key, vars || {}); }
    }
    function markGroup(g, cls, key, vars) { g.lines.forEach(function (l) { mark(l, cls, key, vars); }); }
    function finish() {
      busy(false);
      var res = { done: done, packs: packs, failed: failed, skipped: skipped, adjusted: adjusted, srvErr: srvErr, oos: oosList, short: shortList };
      track('cart_upload_added', { lines: done, packs: packs, failed: failed.length, skipped: skipped, adjusted: adjusted, out_of_stock: oosList.length, low_stock: shortList.length });
      var box = $('su-lastresult');
      showResult(box, res);
      box.innerHTML += ' <a href="' + esc(shopPrefix + '/shop/cart') + '">' + esc(t('reload')) + '</a>';
      setStatus('');
      if (done > 0) {
        try { sessionStorage.setItem(RESULT_KEY, JSON.stringify(res)); } catch (e) {}
        setTimeout(function () { location.href = shopPrefix + '/shop/cart'; }, box.classList.contains('warn') ? 2500 : 900);
      }
    }
    /* Odoo zet een te hoog aantal stil op de vrije voorraad, en bij 0 voorraad komt er niets in het mandje.
       Kan gebeuren als de voorraad wijzigde tussen de preview en het toevoegen: dan komt het ook in de lijsten. */
    function placed(g, actual) {
      if (actual <= 0) { oosList.push({ code: g.code, name: g.name, want: g.want }); markGroup(g, 'oos', 'st_oos'); return; }
      done += g.lines.length; packs += actual;
      if (actual < g.want) { shortList.push({ code: g.code, name: g.name, want: g.want, got: actual }); }
      if (actual < g.qty) { markGroup(g, 'short', 'st_qty', { n: actual }); }
      else if (actual > g.qty) { adjusted++; markGroup(g, 'chk', 'st_qty', { n: actual }); }
      else { markGroup(g, 'done', 'st_done'); }
    }
    function step(k) {
      if (k >= groups.length) { finish(); return; }
      var g = groups[k];
      setStatus(t('adding', { i: k + 1, n: groups.length })); setBar(k / groups.length);
      function withPid(pid, cerr) {
        if (!pid) { failed.push(g.code); if (!srvErr && cerr) { srvErr = cerr; } markGroup(g, 'fail', 'st_fail'); step(k + 1); return; }
        cartSet(g.tid, pid, g.qty, function (ok, actual, aerr) {
          if (!ok) { failed.push(g.code); if (!srvErr && aerr) { srvErr = aerr; } markGroup(g, 'fail', 'st_fail'); }
          else { placed(g, actual); }
          step(k + 1);
        });
      }
      if (g.pid) { withPid(g.pid, ''); } else { combinationInfo(g.tid, withPid); }
    }
    step(0);
  }

  /* ---- winkelmandje leegmaken ----
     Waarom: Odoo heeft geen knop om het hele mandje te legen. Klanten met een groot mandje klikten
     honderd keer snel op "Remove" of "Save for later"; elke klik is een eigen /shop/cart/update die
     Odoo niet laat wachten op de vorige, en elke call rendert het hele mandje opnieuw. Op 23/09 en
     25/09/2026 liepen die tientallen gelijktijdige wijzigingen op dezelfde order vast en lag de shop
     plat. Hier gaat het een regel tegelijk: de volgende vertrekt pas als de vorige beantwoord is, en
     het mandje zelf staat intussen op slot. /shop/cart/update met quantity 0 verwijdert de regel. */
  function cartLineIds() {
    var seen = {}, out = [];
    Array.prototype.forEach.call(document.querySelectorAll('input.js_quantity[data-line-id]'), function (el) {
      var lid = parseInt(el.getAttribute('data-line-id'), 10);
      if (!lid || seen[lid] || root.contains(el)) { return; }
      seen[lid] = true;
      out.push({ lid: lid, pid: parseInt(el.getAttribute('data-product-id'), 10) || null });
    });
    return out;
  }
  /* Zonder beginwaarde: placeEmptyButton() draait al bij het opstarten, voor deze regel bereikt wordt. */
  var emptyBtn, emptyMsg, emptyWrap, emptyArmed;
  function emptyLabel(txt) { emptyBtn.innerHTML = '<i class="fa fa-trash-o me-2"></i>' + esc(txt); }
  /* Naast "Snel opnieuw bestellen" (#quick_reorder_button), in dezelfde Odoo-stijl (btn btn-sm btn-link) en
     met hetzelfde streepje ervoor. Staat die knop er niet, dan achter de titel "Besteloverzicht". Odoo kan
     het mandje opnieuw opbouwen, dus een observer zet de knop terug als hij verdwijnt. */
  function placeEmptyButton() {
    if (!emptyWrap) {
      emptyWrap = document.createElement('div'); emptyWrap.className = 'ms-3 border-start ps-2 stx-empty-wrap';
      emptyBtn = document.createElement('button'); emptyBtn.type = 'button'; emptyBtn.className = 'btn btn-sm btn-link stx-empty-btn';
      emptyLabel(t('empty'));
      emptyBtn.addEventListener('click', emptyCart);
      emptyMsg = document.createElement('span'); emptyMsg.className = 'stx-empty-msg'; emptyMsg.hidden = true;
      emptyWrap.appendChild(emptyBtn); emptyWrap.appendChild(emptyMsg);
      if (emptyResult) {
        var m = t('emptied', { n: emptyResult.removed });
        if (emptyResult.failed) { m += ' ' + t('empty_left', { n: emptyResult.failed }); emptyMsg.classList.add('warn'); }
        emptyMsg.textContent = m; emptyMsg.hidden = false;
      }
    }
    if (!emptyWrap.isConnected) {
      var qr = document.getElementById('quick_reorder_button');
      var qrItem = qr && qr.closest('.border-start');
      var row = qrItem ? qrItem.parentNode : null;
      if (!row) { var sc = document.getElementById('shop_cart'); var h = sc && sc.querySelector('h4, h3'); row = h ? h.parentNode : null; }
      if (!row) { return; }
      row.insertBefore(emptyWrap, qrItem ? qrItem.nextSibling : null);
      if (!row.classList.contains('flex-wrap')) { row.classList.add('flex-wrap'); }
    }
    emptyBtn.hidden = !state.busy && cartLineIds().length === 0;
  }
  var shopCartEl = document.getElementById('shop_cart');
  if (shopCartEl && window.MutationObserver) {
    new MutationObserver(function () { if (emptyWrap && (!emptyWrap.isConnected || !state.busy)) { placeEmptyButton(); } })
      .observe(shopCartEl, { childList: true, subtree: true });
  }
  function disarmEmpty() {
    clearTimeout(emptyArmed); emptyArmed = null;
    emptyBtn.classList.remove('stx-confirm'); emptyLabel(t('empty'));
  }
  function emptyCart() {
    if (state.busy) { return; }
    var lines = cartLineIds();
    if (!lines.length) { emptyBtn.hidden = true; return; }
    if (!emptyArmed) {
      emptyMsg.hidden = true;
      emptyBtn.classList.add('stx-confirm'); emptyLabel(t('empty_confirm', { n: lines.length }));
      emptyArmed = setTimeout(disarmEmpty, 6000);
      return;
    }
    disarmEmpty();
    busy(true);
    var removed = 0, failed = 0, n = lines.length;
    track('cart_empty_started', { lines: n });
    function step(k) {
      if (k >= n) {
        track('cart_empty_done', { lines: n, removed: removed, failed: failed });
        try { sessionStorage.setItem(RESULT_KEY, JSON.stringify({ kind: 'empty', removed: removed, failed: failed })); } catch (e) {}
        location.href = shopPrefix + '/shop/cart';
        return;
      }
      emptyLabel(t('emptying', { i: k + 1, n: n }));
      var l = lines[k];
      rpc('/shop/cart/update', { line_id: l.lid, product_id: l.pid, quantity: 0 }, function (res) {
        if (res) { removed++; } else { failed++; }
        step(k + 1);
      });
    }
    step(0);
  }
})();
</script>
