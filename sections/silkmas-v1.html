     31 december. Laadt op ELKE pagina (loader-regel all: true) en doet
     alleen iets als de campagne loopt of de beta aan staat.

     1. Topbanner boven de header, op elke pagina behalve de Silk
        categoriepagina's (daar staat de Silkmas-kaart al): wazig winterbos,
        sneeuw, de 8 Silk kleuren en een knop naar de Silk categorie.
        Niet wegklikbaar (geen kruisje).
     2. Linkermenu van de shop: een vakje 'Silkmas' bovenaan de
        categorielijst (onder 'Alle producten'), lichtblauw, pulserend,
        met sneeuw erin. Link naar de Silk categorie.

        Silk productpagina's): het sneeuwt over de hele pagina, en op de
        categoriepagina's staat bovenaan een Silkmas-kaart met de
        campagne en de looptijd.
     4. Overal (shop, zoeken, categorieen): elke Silk tegel en elke Silk
        productkaart krijgt een subtiel winterkader met sneeuw erin.
     5. Winkelmand: balk 'nog EUR x tot je volgende gratis Silk zakje'.
        Staat UIT (FREE_BAGS = false) tot het Odoo-programma bestaat.

     BETA (nu AAN): met BETA = true toont alles alleen in een browser
     waar je ooit een pagina opende met #stxsilkmas achter de URL
     (onthouden in localStorage), ongeacht de datum. #stxsilkmas-uit
     zet het weer uit. Met BETA = false toont het voor iedereen, maar
     enkel tussen START en END (Brusselse datum). Na END doet het
     bestand niets meer, je hoeft het dus niet weg te halen.

     Beelden: assets/silkmas/ (achtergronden) en assets/balloons/
     (Silk ballonnen), gepind op een commit hash.
     ============================================================ -->

    }
    function make(anywhere) {
      return { x: Math.random() * w, y: anywhere ? Math.random() * h : -6, r: 0.8 + Math.random() * (opts.big || 2.2),
        vy: 0.25 + Math.random() * (opts.speed || 0.7), sway: Math.random() * Math.PI * 2, a: 0.5 + Math.random() * 0.5 };
    }
    function frame() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < flakes.length; i++) {
        var f = flakes[i];
        f.sway += 0.012; f.y += f.vy; f.x += Math.sin(f.sway) * 0.35;
        if (f.y > h + 6) { flakes[i] = make(false); continue; }
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = (opts.color || 'rgba(255,255,255,') + f.a + ')';
        if (opts.outline) { ctx.shadowColor = 'rgba(70,120,180,0.55)'; ctx.shadowBlur = 3; }
        ctx.fill();
      }
      if (running) { raf = requestAnimationFrame(frame); }
    }
    size();
    window.addEventListener('resize', size);
    if (reduced) { frame(); running = false; return; }
    if ('IntersectionObserver' in window && !opts.fixed) {
      new IntersectionObserver(function (es) {
        var vis = es[0].isIntersecting;
        if (vis && !running) { running = true; raf = requestAnimationFrame(frame); }
        else if (!vis) { running = false; cancelAnimationFrame(raf); }
      }).observe(canvas);
    }
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { running = false; cancelAnimationFrame(raf); }
      else if (!running) { running = true; raf = requestAnimationFrame(frame); }
    });
    raf = requestAnimationFrame(frame);
  }

  function balloonImgs(list) {
    return list.map(function (s) { return '<img src="' + BALLOONS + s + '.png" alt="Silk ' + s.split('_')[1].replace('-', ' ') + '" loading="lazy">'; }).join('');
  }

  /* ---- 1. TOPBANNER ---- */
  function bar() {
    if (document.getElementById('stx-sm-bar')) { return; }
    var header = document.querySelector('header#top') || document.querySelector('#wrapwrap > header');
    var wrap = document.getElementById('wrapwrap');
    if (!wrap) { return; }
    var el = document.createElement('div');
    el.id = 'stx-sm-bar';
    el.className = 'stx-sm-bar';
    el.setAttribute('role', 'region');
    el.setAttribute('aria-label', 'Silkmas');
    el.style.backgroundImage = 'url(' + BG + 'bar-bg.jpg)';
    el.innerHTML = '<canvas aria-hidden="true"></canvas><div class="sm-in">' +
      '<div class="sm-balloons" aria-hidden="true">' + balloonImgs(SILKS.slice(0, 6)) + '</div>' +
      '<div class="sm-text"><span class="sm-name">&#10052; <span>Silk</span>mas</span><span class="sm-deal">' + hl(esc(t.deal)) + '</span><span class="sm-dates">' + esc(t.dates) + '</span></div>' +
      '<a class="sm-cta" href="' + silkUrl + '">' + esc(t.cta) + ' &rarr;</a></div>';
    if (header && header.parentNode) { header.parentNode.insertBefore(el, header); } else { wrap.insertBefore(el, wrap.firstChild); }
    snow(el.querySelector('canvas'), { density: 900, max: 90, big: 1.8, speed: 0.6 });
    el.querySelector('.sm-cta').addEventListener('click', function () { track('silkmas_bar_click', {}); });
  }

  /* ---- 2. MENUVAKJE ---- */
  function menu() {
    var lists = document.querySelectorAll('.wsale_products_categories_list > ul.nav');
    for (var i = 0; i < lists.length; i++) {
      var ul = lists[i];
      if (ul.querySelector('.stx-sm-menu')) { continue; }
      var li = document.createElement('li');
      li.className = 'nav-item stx-sm-menu';
      li.innerHTML = '<a href="' + silkUrl + '" class="stx-sm-snow"><span class="sm-flake" aria-hidden="true">&#10052;</span>' + esc(t.menu) + '<span class="sm-pct">' + esc(t.tag) + '</span></a>';
      var first = ul.querySelector(':scope > li');
      ul.insertBefore(li, first ? first.nextSibling : null);
      li.querySelector('a').addEventListener('click', function () { track('silkmas_menu_click', {}); });
    }
  }

  /* ---- 3. SILK PAGINA'S ---- */
  var header = document.getElementById('o_wsale_products_header');
  var catId = header ? header.getAttribute('data-category-id') : '';
  var onSilkMain = catId === SILK_CAT_ID || rest === SILK_SLUG;
  /* Slugs verschillen per taal (NL: latex-onbedrukt-silk-..., EN: latex-balloons-silk-...):
     subcategorie = kruimelpad linkt naar categorie 3032, of 'silk' in de categorieslug. */
  var crumbSilk = !!document.querySelector('#o_wsale_products_header .breadcrumb a[href$="-' + SILK_CAT_ID + '"]');
  var onSilkSub = !onSilkMain && (crumbSilk || /^\/shop\/category\/[^\/]*-silk-[^\/]*-\d+$/.test(rest));
  var onSilkProduct = /^\/shop\/(?!category\/)[^\/]*-silk-[^\/]*\/[^\/]+$/.test(rest);

  function hero() {
    if (!header || document.getElementById('stx-sm-hero')) { return; }
    var el = document.createElement('section');
    el.id = 'stx-sm-hero';
    el.className = 'stx-sm-hero' + (onSilkSub ? ' sm-compact' : '');
    el.style.backgroundImage = 'url(' + BG + 'hero-bg.jpg)';
    el.innerHTML = '<canvas aria-hidden="true"></canvas>' +
      '<div class="sm-copy"><p class="sm-kick">&#10052; ' + esc(t.kick) + '</p><h2>' + hl(esc(t.h)) + '</h2>' +
      (onSilkSub ? '' : '<p>' + esc(t.p) + '</p>') +
      '<div class="sm-chips"><span class="sm-chip">' + esc(t.c2) + '</span>' + (onSilkSub ? '' : '<span class="sm-chip">' + esc(t.c1) + '</span>') +
      (CODE ? '<span class="sm-chip code">' + esc(t.code + CODE) + '</span>' : '') + '</div></div>' +
      '<div class="sm-row" aria-hidden="true">' + balloonImgs(SILKS) + '</div>';
    header.parentNode.insertBefore(el, header.nextSibling);
    snow(el.querySelector('canvas'), { density: 1400, max: 120 });
    track('silkmas_hero_view', { sub: onSilkSub });
  }

  function pageSnow() {
    if (document.getElementById('stx-sm-pagesnow') || reduced) { return; }
    var c = document.createElement('canvas');
    c.id = 'stx-sm-pagesnow';
    c.setAttribute('aria-hidden', 'true');
    document.body.appendChild(c);
    var small = window.innerWidth < 768;
    snow(c, { density: small ? 9000 : 6000, max: small ? 40 : 90, big: 2.6, speed: 0.6, color: 'rgba(214,234,252,', outline: true, fixed: true });
  }

  /* ---- 4. WINTERKADERS ---- */
  var SILK_RE = /(^|[\s\-–(\[])silk\b/i;
  function frost() {
    var cards = document.querySelectorAll('form.oe_product_cart:not(.stx-sm-frost)');
    for (var i = 0; i < cards.length; i++) {
      var f = cards[i];
      var name = f.getAttribute('aria-label') || (f.querySelector('.o_wsale_products_item_title') || {}).textContent || '';
      if (!SILK_RE.test(name)) { continue; }
      f.classList.add('stx-sm-frost');
      var img = f.querySelector('.oe_product_image');
      if (img) {
        img.classList.add('stx-sm-snow');
        if (getComputedStyle(img).position === 'static') { img.style.position = 'relative'; }
      }
    }
    var tiles = document.querySelectorAll('.sempertex_wsale_category_tile:not(.stx-sm-frost)');
    for (var j = 0; j < tiles.length; j++) {
      var tl = tiles[j];
      var title = (tl.querySelector('.sempertex_wsale_category_tile_title') || {}).textContent || '';
      var href = tl.getAttribute('href') || '';
      if (!SILK_RE.test(title) && !/-silk-/.test(href)) { continue; }
      tl.classList.add('stx-sm-frost', 'stx-sm-snow');
      if (getComputedStyle(tl).position === 'static') { tl.style.position = 'relative'; }
      if (!tl.querySelector('.stx-sm-tag')) {
        var tag = document.createElement('span');
        tag.className = 'stx-sm-tag';
        tag.innerHTML = '&#10052; ' + esc(t.tag);
        tl.appendChild(tag);
      }
    }
  }

  /* ---- 5. WINKELMAND: GRATIS ZAKJES ---- */
  function parseMoney(s) {
    s = String(s || '').replace(/[^\d.,]/g, '');
    if (!s) { return NaN; }
    var lastSep = Math.max(s.lastIndexOf(','), s.lastIndexOf('.'));
    if (lastSep > -1 && s.length - lastSep - 1 <= 2) {
      return parseFloat(s.slice(0, lastSep).replace(/[.,]/g, '') + '.' + s.slice(lastSep + 1));
    }
    return parseFloat(s.replace(/[.,]/g, ''));
  }
  function fmt(n) {
    try { return new Intl.NumberFormat(lang === 'en' ? 'en-IE' : lang + '-BE', { style: 'currency', currency: 'EUR' }).format(n); }
    catch (e) { return '€' + n.toFixed(2); }
  }
  function cartBar() {
    var totalEl = document.querySelector('#order_total .monetary_field, tr#order_total .oe_currency_value, #order_total strong, #order_total td:last-child');
    var anchor = document.getElementById('cart_total') || (totalEl && totalEl.closest('table'));
    var cartCol = document.querySelector('.oe_cart') || (anchor && anchor.parentNode);
    if (!totalEl || !cartCol) { return; }
    var total = parseMoney(totalEl.textContent);
    if (isNaN(total)) { return; }
    var el = document.getElementById('stx-sm-cart');
    if (el && el.getAttribute('data-total') === String(total)) { return; }
    if (!el) {
      el = document.createElement('div');
      el.id = 'stx-sm-cart';
      el.className = 'stx-sm-cart stx-sm-snow';
      cartCol.insertBefore(el, cartCol.firstChild);
    }
    el.setAttribute('data-total', String(total));
    var n = Math.floor(total / BAG_STEP + 1e-9);
    var left = BAG_STEP - (total - n * BAG_STEP);
    var pct = Math.round(((total - n * BAG_STEP) / BAG_STEP) * 100);
    var l1 = n > 0 ? t.cartGot.replace('{n}', n).replace('{bags}', n === 1 ? t.bag : t.bags) + '. ' + t.cartNext.replace('{x}', fmt(left)) : t.cartNext.replace('{x}', fmt(left));
    el.innerHTML = '<div class="sm-l1">&#10052; ' + hl(esc(l1)) + '</div><div class="sm-track"><div class="sm-fill"></div></div><div class="sm-l2">' + esc(t.cartSub.replace('{step}', BAG_STEP)) + '</div>';
    requestAnimationFrame(function () { el.querySelector('.sm-fill').style.width = pct + '%'; });
  }

  /* ---- START ---- */
  /* Geen topbanner op de Silk categoriepagina's: daar staat de Silkmas-kaart al */
  if (!(onSilkMain || onSilkSub)) { bar(); }
  menu();
  if (onSilkMain || onSilkSub) { hero(); }
  if (onSilkMain || onSilkSub || onSilkProduct) { pageSnow(); }
  frost();
  var isCart = rest === '/shop/cart';
  if (FREE_BAGS && isCart) { cartBar(); }

  /* Odoo bouwt stukken opnieuw op (filters, winkelmand-updates): licht opnieuw nalopen */
  var pending = false;
  new MutationObserver(function () {
    if (pending) { return; }
    pending = true;
    setTimeout(function () {
      pending = false;
      menu(); frost();
      if (FREE_BAGS && isCart) { cartBar(); }
    }, 250);
  }).observe(document.getElementById('wrapwrap') || document.body, { childList: true, subtree: true });
})();
</script>
