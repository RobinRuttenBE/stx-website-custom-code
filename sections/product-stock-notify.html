<!-- ============================================================
     STX EU / PRODUCTPAGINA: "Get notified when back in stock" voor
     klanten die zonder voorraad mogen bestellen (09/11/2026)
     Bedrijven met 'Simplified Stock Visibility' (module
     sempertex_stock_visibility, o.a. Datta's/KENT GROUP) mogen ook
     bestellen als iets op is. Daardoor laat Odoo de knop "Get notified
     when back in stock" bij hen weg. Dit blok zet hem terug onder het
     rode "Out of Stock" label en schrijft in via Odoo's eigen route
     /shop/add/stock_notification (zelfde mail als de gewone knop).
     09/11 (c): label van de module zelf herkennen (#product_stock_availability_simplified).
     09/11 (d): ingelogd = e-mailadres van het account (vraag van Rish); één klik schrijft
     meteen in, het formulier verschijnt alleen zonder account of bij een fout.
     Toont alleen als: label "Out of Stock" zichtbaar + winkelmandknop
     zichtbaar + Odoo's eigen meldknop ontbreekt.
     ============================================================ -->
<style>
  .stx-stock-notify { margin-top: -8px; margin-bottom: 12px; max-width: 360px; }
  .stx-stock-notify .btn-link { font-weight: 600; text-decoration: none; }
</style>
<script>
(function () {
  'use strict';

  var TXT = {
    en: { ask: 'Get notified when back in stock', ok: "We'll notify you once the product is back in stock",
          bad: 'Please enter a valid email address', err: 'Something went wrong, please try again', ph: 'youremail@gmail.com' },
    nl: { ask: 'Ontvang een melding als het weer op voorraad is', ok: 'We laten je weten zodra het product weer op voorraad is',
          bad: 'Vul een geldig e-mailadres in', err: 'Er ging iets mis, probeer het opnieuw', ph: 'jouwemail@gmail.com' },
    fr: { ask: 'Être averti du retour en stock', ok: 'Nous vous préviendrons dès que le produit sera de nouveau en stock',
          bad: 'Veuillez saisir une adresse e-mail valide', err: "Une erreur s'est produite, veuillez réessayer", ph: 'votreemail@gmail.com' },
    de: { ask: 'Benachrichtigen, wenn wieder auf Lager', ok: 'Wir benachrichtigen Sie, sobald das Produkt wieder auf Lager ist',
          bad: 'Bitte geben Sie eine gültige E-Mail-Adresse ein', err: 'Etwas ist schiefgelaufen, bitte versuchen Sie es erneut', ph: 'ihreemail@gmail.com' }
  };
  var KEY = 'stx_stock_notify_';
  var state = {}; // per product id: 'open' | 'done'
  var sentTo = {}; // per product id: e-mailadres waarmee ingeschreven
  // E-mailadres van het ingelogde account (contact van de gebruiker, anders de login).
  // Eén keer per sessie opgehaald; leeg voor bezoekers zonder account.
  var acct = { email: null, asked: false };
  var ACCT_KEY = 'stx_sn_acct_v1';
  function rpc(url, params) {
    return fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method: 'call', params: params || {}, id: Date.now() }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.error) { throw new Error((j.error.data && j.error.data.message) || j.error.message); } return j.result; });
  }
  function isEmail(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s || '').trim()); }
  function loadAccount(onReady) {
    if (acct.asked) { return; }
    acct.asked = true;
    var info = null;
    rpc('/web/session/get_session_info').then(function (si) {
      info = si;
      if (!si || !si.uid) { return null; }
      try {
        var c = JSON.parse(sessionStorage.getItem(ACCT_KEY) || 'null');
        if (c && c.uid === si.uid && isEmail(c.email)) { return [{ email: c.email }]; }
      } catch (e) {}
      if (!si.partner_id) { return null; }
      return rpc('/web/dataset/call_kw/res.partner/read', { model: 'res.partner', method: 'read',
        args: [[si.partner_id], ['email']], kwargs: {} }).catch(function () { return null; });
    }).then(function (rows) {
      if (!info || !info.uid) { return; }
      var e = rows && rows[0] && rows[0].email;
      if (!isEmail(e) && isEmail(info.username)) { e = info.username; }
      if (!isEmail(e)) { return; }
      acct.email = String(e).trim();
      try { sessionStorage.setItem(ACCT_KEY, JSON.stringify({ uid: info.uid, email: acct.email })); } catch (x) {}
      onReady();
    }).catch(function () {});
  }

  function t() {
    var l = (document.documentElement.getAttribute('lang') || '').toLowerCase().slice(0, 2);
    return TXT[l] || TXT.en;
  }
  function shown(el) {
    return !!(el && !el.classList.contains('d-none') && el.offsetParent !== null);
  }
  function productId(details) {
    var inp = details.querySelector('input.product_id, input[name="product_id"]');
    var v = inp && parseInt(inp.value, 10);
    return v > 0 ? v : null;
  }
  function done(pid) {
    if (state[pid] === 'done') { return true; }
    try { return localStorage.getItem(KEY + pid) === '1'; } catch (e) { return false; }
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function render(box, pid) {
    var x = t();
    if (done(pid)) {
      var to = sentTo[pid] || acct.email;
      box.innerHTML = '<div class="py-2 small text-muted"><i class="fa fa-bell me-2"></i>' + esc(x.ok) +
        (to ? ' (' + esc(to) + ')' : '') + '</div>';
      return;
    }
    var open = state[pid] === 'open';
    box.innerHTML =
      '<div class="btn btn-link px-0 stx-sn-ask"' + (open ? ' style="display:none"' : '') + '>' +
        '<i class="fa fa-envelope-o me-2"></i>' + esc(x.ask) + '</div>' +
      '<div class="stx-sn-form"' + (open ? '' : ' style="display:none"') + '>' +
        '<div class="input-group">' +
          '<input class="form-control stx-sn-email" type="email" autocomplete="email" placeholder="' + esc(x.ph) + '" value="' + esc(acct.email || '') + '">' +
          '<button type="button" class="btn btn-primary stx-sn-send" aria-label="' + esc(x.ask) + '"><i class="fa fa-paper-plane"></i></button>' +
        '</div>' +
        '<div class="form-text text-danger stx-sn-msg" style="display:none"></div>' +
      '</div>';
    var ask = box.querySelector('.stx-sn-ask');
    var send = box.querySelector('.stx-sn-send');
    var inp = box.querySelector('.stx-sn-email');
    var msg = box.querySelector('.stx-sn-msg');
    function fail(text) {
      // Bij een fout altijd het formulier tonen (met het adres al ingevuld), zodat de klant het kan aanpassen.
      if (state[pid] !== 'open') { state[pid] = 'open'; ask.style.display = 'none'; box.querySelector('.stx-sn-form').style.display = ''; }
      msg.textContent = text; msg.style.display = ''; send.disabled = false;
    }
    ask.addEventListener('click', function () {
      // Ingelogd met bekend e-mailadres: meteen inschrijven, zonder formulier.
      if (acct.email) {
        ask.style.pointerEvents = 'none';
        ask.style.opacity = '0.6';
        subscribe(acct.email);
        return;
      }
      state[pid] = 'open';
      render(box, pid);
      var i2 = box.querySelector('.stx-sn-email');
      if (i2) { i2.focus(); }
    });
    function submit() {
      var email = (inp.value || '').trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fail(x.bad); return; }
      subscribe(email);
    }
    function subscribe(email) {
      msg.style.display = 'none';
      send.disabled = true;
      sentTo[pid] = email;
      fetch('/shop/add/stock_notification', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', method: 'call', params: { email: email, product_id: pid } })
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.error) {
          var m = (j.error.data && j.error.data.message) || '';
          ask.style.pointerEvents = ''; ask.style.opacity = '';
          fail(/email/i.test(m) ? x.bad : x.err);
          return;
        }
        state[pid] = 'done';
        try { localStorage.setItem(KEY + pid, '1'); } catch (e) {}
        render(box, pid);
      }).catch(function () { ask.style.pointerEvents = ''; ask.style.opacity = ''; fail(x.err); });
    }
    send.addEventListener('click', submit);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  }

  function place() {
    var details = document.getElementById('product_details');
    if (!details) { return; }
    var mine = details.querySelectorAll('.stx-stock-notify');
    // Bedrijven met Simplified Stock Visibility krijgen het label van de module
    // (#product_stock_availability_simplified, rood = op); het gewone Odoo-blok
    // (#out_of_stock_message) staat er dan niet. Beide gevallen afvangen.
    var simple = details.querySelector('#product_stock_availability_simplified');
    var badge = (simple && simple.querySelector('.badge.text-bg-danger')) ? simple : details.querySelector('#out_of_stock_message');
    var cart = details.querySelector('#add_to_cart');
    var odooNotify = details.querySelector('#stock_notification_div');
    var pid = productId(details);
    var want = pid && shown(badge) && shown(cart) && !shown(odooNotify);
    if (!want) {
      for (var i = 0; i < mine.length; i++) { mine[i].parentNode.removeChild(mine[i]); }
      return;
    }
    // Account-e-mail pas ophalen als het blok echt nodig is; daarna het formulier opnieuw vullen.
    loadAccount(function () {
      var b = document.querySelector('#product_details .stx-stock-notify');
      var p = b && parseInt(b.getAttribute('data-pid'), 10);
      if (b && p && !done(p) && state[p] !== 'open') { render(b, p); }
    });
    // Eén blok, direct na het label en voor het juiste product (ander verpakkingstype = ander product).
    for (var k = 0; k < mine.length; k++) {
      if (k > 0 || mine[k].previousElementSibling !== badge || mine[k].getAttribute('data-pid') !== String(pid)) {
        mine[k].parentNode.removeChild(mine[k]);
      }
    }
    if (details.querySelector('.stx-stock-notify')) { return; }
    var box = document.createElement('div');
    box.className = 'stx-stock-notify';
    box.setAttribute('data-pid', String(pid));
    badge.insertAdjacentElement('afterend', box);
    render(box, pid);
  }

  var observed = false;
  function observe() {
    if (observed || !window.MutationObserver || !document.body) { return; }
    observed = true;
    var tm = null;
    new MutationObserver(function (list) {
      // Eigen wijzigingen negeren, anders loopt de observer rond.
      for (var i = 0; i < list.length; i++) {
        var n = list[i].target;
        if (!(n.closest && n.closest('.stx-stock-notify'))) {
          clearTimeout(tm);
          tm = setTimeout(place, 80);
          return;
        }
      }
    }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'style', 'value'] });
  }
  function run() {
    if (!document.getElementById('product_details')) { return; }
    place();
    observe();
    setTimeout(place, 600);
    setTimeout(place, 2000);
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', run); }
  else { run(); }
})();
</script>
