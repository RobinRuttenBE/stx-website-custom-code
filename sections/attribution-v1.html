<!-- ============================================================
     STX EU / ATTRIBUTIE v1 (sectiebestand voor de section loader)
     Laadt op ELKE pagina (loader-regel all: true). Toont niets.

     Doel: per bestelling zien welke knoppen, banners en tools van de
     custom code de klant de 30 dagen ervoor gebruikte.

     1. Aanrakingen bijhouden: elk eigen PostHog-event van de custom
        code (home_band_click, silkmas_bar_click, calc_cart, ...,
        alles wat niet met $ begint) wordt met tijdstip en pagina
        bewaard in localStorage 'stx_touch_v1' (30 dagen, max 60).
     2. Ingelogde accounts koppelen: posthog.identify('odoo-partner-<id>')
        zodat klikken en bestellingen op verschillende toestellen bij
        dezelfde klant uitkomen. Enkel het Odoo-contactnummer, geen
        naam of e-mail. Interne gebruikers (backend-accounts) worden
        gemarkeerd als intern, zodat tests uit de cijfers kunnen.
     3. Bestelling: op /shop/confirmation stuurt dit bestand 1 keer per
        bestelling het event 'order_completed' met ordernummer, bedrag
        (incl. en excl. btw), aantal regels en productcodes, plus de
        aanrakingen: stx_touches (alle), stx_first_touch, stx_last_touch,
        stx_last_touch_days, stx_touch_count, stx_touched.
        Bron: het data-order-tracking-info attribuut dat Odoo zelf op
        de bevestigingspagina zet (voor Google Analytics), met het
        ordernummer uit de pagina als vangnet.

     BETA (nu AAN): met BETA = true doet stap 3 (order_completed) alleen
     iets in een browser die ooit #stxattr achter de URL had.
     #stxattr-uit zet het weer uit. Stap 1 en 2 lopen altijd (ze tonen
     niets en kosten niets).
     ============================================================ -->
<script>
(function () {
  'use strict';
  var BETA = true; // true = order_completed alleen na #stxattr (testmodus), false = voor iedereen
  var BETA_KEY = 'stx_attr_beta';
  var KEY = 'stx_touch_v1';
  var DONE_KEY = 'stx_orders_sent_v1';
  var WINDOW_DAYS = 30;
  var MAX = 60;

  if (window.__stxAttr) { return; }
  window.__stxAttr = true;
  if (document.body.classList.contains('editor_enable') || document.querySelector('.odoo-editor-editable') || document.querySelector('#wrap.o_editable')) { return; }

  var h = (window.location.hash || '').toLowerCase();
  function betaOn() {
    var want = null;
    if (h === '#stxattr' || h === '#stxattr=1') { want = true; }
    else if (h === '#stxattr=0' || h === '#stxattr-uit' || h === '#stxattr-off') { want = false; }
    try {
      if (want === true) { localStorage.setItem(BETA_KEY, '1'); }
      else if (want === false) { localStorage.removeItem(BETA_KEY); }
      return localStorage.getItem(BETA_KEY) === '1';
    } catch (e) { return want === true; }
  }
  var beta = betaOn();

  function readTouches() {
    try {
      var list = JSON.parse(localStorage.getItem(KEY) || '[]');
      var cut = Date.now() - WINDOW_DAYS * 864e5;
      return list.filter(function (x) { return x && x.t > cut; });
    } catch (e) { return []; }
  }
  function saveTouches(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list.slice(-MAX))); } catch (e) {}
  }
  var SKIP = /^(order_completed|\$)/;
  var KEEP = ['slide', 'palette', 'tool', 'inner', 'outer', 'sub', 'href', 'label', 'event', 'title'];
  function addTouch(name, props) {
    if (!name || SKIP.test(name)) { return; }
    var list = readTouches();
    var x = { e: name, t: Date.now(), p: (window.location.pathname || '').slice(0, 80) };
    if (props) {
      KEEP.forEach(function (k) { if (props[k] != null && props[k] !== '') { x[k] = String(props[k]).slice(0, 60); } });
    }
    list.push(x);
    saveTouches(list);
  }

  /* ---- PostHog: wachten tot de echte bibliotheek geladen is ---- */
  function whenPosthog(cb, tries) {
    tries = tries || 0;
    var ph = window.posthog;
    if (ph && ph.__loaded && typeof ph.capture === 'function') { cb(ph); return; }
    if (tries > 80) { return; }
    setTimeout(function () { whenPosthog(cb, tries + 1); }, 250);
  }

  /* ---- 2. ingelogde accounts koppelen (1 keer per sessie) ---- */
  var loggedIn = !!document.querySelector('a[href*="/web/session/logout"], a[href*="/my/home"], a[href*="/my/account"]');
  function identify(ph) {
    if (!loggedIn || typeof ph.identify !== 'function') { return; }
    var cached = null;
    try { cached = JSON.parse(sessionStorage.getItem('stx_attr_id') || 'null'); } catch (e) {}
    function apply(info) {
      if (!info || !info.pid) { return; }
      var id = 'odoo-partner-' + info.pid;
      try {
        if (ph.get_distinct_id && ph.get_distinct_id() !== id) {
          ph.identify(id, { odoo_partner_id: info.pid, stx_internal: !!info.internal });
        }
        if (info.internal && typeof ph.setInternalOrTestUser === 'function') { ph.setInternalOrTestUser(); }
      } catch (e) {}
    }
    if (cached) { apply(cached); return; }
    fetch('/web/session/get_session_info', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method: 'call', params: {}, id: Date.now() }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var r = j && j.result;
        if (!r || !r.uid || !r.partner_id) { return; }
        var info = { pid: r.partner_id, internal: !!r.is_internal_user };
        try { sessionStorage.setItem('stx_attr_id', JSON.stringify(info)); } catch (e) {}
        apply(info);
      })
      .catch(function () {});
  }

  /* ---- 3. bestelling afgerond ---- */
  var path = (window.location.pathname || '').toLowerCase();
  var isConfirmation = /\/shop\/confirmation\/?$/.test(path);

  function readOrder() {
    var o = { ref: '', value: null, tax: null, currency: '', lines: 0, codes: [] };
    var el = document.querySelector('[data-order-tracking-info]');
    if (el) {
      try {
        var info = JSON.parse(el.getAttribute('data-order-tracking-info'));
        o.ref = info.transaction_id || '';
        o.value = info.value != null ? Number(info.value) : null;
        o.tax = info.tax != null ? Number(info.tax) : null;
        o.currency = info.currency || '';
        var items = info.items || [];
        o.lines = items.length;
        o.codes = items.map(function (it) { return String(it.item_id || it.item_name || '').slice(0, 30); }).slice(0, 80);
      } catch (e) {}
    }
    if (!o.ref) {
      var m = /\bS\d{4,7}\b/.exec((document.getElementById('wrap') || document.body).textContent || '');
      if (m) { o.ref = m[0]; }
    }
    return o;
  }

  function sendOrder(ph) {
    if (BETA && !beta) { return; }
    var o = readOrder();
    if (!o.ref) { return; }
    var sent = [];
    try { sent = JSON.parse(localStorage.getItem(DONE_KEY) || '[]'); } catch (e) {}
    if (sent.indexOf(o.ref) !== -1) { return; }
    var touches = readTouches();
    var names = [];
    touches.forEach(function (x) { if (names.indexOf(x.e) === -1) { names.push(x.e); } });
    var first = touches[0], last = touches[touches.length - 1];
    var props = {
      order_ref: o.ref,
      value: o.value,
      value_excl_tax: (o.value != null && o.tax != null) ? Math.round((o.value - o.tax) * 100) / 100 : null,
      tax: o.tax,
      currency: o.currency,
      order_lines: o.lines,
      product_codes: o.codes,
      stx_touched: touches.length > 0,
      stx_touch_count: touches.length,
      stx_touches: names,
      stx_first_touch: first ? first.e : null,
      stx_last_touch: last ? last.e : null,
      stx_last_touch_detail: last ? (last.slide || last.palette || last.inner || last.label || last.p || null) : null,
      stx_last_touch_days: last ? Math.round((Date.now() - last.t) / 864e5 * 10) / 10 : null,
      stx_touch_log: touches.slice(-15).map(function (x) { return x.e + ' @ ' + new Date(x.t).toISOString().slice(0, 16) + ' ' + x.p; })
    };
    try { ph.capture('order_completed', props); } catch (e) { return; }
    sent.push(o.ref);
    try { localStorage.setItem(DONE_KEY, JSON.stringify(sent.slice(-50))); } catch (e) {}
    saveTouches([]); /* nieuwe periode na een bestelling */
  }
  /* ---- START: pas als PostHog echt geladen is ---- */
  whenPosthog(function (ph) {
    /* 1. aanrakingen: elk event dat de custom code naar PostHog stuurt, gaat ook in het logboek */
    if (!ph.__stxWrapped) {
      var orig = ph.capture;
      ph.capture = function (name, props) { try { addTouch(name, props); } catch (e) {} return orig.apply(this, arguments); };
      ph.__stxWrapped = true;
    }
    identify(ph);
    if (isConfirmation) { sendOrder(ph); }
  });
})();
</script>
