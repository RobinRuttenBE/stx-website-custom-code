<!-- ============================================================
     STX EU / PRODUCTPAGINA: knop "Registreer om te kopen"
     Dit blok staat INLINE in het einde-body Custom Code veld van
     Odoo (Instellingen > Website > Custom Code), net als de
     menu-gloed. Dit bestand is de kopie in de repo; de section
     loader laadt het NIET (productpaden zijn /shop/<slug>-<id>).

     Werking: op elke productpagina (#product_details aanwezig)
     komt onder de knop "Toevoegen aan verlanglijst" een knop naar
     /registratie, met de taalprefix van de pagina (en_GB, fr, de;
     nl zonder). De knop toont ALLEEN voor bezoekers die niet
     ingelogd zijn (Odoo session info is_public). Ingelogde klanten
     zien hem nooit, ook niet zonder prijstoegang. Extra vangnet:
     is de knop "Aan winkelmandje toevoegen" zichtbaar, dan komt er
     ook niets bij. Odoo kan die knop na het laden nog
     tonen of verbergen (varianten, prijs 0); een observer volgt
     dat en zet onze knop mee aan of uit. Verwijderen = dit blok
     weghalen.

     BETA (nu uit, live voor iedereen sinds 2026-09-16): staat BETA
     hieronder op true, dan toont de knop alleen
     in een browser waar je een productpagina ooit opende met
     #stxbeta achter de URL (wordt onthouden in localStorage).
     #stxbeta-uit zet het weer uit. De hash mag achter elke URL,
     ook als Odoo er al ?attribute_values=... in heeft gezet.
     (?stxbeta=1 / ?stxbeta=0 werkt ook, maar alleen als de URL
     nog geen vraagteken heeft.) Echt live voor iedereen:
     BETA op false zetten.
     ============================================================ -->
<style>
  .stx-register-cta {
    flex: 0 0 100%;
    width: 100%;
    margin-top: 2px;
    font-weight: 600;
  }
  .stx-register-cta .fa { margin-right: 8px; }
</style>
<script>
(function () {
  'use strict';

  var TXT = {
    nl: 'Registreer om te kopen',
    en: 'Register to buy',
    fr: 'Créer un compte pour acheter',
    de: 'Registrieren, um zu kaufen'
  };
  var PAGE = '/registratie';
  var BETA = false; // true = alleen zichtbaar na #stxbeta (testmodus), false = live voor iedereen
  var BETA_KEY = 'stx_register_beta';
  var beta = false; // gezet door betaOn() hieronder
  // Odoo verwijdert odoo.__session_info__ zodra zijn eigen scripts (defer) starten,
  // dus we lezen hem nu, terwijl dit inline script tijdens het laden draait.
  var SI = null;
  try { SI = (window.odoo && window.odoo.__session_info__) || null; } catch (e) {}

  // Beta-schakelaar: #stxbeta achter de URL zet hem aan voor deze browser, #stxbeta-uit uit.
  // (?stxbeta=1 / ?stxbeta=0 als query werkt ook.)
  function betaOn() {
    var h = (window.location.hash || '').toLowerCase();
    var q = /[?&]stxbeta=([01])/.exec(window.location.search);
    var want = null;
    if (h === '#stxbeta' || h === '#stxbeta=1' || h === '#stxbeta-on' || h === '#stxbeta-aan') { want = true; }
    else if (h === '#stxbeta=0' || h === '#stxbeta-off' || h === '#stxbeta-uit') { want = false; }
    else if (q) { want = q[1] === '1'; }
    try {
      if (want === true) { localStorage.setItem(BETA_KEY, '1'); }
      else if (want === false) { localStorage.removeItem(BETA_KEY); }
      return localStorage.getItem(BETA_KEY) === '1';
    } catch (e) { return want === true; }
  }

  function lang() {
    var l = (document.documentElement.getAttribute('lang') || '').toLowerCase().slice(0, 2);
    return TXT[l] ? l : 'nl';
  }
  // Taalprefix uit het pad: /en_GB/shop/..., /fr/shop/..., /de/shop/...; nl heeft geen prefix.
  function prefix() {
    var seg = (window.location.pathname.split('/')[1] || '');
    return /^[a-z]{2}(_[A-Za-z]{2})?$/.test(seg) ? '/' + seg : '';
  }
  function visible(el) {
    if (!el || el.classList.contains('d-none')) { return false; }
    var cs = window.getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden') { return false; }
    var wrap = el.closest('#add_to_cart_wrap');
    if (wrap && (wrap.classList.contains('d-none') || window.getComputedStyle(wrap).display === 'none')) { return false; }
    return true;
  }
  function canBuy() {
    return visible(document.querySelector('#product_details #add_to_cart'));
  }
  // Alleen voor bezoekers die NIET ingelogd zijn. Ingelogde klanten zonder prijzen
  // krijgen de knop ook niet (Robin, 2026-09-16). Bron: Odoo session info;
  // zonder session info: ingelogd als er een uitlog- of portaallink staat.
  function loggedIn() {
    try {
      var si = SI || (window.odoo && window.odoo.__session_info__);
      if (si && typeof si.is_public === 'boolean') { return !si.is_public; }
      if (si && 'uid' in si) { return !!si.uid; }
      if (si && typeof si.is_website_user === 'boolean') { return !si.is_website_user; }
    } catch (e) {}
    return !!document.querySelector('a[href*="/web/session/logout"], a[href*="/my/home"], a[href*="/my/account"]');
  }

  function removeAll() {
    var all = document.querySelectorAll('.stx-register-cta');
    for (var i = 0; i < all.length; i++) { if (all[i].parentNode) { all[i].parentNode.removeChild(all[i]); } }
  }
  function place() {
    var details = document.getElementById('product_details');
    if (!details) { return; }
    // Niet tonen: testmodus uit, ingelogd, of de winkelmandknop is zichtbaar.
    // Dan komt de knop er nooit in, en gaat een kopie die Odoo uit een eigen
    // snapshot terugzet meteen weer weg. (Verbergen via een attribuut werkt niet:
    // Odoo bouwt het detailblok na het laden opnieuw op uit die snapshot.)
    if ((BETA && !beta) || loggedIn() || canBuy()) { removeAll(); return; }
    var all = details.querySelectorAll('.stx-register-cta');
    for (var i = 1; i < all.length; i++) { if (all[i].parentNode) { all[i].parentNode.removeChild(all[i]); } }
    if (all.length) { return; }
    var block = details.querySelector('#product_option_block');
    var wish = details.querySelector('.o_add_wishlist_dyn, .o_add_wishlist');
    var anchor = block || (wish && wish.parentNode) || details.querySelector('#o_wsale_cta_wrapper');
    if (!anchor) { return; }
    var cta = document.createElement('a');
    cta.className = 'btn btn-primary stx-register-cta';
    cta.href = prefix() + PAGE;
    cta.setAttribute('data-stx-register', '1');
    cta.innerHTML = '<i class="fa fa-user-plus" aria-hidden="true"></i>' + TXT[lang()];
    if (anchor.id === 'o_wsale_cta_wrapper') { anchor.appendChild(cta); }
    else { anchor.insertAdjacentElement('afterend', cta); }
  }

  var observed = false;
  function observe() {
    // Op body, niet op #product_details: Odoo vervangt dat blok soms in zijn geheel.
    if (observed || !window.MutationObserver || !document.body) { return; }
    observed = true;
    var t = null;
    new MutationObserver(function () {
      clearTimeout(t);
      t = setTimeout(place, 60);
    }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'style'] });
  }
  function apply() {
    place();
    observe();
    // Odoo rondt de productpagina soms pas na het laden af (combinatie-info, prijs).
    setTimeout(place, 600);
    setTimeout(place, 2000);
  }
  function run() {
    apply();
    // #stxbeta achter de URL typen herlaadt de pagina niet (alleen de hash wijzigt),
    // dus we luisteren mee en zetten de knop meteen aan of uit.
    window.addEventListener('hashchange', function () { beta = betaOn(); apply(); });
  }

  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', run); }
  else { run(); }
})();
</script>
