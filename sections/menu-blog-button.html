<!-- ============================================================
     STX EU / MENU "BLOG" KNOP
     Dit blok staat INLINE in het einde-body Custom Code veld van
     Odoo (Instellingen > Website > Custom Code), net als de
     menu-gloed. Dit bestand is de kopie in de repo; de section
     loader laadt het NIET (de knop moet op elke pagina staan).

     Werking:
     - Desktop: in de menurij (Shop, Workshops, Inspiration, Tools,
       Why Sempertex?) komt HELEMAAL RECHTS een knop "Blog" met een
       licht paarse gloed. Link = /blog met de taalprefix van de
       pagina (en_GB, fr, de; nl zonder).
     - Mobiel: "Blog" onderaan het uitklapmenu, zelfde link.
     - Verder niets: geen popup, geen gepind artikel, geen requests.

     21/09/2026: de popup met het gepinde artikel is eruit, op vraag
     van Robin, desktop en mobiel. Daarmee vervallen ook de cache
     (stx_blog_pin_v1), het weggeklikte kruisje (stx_blog_pop_off) en
     alle achtergrondrequests naar de zoekroute, de sitemap en de
     artikelpagina's. Oude sleutels worden hieronder opgeruimd.
     De blogpagina zelf (blog-v31.html) schrijft de pin niet meer weg.

     BETA (uit, live sinds 16/09/2026): met BETA = true toont de knop
     alleen in een browser waar je een pagina opende met #stxblog
     achter de URL (onthouden in localStorage). #stxblog-uit zet het
     weer uit. Verwijderen = dit blok weghalen.
     Sinds 16/09/2026.
     ============================================================ -->
<style>
  /* Menurij: de lijst mag de volle breedte nemen zodat de knop rechts komt. */
  .navbar .top_menu.stx-has-blog { flex: 1 1 auto; width: 100%; }
  .navbar .top_menu > li.stx-blog-item { margin-left: auto; position: relative; }
  .navbar .top_menu > li.stx-blog-item > a.nav-link > span {
    display: inline-block;
    padding: 5px 18px;
    margin: -5px 0;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1.08em;
    color: #1b073d;
    background: rgba(241, 217, 255, 0.55);
    box-shadow: 0 0 0 2px #e1c6ff, 0 0 10px 3px rgba(107, 63, 185, 0.28);
    animation: stx-blog-glow 2.8s ease-in-out infinite;
  }
  .navbar .top_menu > li.stx-blog-item > a.nav-link:hover > span,
  .navbar .top_menu > li.stx-blog-item > a.nav-link.active > span {
    background: #6b3fb9;
    color: #fff;
    animation: none;
    box-shadow: 0 0 0 2px #e1c6ff, 0 0 14px 4px rgba(107, 63, 185, 0.45);
  }
  @keyframes stx-blog-glow {
    0%, 100% { box-shadow: 0 0 0 2px #e1c6ff, 0 0 8px 2px rgba(107, 63, 185, 0.22); }
    50% { box-shadow: 0 0 0 2px #e1c6ff, 0 0 14px 4px rgba(107, 63, 185, 0.42); }
  }

  /* Mobiel uitklapmenu: Blog onderaan */
  .o_navbar_mobile .top_menu > li.stx-blog-item-m > a.nav-link > span {
    display: inline-block;
    padding: 3px 16px;
    margin: -3px 0;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1.08em;
    background: rgba(241, 217, 255, 0.55);
    box-shadow: 0 0 0 2px #e1c6ff, 0 0 8px 2px rgba(107, 63, 185, 0.25);
  }
  @media (prefers-reduced-motion: reduce) {
    .navbar .top_menu > li.stx-blog-item > a.nav-link > span { animation: none; }
  }
</style>
<script>
(function () {
  'use strict';
  var BETA = false;                // true = alleen na #stxblog (testmodus), false = live voor iedereen
  var BETA_KEY = 'stx_blog_beta';
  var BLOG_ROOT = '/blog';

  /* ---- guards ---- */
  function inEditor() {
    try { if (window.frameElement) { return true; } } catch (e) { return true; }
    if (/enable_editor|debug=assets/.test(window.location.search)) { return true; }
    return document.body.classList.contains('editor_enable')
      || !!document.querySelector('.odoo-editor-editable')
      || !!document.querySelector('#wrap.o_editable');
  }
  function betaOn() {
    var h = (window.location.hash || '').toLowerCase();
    var want = null;
    if (h === '#stxblog' || h === '#stxblog=1' || h === '#stxblog-on' || h === '#stxblog-aan') { want = true; }
    else if (h === '#stxblog=0' || h === '#stxblog-off' || h === '#stxblog-uit') { want = false; }
    try {
      if (want === true) { localStorage.setItem(BETA_KEY, '1'); }
      else if (want === false) { localStorage.removeItem(BETA_KEY); }
      return localStorage.getItem(BETA_KEY) === '1';
    } catch (e) { return want === true; }
  }
  if (inEditor()) { return; }
  if (BETA && !betaOn()) { return; }

  /* Opruimen: sleutels van de oude popup, bij bezoekers die er nog een hebben. */
  try { localStorage.removeItem('stx_blog_pin_v1'); localStorage.removeItem('stx_blog_pop_off'); } catch (e) {}

  /* ---- taal en pad ---- */
  var path = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
  var m = /^\/(fr|de|en_GB)(\/|$)/i.exec(path);
  var langPrefix = m ? '/' + m[1] : '';
  var rest = langPrefix ? path.slice(langPrefix.length) : path;
  var onBlog = rest === BLOG_ROOT || rest.indexOf(BLOG_ROOT + '/') === 0;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---- knop in de menurij (desktop) en in het uitklapmenu (mobiel) ---- */
  var blogHref = langPrefix + BLOG_ROOT;
  var deskMenu = document.querySelector('header#top nav.d-lg-block #top_menu, header#top nav.d-lg-block ul.top_menu');
  var mobMenu = document.querySelector('header#top .o_navbar_mobile ul.top_menu');
  if (!deskMenu && !mobMenu) { return; }
  var already = document.querySelector('header#top ul.top_menu a.nav-link[href$="' + BLOG_ROOT + '"]');
  if (already) { return; }

  if (deskMenu) {
    deskMenu.classList.add('stx-has-blog');
    var deskLi = document.createElement('li');
    deskLi.setAttribute('role', 'presentation');
    deskLi.className = 'nav-item stx-blog-item';
    deskLi.innerHTML = '<a role="menuitem" href="' + esc(blogHref) + '" class="nav-link' + (onBlog ? ' active' : '') + '"><span>Blog</span></a>';
    deskMenu.appendChild(deskLi);
  }
  if (mobMenu) {
    var last = mobMenu.querySelector(':scope > li.nav-item:last-of-type');
    if (last) { last.classList.remove('border-bottom'); }
    var mli = document.createElement('li');
    mli.setAttribute('role', 'presentation');
    mli.className = 'nav-item border-top border-bottom px-0 stx-blog-item-m';
    mli.innerHTML = '<a role="menuitem" href="' + esc(blogHref) + '" class="nav-link p-3 text-wrap' + (onBlog ? ' active' : '') + '"><span>Blog</span></a>';
    mobMenu.appendChild(mli);
  }
})();
</script>
