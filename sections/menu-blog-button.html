<!-- ============================================================
     STX EU / MENU "BLOG" KNOP + POPUP GEPIND ARTIKEL
     Dit blok staat INLINE in het einde-body Custom Code veld van
     Odoo (Instellingen > Website > Custom Code), net als de
     menu-gloed. Dit bestand is de kopie in de repo; de section
     loader laadt het NIET (de knop moet op elke pagina staan).

     Werking:
     - Desktop: in de menurij (Shop, Workshops, Inspiration, Tools,
       Why Sempertex?) komt HELEMAAL RECHTS een knop "Blog" met een
       licht paarse gloed. Link = /blog met de taalprefix van de
       pagina (en_GB, fr, de; nl zonder).
     - Links naast die knop verschijnt een kleine popup met de
       titel van het gepinde artikel (het artikel met
       data-featured="yes" in zijn meta-blok, anders het nieuwste).
       Titel in de taal van de pagina, max 2 regels met ... op het
       einde. Klik op de popup = naar het artikel. Kruisje = weg,
       en blijft weg tot er een ander artikel gepind wordt.
       Geen popup op /blog zelf of op het gepinde artikel.
     - Mobiel: "Blog" onderaan het uitklapmenu, met de gepinde
       titel er klein onder.
     - Data: eerst de cache in localStorage (stx_blog_pin_v1, 6
       uur; de blogpagina zelf schrijft die ook), anders de
       publieke site-zoekroute (/website/snippet/autocomplete,
       pages, term 'blog') en de artikelpagina's (op de achtergrond,
       na het laden). Vangnet: sitemap.xml. Op /blog zelf wordt
       niets opgehaald, daar wacht de knop op de blogpagina.
       PINNED_SLUG hieronder invullen = altijd dat artikel, en
       maar 1 extra request.

     BETA (nu uit, live sinds 16/09/2026): met BETA = true toont de knop alleen in een
     browser waar je een pagina opende met #stxblog achter de URL
     (onthouden in localStorage). #stxblog zet ook de cache en het
     weggeklikte kruisje terug, zodat je meteen de nieuwe pin ziet.
     #stxblog-uit zet het weer uit. Live voor iedereen: BETA op
     false zetten. Verwijderen = dit blok weghalen.
     Sinds 16/09/2026.
     ============================================================ -->
<style>
  /* Menurij: de lijst mag de volle breedte nemen zodat de knop rechts komt. */
  .navbar .top_menu.stx-has-blog { flex: 1 1 auto; width: 100%; }
  .navbar .top_menu > li.stx-blog-item { margin-left: auto; position: relative; }
  .navbar .top_menu > li.stx-blog-item > a.nav-link > span {
    display: inline-block;
    padding: 5px 18px;
    margin: -5px 0;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1.08em;
    color: #1b073d;
    background: rgba(241, 217, 255, 0.55);
    box-shadow: 0 0 0 2px #e1c6ff, 0 0 10px 3px rgba(107, 63, 185, 0.28);
    animation: stx-blog-glow 2.8s ease-in-out infinite;
  }
  .navbar .top_menu > li.stx-blog-item > a.nav-link:hover > span,
  .navbar .top_menu > li.stx-blog-item > a.nav-link.active > span {
    background: #6b3fb9;
    color: #fff;
    animation: none;
    box-shadow: 0 0 0 2px #e1c6ff, 0 0 14px 4px rgba(107, 63, 185, 0.45);
  }
  @keyframes stx-blog-glow {
    0%, 100% { box-shadow: 0 0 0 2px #e1c6ff, 0 0 8px 2px rgba(107, 63, 185, 0.22); }
    50% { box-shadow: 0 0 0 2px #e1c6ff, 0 0 14px 4px rgba(107, 63, 185, 0.42); }
  }

  /* Popup links van de knop (desktop) */
  .stx-blog-pop {
    position: absolute;
    right: 100%;
    top: 50%;
    transform: translate(12px, -50%);
    opacity: 0;
    pointer-events: none;
    width: max-content;
    max-width: 300px;
    margin-right: 14px;
    padding: 9px 30px 9px 12px;
    border-radius: 12px;
    background: #fff;
    color: #1b073d;
    text-align: left;
    line-height: 1.3;
    box-shadow: 0 0 0 1.5px #e1c6ff, 0 8px 22px rgba(27, 7, 61, 0.16), 0 0 16px 2px rgba(107, 63, 185, 0.18);
    transition: opacity .35s ease, transform .35s ease;
    z-index: 1051;
    font-family: 'Rethink Sans', 'Lato', sans-serif;
  }
  .stx-blog-pop.stx-on { opacity: 1; pointer-events: auto; transform: translate(0, -50%); }
  .stx-blog-pop::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 50%;
    width: 11px;
    height: 11px;
    margin-top: -6px;
    background: #fff;
    border-right: 1.5px solid #e1c6ff;
    border-top: 1.5px solid #e1c6ff;
    transform: rotate(45deg);
  }
  .stx-blog-pop a.stx-blog-pop-link { display: block; color: inherit; text-decoration: none; }
  .stx-blog-pop a.stx-blog-pop-link:hover .stx-blog-pop-title { color: #6b3fb9; }
  .stx-blog-pop .stx-blog-pop-kicker {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #cd0b5c;
    margin-bottom: 2px;
    white-space: nowrap;
  }
  .stx-blog-pop .stx-blog-pop-title {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 13px;
    font-weight: 600;
    white-space: normal;
  }
  .stx-blog-pop .stx-blog-pop-x {
    position: absolute;
    right: 6px;
    top: 6px;
    width: 20px;
    height: 20px;
    border: 0;
    border-radius: 50%;
    padding: 0;
    line-height: 20px;
    font-size: 14px;
    text-align: center;
    color: #6b3fb9;
    background: #f1d9ff;
    cursor: pointer;
  }
  .stx-blog-pop .stx-blog-pop-x:hover { background: #6b3fb9; color: #fff; }

  /* Mobiel uitklapmenu: Blog onderaan, met de gepinde titel er klein onder */
  .o_navbar_mobile .top_menu > li.stx-blog-item-m > a.nav-link > span {
    display: inline-block;
    padding: 3px 16px;
    margin: -3px 0;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1.08em;
    background: rgba(241, 217, 255, 0.55);
    box-shadow: 0 0 0 2px #e1c6ff, 0 0 8px 2px rgba(107, 63, 185, 0.25);
  }
  .o_navbar_mobile .stx-blog-pop-m {
    display: block;
    margin: -6px 16px 12px;
    font-size: 13px;
    line-height: 1.3;
    color: #1b073d;
    text-decoration: none;
    font-family: 'Rethink Sans', 'Lato', sans-serif;
  }
  .o_navbar_mobile .stx-blog-pop-m .stx-blog-pop-kicker {
    display: block; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #cd0b5c;
  }
  .o_navbar_mobile .stx-blog-pop-m .stx-blog-pop-title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600;
  }
  @media (prefers-reduced-motion: reduce) {
    .navbar .top_menu > li.stx-blog-item > a.nav-link > span { animation: none; }
    .stx-blog-pop { transition: none; }
  }
</style>
<script>
(function () {
  'use strict';
  var BETA = false;                // true = alleen na #stxblog (testmodus), false = live voor iedereen
  var BETA_KEY = 'stx_blog_beta';
  var PINNED_SLUG = '';            // optioneel: bv. '/blog/mijn-artikel' = altijd dit artikel (1 request)
  var BLOG_ROOT = '/blog';
  var CACHE_KEY = 'stx_blog_pin_v1';
  var CACHE_HOURS = 6;
  var DISMISS_KEY = 'stx_blog_pop_off';
  var MAX_ARTICLES = 30;
  var UI = {
    kicker: { nl: 'Uitgelicht op de blog', en: 'Featured on the blog', fr: 'A la une du blog', de: 'Im Blog empfohlen' },
    close:  { nl: 'Sluiten', en: 'Close', fr: 'Fermer', de: 'Schließen' }
  };

  /* ---- guards ---- */
  var isFile = window.location.protocol === 'file:';
  function inEditor() {
    try { if (window.frameElement) { return true; } } catch (e) { return true; }
    if (/enable_editor|debug=assets/.test(window.location.search)) { return true; }
    return document.body.classList.contains('editor_enable')
      || !!document.querySelector('.odoo-editor-editable')
      || !!document.querySelector('#wrap.o_editable');
  }
  function betaOn() {
    var h = (window.location.hash || '').toLowerCase();
    var want = null;
    if (h === '#stxblog' || h === '#stxblog=1' || h === '#stxblog-on' || h === '#stxblog-aan') { want = true; }
    else if (h === '#stxblog=0' || h === '#stxblog-off' || h === '#stxblog-uit') { want = false; }
    try {
      if (want === true) {
        localStorage.setItem(BETA_KEY, '1');
        localStorage.removeItem(CACHE_KEY);
        localStorage.removeItem(DISMISS_KEY);
      } else if (want === false) { localStorage.removeItem(BETA_KEY); }
      return localStorage.getItem(BETA_KEY) === '1';
    } catch (e) { return want === true; }
  }
  if (inEditor()) { return; }
  if (BETA && !betaOn()) { return; }

  /* ---- taal en pad ---- */
  var path = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
  var m = /^\/(fr|de|en_GB)(\/|$)/i.exec(path);
  var langPrefix = m ? '/' + m[1] : '';
  var LANG = m ? (m[1].toLowerCase() === 'en_gb' ? 'en' : m[1].toLowerCase()) : 'nl';
  var rest = langPrefix ? path.slice(langPrefix.length) : path;
  var onBlog = rest === BLOG_ROOT || rest.indexOf(BLOG_ROOT + '/') === 0;
  function T(o) { return (o && (o[LANG] || o.en || o.nl)) || ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---- knop in de menurij (desktop) en in het uitklapmenu (mobiel) ---- */
  var blogHref = langPrefix + BLOG_ROOT;
  var deskMenu = document.querySelector('header#top nav.d-lg-block #top_menu, header#top nav.d-lg-block ul.top_menu');
  var mobMenu = document.querySelector('header#top .o_navbar_mobile ul.top_menu');
  if (!deskMenu && !mobMenu) { return; }
  var already = document.querySelector('header#top ul.top_menu a.nav-link[href$="' + BLOG_ROOT + '"]');
  if (already) { return; }

  var deskLi = null, pop = null, mobLine = null;
  if (deskMenu) {
    deskMenu.classList.add('stx-has-blog');
    deskLi = document.createElement('li');
    deskLi.setAttribute('role', 'presentation');
    deskLi.className = 'nav-item stx-blog-item';
    deskLi.innerHTML = '<a role="menuitem" href="' + esc(blogHref) + '" class="nav-link' + (onBlog ? ' active' : '') + '"><span>Blog</span></a>'
      + '<div class="stx-blog-pop" hidden></div>';
    deskMenu.appendChild(deskLi);
    pop = deskLi.querySelector('.stx-blog-pop');
  }
  if (mobMenu) {
    var last = mobMenu.querySelector(':scope > li.nav-item:last-of-type');
    if (last) { last.classList.remove('border-bottom'); }
    var mli = document.createElement('li');
    mli.setAttribute('role', 'presentation');
    mli.className = 'nav-item border-top border-bottom px-0 stx-blog-item-m';
    mli.innerHTML = '<a role="menuitem" href="' + esc(blogHref) + '" class="nav-link p-3 text-wrap' + (onBlog ? ' active' : '') + '"><span>Blog</span></a>'
      + '<a class="stx-blog-pop-m" hidden></a>';
    mobMenu.appendChild(mli);
    mobLine = mli.querySelector('.stx-blog-pop-m');
  }

  /* ---- gepind artikel tonen ---- */
  function dismissedFor() { try { return localStorage.getItem(DISMISS_KEY) || ''; } catch (e) { return ''; } }
  function showPin(pin) {
    if (!pin || !pin.slug || !pin.title) { return; }
    var href = langPrefix + pin.slug;
    var inner = '<span class="stx-blog-pop-kicker">' + esc(T(UI.kicker)) + '</span>'
      + '<span class="stx-blog-pop-title">' + esc(pin.title) + '</span>';
    if (mobLine) {
      mobLine.href = href;
      mobLine.innerHTML = inner;
      mobLine.hidden = false;
    }
    if (pop && !onBlog && rest !== pin.slug && dismissedFor() !== pin.slug) {
      pop.innerHTML = '<a class="stx-blog-pop-link" href="' + esc(href) + '">' + inner + '</a>'
        + '<button type="button" class="stx-blog-pop-x" aria-label="' + esc(T(UI.close)) + '" title="' + esc(T(UI.close)) + '">&times;</button>';
      pop.hidden = false;
      pop.querySelector('.stx-blog-pop-x').addEventListener('click', function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        pop.classList.remove('stx-on');
        try { localStorage.setItem(DISMISS_KEY, pin.slug); } catch (e) {}
        setTimeout(function () { pop.hidden = true; }, 400);
      });
      requestAnimationFrame(function () { setTimeout(function () { pop.classList.add('stx-on'); }, 250); });
    }
  }

  /* ---- data: sessiecache van de blog > localStorage cache > sitemap + artikelpagina's ---- */
  function readCache() {
    try {
      var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (c && c.slug && c.titles && (Date.now() - c.t) < CACHE_HOURS * 3600000) { return c; }
    } catch (e) {}
    return null;
  }
  function writeCache(c) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch (e) {} }
  function fromBlogSession() {
    try {
      var c = JSON.parse(sessionStorage.getItem('stxBlogIndex_v4_' + LANG) || 'null');
      if (!c || !c.items || !c.items.length) { return null; }
      var feat = null;
      c.items.some(function (it) { if (it.featured && it.published !== false) { feat = it; return true; } return false; });
      if (!feat) { c.items.some(function (it) { if (it.published !== false) { feat = it; return true; } return false; }); }
      return feat && feat.slug && feat.title ? { slug: feat.slug, title: feat.title } : null;
    } catch (e) { return null; }
  }
  function fetchText(url) {
    return fetch(url, { credentials: 'omit', cache: 'default' }).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; });
  }
  function titleFrom(html, slug) {
    if (!html) { return ''; }
    var d = new DOMParser().parseFromString(html, 'text/html');
    var wrap = d.querySelector('#wrap') || d.body;
    var h1 = wrap.querySelector('h1');
    var t = h1 ? (h1.textContent || '').replace(/\s+/g, ' ').trim() : '';
    if (!t) { t = (d.querySelector('title') ? d.querySelector('title').textContent : '').replace(/\s*\|.*$/, '').trim(); }
    return t || slug.split('/').pop().replace(/-/g, ' ');
  }
  /* Publieke zoekroute van de site: alle gepubliceerde /blog/... pagina's in 1 request. */
  function slugsFromSearch() {
    return fetch('/website/snippet/autocomplete', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method: 'call', params: {
        search_type: 'pages', term: BLOG_ROOT.replace(/^\//, ''), order: 'name asc', limit: 100, max_nb_chars: 40,
        options: { displayDescription: false, displayDetail: false, displayExtraLink: false, displayImage: false, allowFuzzy: false }
      }})
    }).then(function (r) { return r.json(); }).then(function (d) {
      var res = d && d.result && d.result.results;
      if (!res || !res.length) { throw 0; }
      var out = [], seen = {};
      res.forEach(function (x) {
        var p = String(x.website_url || '').split('?')[0].replace(/^\/(fr|de|en_GB)(?=\/)/, '').replace(/\/+$/, '');
        if (p.indexOf(BLOG_ROOT + '/') === 0 && !seen[p]) { seen[p] = 1; out.push(p); }
      });
      if (!out.length) { throw 0; }
      return out.slice(0, MAX_ARTICLES);
    });
  }
  function slugsFromSitemap() {
    return fetchText('/sitemap.xml?stx=' + Date.now()).then(function (xml) {
      var doc = new DOMParser().parseFromString(xml, 'text/xml');
      var locs = [].slice.call(doc.querySelectorAll('loc')).map(function (n) { return n.textContent.trim(); });
      var next = doc.querySelector('sitemapindex')
        ? Promise.all(locs.slice(0, 5).map(fetchText)).then(function (parts) {
            var all = [];
            parts.forEach(function (x) {
              var d2 = new DOMParser().parseFromString(x, 'text/xml');
              [].slice.call(d2.querySelectorAll('url > loc')).forEach(function (n) { all.push(n.textContent.trim()); });
            });
            return all;
          })
        : Promise.resolve(locs);
      return next.then(function (urls) {
        var out = [], seen = {};
        urls.forEach(function (u) {
          var p; try { p = new URL(u).pathname; } catch (e) { return; }
          p = p.replace(/^\/(fr|de|en_GB)(?=\/)/, '');
          if (p.indexOf(BLOG_ROOT + '/') === 0 && p !== BLOG_ROOT && !seen[p]) { seen[p] = 1; out.push(p); }
        });
        return out.slice(0, MAX_ARTICLES);
      });
    });
  }
  function findPinnedSlug() {
    if (PINNED_SLUG) { return Promise.resolve(PINNED_SLUG); }
    return slugsFromSearch().catch(function () { return slugsFromSitemap(); }).catch(function () { return []; }).then(function (slugs) {
      if (!slugs.length) { return ''; }
      /* Meta-blok altijd uit de standaardtaal (zonder prefix), net als de blogpagina. */
      return Promise.all(slugs.map(function (slug) {
        return fetchText(slug).then(function (html) {
          if (!html) { return null; }
          var d = new DOMParser().parseFromString(html, 'text/html');
          var meta = d.querySelector('.stx-blog-meta');
          return { slug: slug, featured: !!meta && meta.getAttribute('data-featured') === 'yes', date: meta ? (meta.getAttribute('data-date') || '') : '' };
        });
      })).then(function (items) {
        items = items.filter(Boolean);
        items.sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
        var feat = null;
        items.some(function (it) { if (it.featured) { feat = it; return true; } return false; });
        if (!feat) { feat = items[0]; }
        return feat ? feat.slug : '';
      });
    });
  }
  function resolvePin() {
    var s = fromBlogSession();
    if (s) { return Promise.resolve(s); }
    var c = readCache();
    if (c && c.titles[LANG]) { return Promise.resolve({ slug: c.slug, title: c.titles[LANG] }); }
    var pSlug = c ? Promise.resolve(c.slug) : findPinnedSlug();
    return pSlug.then(function (slug) {
      if (!slug) { return null; }
      return fetchText(langPrefix + slug).then(function (html) {
        var title = titleFrom(html, slug);
        var nc = (c && c.slug === slug) ? c : { t: Date.now(), slug: slug, titles: {} };
        nc.titles[LANG] = title;
        writeCache(nc);
        return { slug: slug, title: title };
      });
    });
  }
  /* Op /blog zelf haalt de blogpagina de lijst al op en schrijft ze de pin weg; hier alleen wachten. */
  function waitForBlogPin(tries) {
    var c = readCache();
    if (c && c.titles[LANG]) { showPin({ slug: c.slug, title: c.titles[LANG] }); return; }
    if (tries > 0) { setTimeout(function () { waitForBlogPin(tries - 1); }, 1000); }
  }
  function start() {
    if (isFile) { showPin({ slug: '/blog/test-artikel', title: 'Test: een lange titel van een gepind artikel om de puntjes op het einde te controleren, zo dus' }); return; }
    if (onBlog) { waitForBlogPin(25); return; }
    resolvePin().then(showPin).catch(function () {});
  }
  if (document.readyState === 'complete') { setTimeout(start, 800); }
  else { window.addEventListener('load', function () { setTimeout(start, 800); }); }
})();
</script>
