<!-- ============================================================
     STX EU / TEAM PAGINA v1
     Bestand hoort in de repo onder /sections/ en wordt door de
     stx-loader geladen op /team (alle talen). NIET los in Odoo plakken.

     GEBOUWD met code/build-shadow-section.py uit Robins losse pagina
     (sempertex-team-pagina.html). Niet met de hand aanpassen: pas de losse pagina aan
     en bouw opnieuw, anders ben je de wijziging bij de volgende
     build kwijt.

     Werking: de pagina staat in een shadow root, in #wrap. Daardoor
     raakt de CSS van de pagina (body, h2, section, footer, *) de rest
     van de site niet, en de CSS van Odoo deze pagina niet. Wat Odoo
     zelf in #wrap heeft staan, wordt verborgen (niet gewist): in de
     editor zie je het nog en doet dit bestand niets.
     Links naar www.sempertexeurope.com krijgen de taalprefix van de
     pagina (/en_GB, /fr, /de). Beelden staan in assets/team/,
     op dezelfde commit als de loader.
     ============================================================ -->

<template id="stx-team-tpl">
<style>
:host { all: initial; display: block; overflow-x: clip; }
.stx-doc { display: block; }
/* Sempertex Europe document system. Do not modify. Inlined by scripts/build_html.py */
:host {
  --purple: #6b3fb9;
  --purple-light: #f1d9ff;
  --purple-bg: #faf4ff;
  --dark: #1b073d;
  --yellow: #ffdb5a;
  --yellow-soft: #fff4d6;
  --warn: #cd0b5c;
  --paper: #fefcfa;
  --white: #ffffff;
  --rule: #e8dcf5;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
:host { scroll-behavior: smooth; }

.stx-doc {
  font-family: 'Rethink Sans', sans-serif;
  background: var(--paper);
  color: var(--dark);
  line-height: 1.55;
  font-size: 17px;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 880px; margin: 0 auto; padding: 80px 48px 120px; }

/* HEADER */
header.hero { padding: 20px 0 64px; border-bottom: 2px solid var(--dark); margin-bottom: 80px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--purple); margin-bottom: 24px; }
h1.title { font-size: clamp(52px, 8vw, 96px); font-weight: 800; line-height: 0.95; letter-spacing: -0.03em; margin-bottom: 32px; }
.hl { background: var(--yellow); padding: 0 0.15em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.dark-hl { background: var(--dark); color: var(--yellow); padding: 0 0.15em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

/* SECTIONS */
section { margin-bottom: 88px; }
.sec-num { font-size: 120px; font-weight: 800; line-height: 0.85; color: var(--purple-light); letter-spacing: -0.04em; margin-bottom: -40px; position: relative; z-index: 0; }
h2 { font-size: clamp(34px, 5vw, 48px); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 28px; position: relative; z-index: 1; }
h3 { font-size: 22px; font-weight: 700; margin: 32px 0 12px; line-height: 1.25; letter-spacing: -0.01em; }

/* BODY */
p { margin-bottom: 18px; max-width: 68ch; }
p.lead { font-size: 20px; font-weight: 500; line-height: 1.5; margin-bottom: 24px; }
strong { font-weight: 700; color: var(--dark); }
em { font-style: italic; }
a { color: var(--purple); }

/* PULL QUOTE */
.pull { font-size: 26px; font-weight: 700; line-height: 1.3; color: var(--purple); border-left: 4px solid var(--yellow); padding: 4px 0 4px 24px; margin: 32px 0; max-width: 62ch; letter-spacing: -0.01em; }

/* QUOTE BOX */
.quote-box { background: var(--purple-bg); border-left: 4px solid var(--purple); padding: 24px 28px; margin: 24px 0; border-radius: 0 8px 8px 0; }
.quote-box p:last-of-type { margin-bottom: 0; }
.quote-box .attr { margin-top: 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--purple); }

/* LISTS */
ul.clean, ol.clean { list-style: none; margin: 16px 0 24px; }
ul.clean li, ol.clean li { position: relative; padding-left: 32px; margin-bottom: 14px; max-width: 68ch; }
ul.clean li::before { content: ""; position: absolute; left: 0; top: 11px; width: 14px; height: 2px; background: var(--purple); }
ol.clean { counter-reset: step; }
ol.clean li { counter-increment: step; padding-left: 44px; }
ol.clean li::before { content: counter(step, decimal-leading-zero); position: absolute; left: 0; top: 0; font-size: 14px; font-weight: 700; color: var(--purple); letter-spacing: 0.05em; }

/* PAIR GRID */
.pair-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 32px 0; }
.pair { background: var(--paper); border: 2px solid var(--dark); padding: 24px; border-radius: 6px; position: relative; }
.pair .plus { position: absolute; top: -16px; left: 20px; background: var(--yellow); color: var(--dark); font-weight: 800; padding: 2px 10px; font-size: 12px; letter-spacing: 0.08em; border-radius: 4px; }
.pair h4 { font-size: 20px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.01em; }
.pair p { font-size: 15px; line-height: 1.5; color: var(--dark); opacity: 0.85; margin: 0; }

/* STAT GRID (numbers, KPIs) */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin: 32px 0; }
.stat { background: var(--purple-bg); border-radius: 8px; padding: 24px; }
.stat .num { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; color: var(--dark); }
.stat .num .unit { font-size: 20px; font-weight: 700; color: var(--purple); margin-left: 2px; }
.stat .lbl { margin-top: 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--purple); }
.stat .note { margin-top: 6px; font-size: 14px; line-height: 1.4; opacity: 0.8; }
.stat.is-key { background: var(--yellow); }
.stat.is-key .lbl, .stat.is-key .num .unit { color: var(--dark); }

/* DATA TABLE */
.table-scroll { overflow-x: auto; margin: 24px 0 32px; break-inside: avoid; }
table.data { width: 100%; border-collapse: collapse; font-size: 15px; }
table.data th { text-align: left; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--purple); padding: 10px 14px; border-bottom: 2px solid var(--dark); white-space: nowrap; }
table.data td { padding: 12px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.data tr:nth-child(even) td { background: var(--purple-bg); }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.total td { font-weight: 800; background: var(--yellow-soft); border-top: 2px solid var(--dark); border-bottom: none; }
table.data td.neg { color: var(--warn); font-weight: 700; }

/* FORBIDDEN GRID */
.forbidden-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 24px 0 0; }
.forbidden { background: var(--white); border: 2px solid var(--warn); padding: 14px 18px; border-radius: 6px; font-weight: 600; font-size: 15px; position: relative; }
.forbidden::before { content: "×"; color: var(--warn); font-weight: 800; margin-right: 8px; font-size: 18px; }

/* SLIDE / CASE STUDY */
.case-intro { background: var(--purple-bg); padding: 32px 36px; border-radius: 8px; margin: 24px 0 40px; }
.case-intro p { margin-bottom: 10px; }
.case-intro p:last-child { margin-bottom: 0; }
.slide-block { display: grid; grid-template-columns: 320px 1fr; gap: 40px; margin: 48px 0; align-items: start; }
.slide-block img { width: 100%; border-radius: 8px; box-shadow: 0 12px 40px rgba(27, 7, 61, 0.12); display: block; }
.img-placeholder { width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; background: var(--purple-light); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--purple); text-align: center; padding: 16px; }
.slide-num { font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--purple); margin-bottom: 8px; }
.slide-verdict { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 14px; }
.verdict-strong { background: var(--dark); color: var(--yellow); }
.verdict-ok { background: var(--purple-light); color: var(--dark); }
.verdict-weak { background: var(--yellow-soft); color: var(--dark); border: 1px solid var(--yellow); }
.slide-block h3 { margin-top: 0; font-size: 24px; line-height: 1.2; }
.slide-block p { font-size: 16px; margin-bottom: 12px; }

/* PRINCIPLE BANNER */
.principle { background: var(--dark); color: var(--paper); padding: 48px 40px; border-radius: 8px; margin: 48px 0; position: relative; overflow: hidden; }
.principle .label { font-size: 12px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--yellow); margin-bottom: 16px; }
.principle .statement { font-size: clamp(28px, 4vw, 40px); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
.principle .statement .hl { background: var(--yellow); color: var(--dark); }

/* TWO COL */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin: 32px 0; }
.role-card { padding: 28px; border-radius: 8px; }
.role-frame { background: var(--purple-bg); border: 2px solid var(--purple); }
.role-fill { background: var(--white); border: 2px solid var(--dark); }
.role-card .role-label { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--purple); margin-bottom: 10px; }
.role-fill .role-label { color: var(--dark); }
.role-card h4 { font-size: 22px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.01em; }
.role-card ul { list-style: none; font-size: 15px; }
.role-card ul li { padding: 4px 0 4px 16px; position: relative; }
.role-card ul li::before { content: ""; position: absolute; left: 0; top: 15px; width: 8px; height: 2px; background: var(--purple); }

/* CLOSING */
.closing { background: var(--yellow); padding: 56px 48px; border-radius: 8px; margin: 64px 0 0; }
.closing h2 { font-size: clamp(36px, 5vw, 52px); margin-bottom: 24px; }
.closing p { font-size: 19px; font-weight: 500; margin-bottom: 16px; max-width: 68ch; }
.closing .pull { border-left-color: var(--dark); color: var(--dark); }
.closing ul.clean li::before { background: var(--dark); }

/* TOC */
.toc { background: var(--purple-bg); padding: 32px 36px; border-radius: 8px; margin-bottom: 80px; }
.toc .toc-label { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--purple); margin-bottom: 16px; }
.toc ol { list-style: none; counter-reset: toc; }
.toc ol li { counter-increment: toc; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 16px; font-weight: 600; display: flex; gap: 20px; }
.toc ol li:last-child { border-bottom: none; }
.toc ol li::before { content: counter(toc, decimal-leading-zero); color: var(--purple); font-weight: 800; min-width: 28px; }
.toc a { color: var(--dark); text-decoration: none; }
.toc a:hover { color: var(--purple); }

/* FOOTER */
footer { margin-top: 120px; padding-top: 32px; border-top: 2px solid var(--dark); font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--dark); opacity: 0.6; display: flex; justify-content: space-between; }

/* RESPONSIVE */
@media screen and (max-width: 720px) {
  .wrap { padding: 48px 24px 80px; }
  .slide-block { grid-template-columns: 1fr; gap: 20px; }
  .slide-block img { max-width: 320px; }
  .two-col { grid-template-columns: 1fr; }
  .sec-num { font-size: 80px; margin-bottom: -28px; }
  .meta { flex-direction: column; gap: 12px; }
  .closing { padding: 40px 28px; }
}

/* PRINT / PDF (A4). Margins come from @page, so .wrap loses its padding. */
@page { size: A4; margin: 18mm 17mm 20mm; }
@media print {
  :host { --paper: #ffffff; } /* page margins print white, so paper surfaces match them */

  .wrap { max-width: none; padding: 0; }
  header.hero { padding: 0 0 40px; margin-bottom: 48px; }
  h1.title { font-size: 60px; margin-bottom: 24px; }
  .lede { font-size: 18px; }
  .meta { margin-top: 28px; font-size: 11px; }
  section { margin-bottom: 56px; }
  .sec-num { font-size: 92px; margin-bottom: -30px; }
  h2 { font-size: 34px; margin-bottom: 20px; break-after: avoid; }
  h3 { font-size: 19px; break-after: avoid; }
  .sec-num { break-after: avoid; }
  p.lead { font-size: 17px; }
  .pull { font-size: 21px; margin: 24px 0; }
  .principle { padding: 36px 32px; margin: 32px 0; }
  .principle .statement { font-size: 30px; }
  .closing { padding: 40px 36px; margin-top: 40px; }
  .closing h2 { font-size: 36px; }
  .closing p { font-size: 16px; }
  .toc { margin-bottom: 48px; padding: 24px 28px; }
  .toc ol li { font-size: 14px; padding: 6px 0; }
  .pair h4, .role-card h4 { font-size: 18px; }
  .stat .num { font-size: 36px; }
  table.data { font-size: 13px; }
  .pair, .stat, .forbidden, .role-card, .quote-box, .pull, .principle, .closing, .slide-block, .case-intro, .toc, table.data tr, li { break-inside: avoid; }
  .pair-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .pair { padding: 20px; }
  .two-col { gap: 20px; }
  .role-card { padding: 22px; }
  .slide-block { grid-template-columns: 250px 1fr; gap: 28px; margin: 32px 0; }
  .page-break { break-before: page; }
  footer { display: none; } /* page footer comes from html_to_pdf.py */
  a { text-decoration: none; }
}

  Array.prototype.forEach.call(root.querySelectorAll('a[href^="https://www.sempertexeurope.com/"]'), function (a) {
    a.href = prefix + a.getAttribute('href').slice(31);
  });

  Array.prototype.forEach.call(target.children, function (el) { el.style.display = 'none'; });
  target.appendChild(host);

  /* Hoogte van een vaste Odoo-header, zodat sticky balken en ankers eronder blijven. */
  function headerOffset() {
    var h = document.querySelector('header#top');
    if (!h) { return 0; }
    var pos = window.getComputedStyle(h).position;
    if (pos !== 'fixed' && pos !== 'sticky') { return 0; }
    return Math.max(0, Math.round(h.getBoundingClientRect().bottom));
  }
  var ticking = false;
  function syncTop() {
    ticking = false;
    host.style.setProperty('--stx-top', headerOffset() + 'px');
  }
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(syncTop); } }, { passive: true });
  window.addEventListener('resize', syncTop);
  syncTop();

  /* Ankerlinks (#ceo, #exam): de browser vindt ids in een shadow root niet zelf. */
  root.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) { return; }
    var el = root.getElementById(a.getAttribute('href').slice(1));
    if (!el) { return; }
    e.preventDefault();
    var nav = root.querySelector('.dept-nav');
    var extra = nav ? nav.offsetHeight : 16;
    var y = el.getBoundingClientRect().top + window.pageYOffset - headerOffset() - extra - 8;
    window.scrollTo({ top: y, behavior: 'smooth' });
  });

  /* Ontbrekende portretfoto: dan blijven de initialen staan. */
  Array.prototype.forEach.call(root.querySelectorAll('.portrait img'), function (img) {
    img.addEventListener('error', function () { img.classList.add('is-missing'); });
    if (img.complete && img.naturalWidth === 0) { img.classList.add('is-missing'); }
  });

})();
</script>
